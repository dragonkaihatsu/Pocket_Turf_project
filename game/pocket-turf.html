<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポケットターフ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&display=swap">
<style>
/* ===========================================================
   ポケットターフ — 単一ビジュアル世界（夜のアーケード筐体）に
   コミットした設計。テーマ切替はせず、全色を明示的に塗る。
   =========================================================== */
:root{
  /* 鈍い金（真鍮）の筐体に、明るい緑の画面をはめ込んだ配色 */
  --brass:#b8933f;      /* 外枠の鈍い金 */
  --brass-hi:#e3c67c;
  --brass-lo:#6d5622;
  --shell:#1a1d16;      /* 筐体ボディ */
  --shell-2:#262a1f;
  --shell-edge:#0b0d08;
  --hinge:#131610;
  --screen:#0b3020;     /* 上画面：明るい緑 */
  --panel:#0d2b1b;      /* 下画面：明るい緑 */
  --panel-2:#154028;
  --panel-3:#1e5636;
  --line:#2f7048;
  --ink:#eaf7ec;
  --ink-2:#a3ccb2;
  --ink-3:#6ea486;
  --gold:#f4c44a;       /* メダル金＝主役アクセント */
  --gold-2:#a87f1c;
  --cyan:#6fe0ee;       /* LEDオッズ盤 */
  --turf:#48c873;
  --turf-2:#1f6b3d;
  --dirt:#b5854f;
  --hot:#ff7a52;
  --ok:#6ff0a0;
  --w1:#f2f2f2; --w2:#1c1c1c; --w3:#e0334a; --w4:#2b6fd6;
  --w5:#e8c72e; --w6:#2e9b57; --w7:#e8802e; --w8:#ef8fb0;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(120% 80% at 50% 0%, #1d2118 0%, #0c0e08 55%, #050603 100%);
  color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow:hidden;
  touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- 筐体 ---------- */
/* 筐体そのものを鈍い金の枠で囲う */
.console{
  position:fixed;
  top:calc(env(safe-area-inset-top) + 4px);
  bottom:calc(env(safe-area-inset-bottom) + 4px);
  left:4px; right:4px;
  display:flex; flex-direction:column;
  max-width:480px; margin:0 auto;
  padding:7px;
  gap:6px;
  border-radius:18px;
  border:2px solid var(--brass);
  background:linear-gradient(160deg,var(--shell-2),var(--shell) 45%,var(--shell-edge));
  box-shadow:
    0 0 0 1px var(--brass-lo) inset,
    0 1px 0 rgba(227,198,124,.28) inset,
    0 0 26px rgba(184,147,63,.16),
    0 10px 30px rgba(0,0,0,.6);
}
.bezel{
  border-radius:14px;
  background:linear-gradient(#2a2c20,#16180f);
  border:1px solid var(--brass-lo);
  box-shadow:0 1px 0 rgba(227,198,124,.20) inset, 0 -1px 0 #07080a inset, 0 6px 18px rgba(0,0,0,.5);
  padding:7px;
}

/* ---------- 上画面 ---------- */
.top{
  flex:0 0 auto;
  position:relative;
  aspect-ratio:4/3;
  max-height:44dvh;
  min-height:170px;
}
.top .glass{
  position:relative; height:100%; width:100%;
  border-radius:8px; overflow:hidden;
  background:var(--screen);
  box-shadow:0 0 0 1px #000 inset, 0 0 24px rgba(90,240,150,.10) inset;
}
#cv{display:block;width:100%;height:100%}
.crt{
  position:absolute; inset:0; pointer-events:none;
  background:
    repeating-linear-gradient(180deg, rgba(0,0,0,.20) 0 1px, rgba(0,0,0,0) 1px 3px),
    radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
  mix-blend-mode:multiply;
}
.hud{
  position:absolute; left:0; right:0; top:0;
  display:flex; justify-content:space-between; align-items:flex-start; gap:6px;
  padding:6px 7px; pointer-events:none;
}
.hud .chip{
  font-family:"DotGothic16",monospace;
  font-size:11px; letter-spacing:.04em;
  background:rgba(4,10,8,.72); border:1px solid rgba(95,216,232,.35);
  color:var(--cyan); padding:2px 6px; border-radius:3px; white-space:nowrap;
}
.hud .chip b{color:#fff;font-weight:400}
.hud .chip.gold{border-color:rgba(244,196,74,.45);color:var(--gold)}
.ticker{
  position:absolute; left:0; right:0; bottom:0;
  font-family:"DotGothic16",monospace; font-size:12px; line-height:1.5;
  padding:5px 8px calc(5px + 2px);
  color:#d8ffe6; background:linear-gradient(rgba(3,10,7,0), rgba(3,10,7,.88) 40%);
  min-height:34px; pointer-events:none;
}
.ticker .cur{color:var(--gold)}
/* 全体マップ */
/* 全体マップ＝アーケードの位置表示板 */
.trackmap{
  position:absolute; left:7px; right:7px; top:31px; height:15px;
  pointer-events:none; border-radius:3px;
  background:rgba(3,9,7,.66); border:1px solid rgba(95,216,232,.22);
  padding:0 5px;
}
.trackmap .rail{
  position:absolute; left:5px; right:5px; top:6px; height:2px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 5px,transparent 5px 10px);
}
.trackmap .goal{position:absolute; top:2px; bottom:2px; width:2px; right:4px; background:var(--gold)}
/* コース構成：コーナー＝斜線、直線＝金の帯、坂＝▲ */
.trackmap .corner{
  position:absolute; top:2px; bottom:2px; border-radius:2px;
  background:repeating-linear-gradient(-50deg,rgba(255,255,255,.10) 0 2px,transparent 2px 5px);
}
.trackmap .corner.last{background:repeating-linear-gradient(-50deg,rgba(255,255,255,.20) 0 2px,transparent 2px 5px)}
.trackmap .straightz{position:absolute; top:2px; bottom:2px; background:rgba(244,196,74,.16); border-radius:2px}
.trackmap .hill{
  position:absolute; top:3px; width:0; height:0;
  border-left:4px solid transparent; border-right:4px solid transparent;
  border-bottom:7px solid rgba(255,107,74,.7);
}
.trackmap i{
  position:absolute; width:7px; height:7px; border-radius:50%; top:3px;
  transform:translateX(-50%); border:1px solid rgba(0,0,0,.6);
}
.trackmap i.me{width:9px;height:9px;top:2px;box-shadow:0 0 0 2px rgba(244,196,74,.9)}

/* レース中の隊列表示 */
.lv{
  display:flex; align-items:center; gap:6px; padding:2px 0; font-size:11px;
  font-family:"DotGothic16",monospace; font-variant-numeric:tabular-nums;
}
.lv .p{width:15px; text-align:right; color:var(--ink-3)}
.lv .u{
  width:15px;height:15px;border-radius:3px;display:grid;place-items:center;
  font-size:9px;flex:0 0 auto;border:1px solid rgba(0,0,0,.55);
}
.lv .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.lv .d{color:var(--cyan)}
.lv.me .n{color:var(--gold);font-weight:700}
.lv.me .p{color:var(--gold)}

/* ---------- ヒンジ ---------- */
.hinge{
  flex:0 0 auto;
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:0 10px; height:34px;
  border-radius:8px;
  background:linear-gradient(#22241a,#101208);
  border:1px solid var(--brass-lo);
  box-shadow:0 1px 0 rgba(227,198,124,.22) inset;
}
.logo{
  font-family:"Dela Gothic One",sans-serif;
  font-size:13px; letter-spacing:.02em;
  white-space:nowrap; overflow:hidden; flex:0 1 auto; min-width:0;
  background:linear-gradient(#ffe9a8,#d9a52c);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.meters{display:flex;align-items:center;gap:9px;flex:0 0 auto;white-space:nowrap;
  font-family:"DotGothic16",monospace;font-size:12px}
/* 「12月2週」で日付が長くなったぶん、狭い端末ではロゴを隠して数字を優先する */
@media (max-width:360px){
  .logo{display:none}
  .meters{gap:7px;font-size:11.5px}
}
.meters .m{color:var(--ink-2)}
.meters .m b{color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}
.meters .medal b{color:var(--gold)}
.meters .medal::before{
  content:"◉"; color:var(--gold); margin-right:3px; font-size:11px;
}
.mute{font-size:14px;color:var(--ink-3);padding:2px 4px;line-height:1}
.mute[aria-pressed="true"]{color:var(--cyan)}

/* ---------- 下画面 ---------- */
.bot{flex:1 1 auto; min-height:0; display:flex}
.bot .glass{
  flex:1; min-height:0; display:flex; flex-direction:column; position:relative;
  border-radius:8px; overflow:hidden;
  background:var(--panel);
  box-shadow:0 0 0 1px #000 inset;
}
.toast{
  position:absolute; left:50%; top:12px; z-index:5; max-width:86%; text-align:center;
  transform:translateX(-50%) translateY(-8px); opacity:0;
  background:#173a26; border:1px solid var(--gold); color:var(--gold);
  padding:8px 16px; border-radius:99px; font-size:12px; font-weight:700;
  box-shadow:0 6px 20px rgba(0,0,0,.55); pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){ .toast{transform:translateX(-50%)} }
#panel{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px}
nav.tabs{
  flex:0 0 auto; display:flex; border-top:1px solid var(--line);
  background:var(--panel-2);
}
nav.tabs button{
  flex:1; padding:11px 4px 12px; font-size:12px; color:var(--ink-3);
  letter-spacing:.14em; font-weight:600;
  border-top:2px solid transparent;
}
nav.tabs button[aria-selected="true"]{color:var(--gold);border-top-color:var(--gold);background:#17402a}
nav.tabs[hidden]{display:none}

/* ---------- パネル共通 ---------- */
h2.head{
  margin:0 0 8px; font-family:"Dela Gothic One",sans-serif;
  font-size:15px; letter-spacing:.01em; color:var(--ink); text-wrap:balance;
}
.eyebrow{
  font-family:"DotGothic16",monospace; font-size:10px; letter-spacing:.14em;
  color:var(--ink-3); text-transform:uppercase; margin:0 0 2px;
}
.card{
  background:var(--panel-2); border:1px solid var(--line); border-radius:9px;
  padding:10px; margin-bottom:9px;
}
.card.tight{padding:8px}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.muted{color:var(--ink-2);font-size:12px;line-height:1.6}
.dot{font-family:"DotGothic16",monospace;font-variant-numeric:tabular-nums}
.num{font-family:"DotGothic16",monospace;font-variant-numeric:tabular-nums}

.btn{
  display:flex;flex-direction:column;justify-content:center;gap:2px;
  min-height:46px; padding:8px 10px; border-radius:8px;
  background:linear-gradient(#1b4a2e,#123a24);
  border:1px solid var(--line); color:var(--ink);
  font-size:13px; font-weight:600; text-align:left;
  transition:transform .06s ease, filter .12s ease;
}
.btn:active{transform:translateY(1px);filter:brightness(1.25)}
.btn small{font-weight:400;font-size:10.5px;color:var(--ink-2);letter-spacing:.02em}
.btn.center{align-items:center;text-align:center}
.btn.primary{
  background:linear-gradient(#f6cf5f,#d7a022); border-color:#f0d692; color:#2a1e02;
}
.btn.primary small{color:#5c4508}
.btn.ghost{background:#102a1b;border-color:var(--line);color:var(--ink-2);font-weight:500}
.btn.danger{border-color:#6b332e;color:#ffab97;background:#26160f}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn.wide{width:100%}

/* ステータスバー */
.stat{display:grid;grid-template-columns:56px 1fr 30px;align-items:center;gap:7px;margin:5px 0}
.stat .lb{font-size:10.5px;color:var(--ink-2);white-space:nowrap}
.stat .bar{height:7px;border-radius:4px;background:#07190f;overflow:hidden;box-shadow:0 0 0 1px #24583a inset}
.stat .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#2f9a63,#6ff0a0)}
.stat .vl{font-size:11px;text-align:right;color:var(--ink)}
.gauge{display:block;height:9px;border-radius:5px;background:#07190f;overflow:hidden;box-shadow:0 0 0 1px #24583a inset}
.gauge i{display:block;height:100%;transition:width .25s ease}

.pill{
  display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:99px;
  font-size:10.5px;font-weight:600;border:1px solid;
}
.pill.g1{color:#ffd76e;border-color:#7a5f16;background:#2a2208}
.pill.sg{
  color:#1d1403;border-color:#ffe9a8;
  background:linear-gradient(#ffe08a,#e0a52c);font-weight:700;
  box-shadow:0 0 10px rgba(244,196,74,.45);
}
.pill.g2{color:#d6e2ff;border-color:#46578a;background:#1a2340}
.pill.g3{color:#cdf3dc;border-color:#3a7a58;background:#123526}
.pill.op{color:#ead9ff;border-color:#5b4c82;background:#221a3a}
.pill.jo{color:var(--ink-2);border-color:var(--line);background:#123322}
.pill.dirt{color:#f0cfa6;border-color:#6d532f;background:#2a1e12}
.pill.turf{color:#b6efc8;border-color:#357049;background:#12331f}

/* 馬番の枠色 */
.uma{
  width:22px;height:22px;border-radius:4px;display:grid;place-items:center;
  font-family:"DotGothic16",monospace;font-size:12px;font-weight:400;flex:0 0 auto;
  border:1px solid rgba(0,0,0,.55);
}
.uma.c1{background:var(--w1);color:#111}
.uma.c2{background:var(--w2);color:#fff;border-color:#555}
.uma.c3{background:var(--w3);color:#fff}
.uma.c4{background:var(--w4);color:#fff}
.uma.c5{background:var(--w5);color:#1a1a1a}
.uma.c6{background:var(--w6);color:#fff}
.uma.c7{background:var(--w7);color:#1a1a1a}
.uma.c8{background:var(--w8);color:#3a1220}

/* 一覧行 */
.list{display:flex;flex-direction:column;gap:6px}
.entry{
  display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;
  background:var(--panel-2);border:1px solid var(--line);width:100%;text-align:left;
}
.entry .nm{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .od{font-family:"DotGothic16",monospace;font-size:12px;color:var(--cyan);font-variant-numeric:tabular-nums}
.entry[aria-pressed="true"]{border-color:var(--gold);background:#231d0d}
.entry.me .nm{color:var(--gold);font-weight:700}

table.res{width:100%;border-collapse:collapse;font-size:11.5px}
table.res th{
  font-family:"DotGothic16",monospace;font-weight:400;font-size:10px;color:var(--ink-3);
  text-align:left;padding:3px 4px;border-bottom:1px solid var(--line);letter-spacing:.08em;
}
table.res td{padding:5px 4px;border-bottom:1px solid #17402a;font-variant-numeric:tabular-nums}
table.res tr.me td{background:#20190a;color:var(--gold)}
table.res td.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px}

/* レース操作卓 */
.deck{display:flex;flex-direction:column;gap:8px;height:100%}
.spur{
  flex:0 0 auto; height:clamp(84px,15dvh,124px); border-radius:12px;
  background:linear-gradient(#f6cf5f,#cf9a1e);
  color:#2a1e02; font-family:"Dela Gothic One",sans-serif; font-size:20px;
  display:grid;place-items:center;gap:2px; border:2px solid #ffe6a6;
  box-shadow:0 4px 0 #8c6712, 0 8px 18px rgba(244,196,74,.18);
}
.spur:active{transform:translateY(3px);box-shadow:0 1px 0 #8c6712}
.spur.on{background:linear-gradient(#ff8a63,#e04a22);border-color:#ffbca4;color:#2a0d04;box-shadow:0 4px 0 #8a2c14}
.spur small{display:block;font-family:inherit;font-size:10px;letter-spacing:.1em;opacity:.75}
.whip{
  flex:0 0 auto;min-height:52px;border-radius:10px;background:#1b4a2e;border:1px solid var(--line);
  display:grid;place-items:center;font-size:14px;font-weight:700;
}
.whip:active{filter:brightness(1.3)}
.whip .pips{font-family:"DotGothic16",monospace;color:var(--gold);font-size:12px}

.log{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--ink-2);line-height:1.5}
.log .ln{padding-left:10px;border-left:2px solid var(--line)}
.log .ln.hot{border-left-color:var(--gold);color:var(--ink)}

input[type=text]{
  width:100%;padding:9px 10px;border-radius:8px;background:#07190f;
  border:1px solid var(--line);color:var(--ink);font-size:15px;font-family:inherit;
}
/* 馬券のマークシート。式別→馬番→金額の順に「塗って」買う */
.sheet{background:#0a2317}
.sheetrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sheetlab{
  flex:0 0 30px;font-family:"DotGothic16",monospace;font-size:10px;
  color:var(--ink-3);letter-spacing:.08em;
}
.marks{display:flex;gap:6px;flex:1}
.marks .mark{
  flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
  min-height:38px;border-radius:6px;border:1px solid var(--line);
  background:#07190f;color:var(--ink-2);font-size:11.5px;
  font-family:"DotGothic16",monospace;
}
.marks .mark i{
  width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink-3);
  display:block;flex:0 0 auto;
}
.marks .mark.on{border-color:var(--gold);color:var(--gold);background:#241d0b}
.marks .mark.on i{background:var(--gold);border-color:var(--gold)}
.marks .mark:active{filter:brightness(1.3)}
.marks .mark[disabled]{opacity:.3}
.waku{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;flex:1}
.wcell{
  min-height:42px;border-radius:6px;border:2px solid rgba(0,0,0,.45);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.wcell b{font-family:"DotGothic16",monospace;font-size:15px;font-weight:400;line-height:1}
.wcell small{font-family:"DotGothic16",monospace;font-size:9.5px;opacity:.85;line-height:1.4}
.wcell.on{box-shadow:0 0 0 3px var(--gold);border-color:#fff}
.wcell.c1{background:var(--w1);color:#141414}
.wcell.c2{background:var(--w2);color:#fff}
.wcell.c3{background:var(--w3);color:#fff}
.wcell.c4{background:var(--w4);color:#fff}
.wcell.c5{background:var(--w5);color:#141414}
.wcell.c6{background:var(--w6);color:#fff}
.wcell.c7{background:var(--w7);color:#141414}
.wcell.c8{background:var(--w8);color:#3a1220}
.readout{
  display:flex;align-items:center;gap:8px;margin-bottom:8px;min-height:44px;
  padding:7px 8px;border-radius:6px;background:#07190f;border:1px solid var(--line);
}
.readout.empty{justify-content:center}
.ro-name{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.ro-name b{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ro-name small{font-size:9.5px;color:var(--ink-3)}
.ro-odds{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.ro-odds b{font-family:"DotGothic16",monospace;font-size:16px;color:var(--cyan)}
.ro-odds small{font-size:9px;color:var(--ink-3)}

/* 合言葉の入力（4文字×3）と表示 */
.pwrow{display:flex;align-items:center;gap:5px}
.pw{
  flex:1;min-width:0;width:auto;text-align:center;letter-spacing:.10em;
  padding:10px 4px;border-radius:8px;background:#07190f;
  border:1px solid var(--line);color:var(--ink);
  font-family:"DotGothic16",monospace;font-size:17px;
}
.pw:focus{border-color:var(--gold);outline:none}
.pwsep{color:var(--ink-3);font-family:"DotGothic16",monospace}
.passbox{
  display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;
  font-family:"DotGothic16",monospace;
}
.passbox b{
  font-weight:400;font-size:17px;letter-spacing:.06em;color:var(--gold);
  background:#07190f;border:1px solid var(--gold-2);border-radius:6px;padding:7px 6px;
}
.passbox i{color:var(--ink-3);font-style:normal}

/* 条件戦は毎月生成（クラスに応じて距離・馬場をローテーション） */
function condRaces(g){
  const h=g.horse, out=[];
  const dists = [1200,1400,1600,1800,2000,2200,2400];
  const seed = (g.year*13+g.week*7);
  const d1 = dists[(seed)%dists.length], d2 = dists[(seed+3)%dists.length];
  const surf = ((seed>>1)%3===0)?'ダート':'芝';
  // 開催場も月ごとに替える（同じ条件戦でもコース適性で結果が変わる）
  const c1 = COURSE_LIST[seed%COURSE_LIST.length];
  const c2 = COURSE_LIST[(seed+4)%COURSE_LIST.length];
  if(h.cls===0){
    if(h.races===0 && g.year===3 && g.week<=26)
      out.push({n:'新馬戦', w:g.week, d:d1, s:surf, g:'jo', cls:0, lv:0, c:c1});
    out.push({n:'未勝利戦', w:g.week, d:d2, s:'芝', g:'jo', cls:0, lv:0, c:c2});
    if(g.year>3){ out.length=0; out.push({n:'1勝クラス', w:g.week, d:d2, s:'芝', g:'jo', cls:0, lv:1, c:c2}); }
  }else if(h.cls<4){
    out.push({n:h.cls+'勝クラス', w:g.week, d:d1, s:'芝', g:'jo', cls:h.cls, lv:h.cls, c:c1});
    out.push({n:h.cls+'勝クラス', w:g.week, d:d2, s:surf, g:'jo', cls:h.cls, lv:h.cls, c:c2});
  }else{
    out.push({n:'オープン特別', w:g.week, d:d1, s:'芝', g:'op', cls:4, lv:4, c:c1});
  }
  return out;
}
function racesFor(g){
  const h=g.horse;
  const list = RACES.filter(r=> r.w===g.week && r.age.includes(g.year) && h.cls>=r.cls);
  // 隠しレースは条件を満たした馬にだけ見える
  const sg = SG_RACES.filter(r=> r.w===g.week && r.age.includes(g.year) && r.test(h));
  // 条件戦は隔週開催。毎週使えると連闘し放題になり、調教する週がなくなる
  const cond = (g.week%2===1) ? condRaces(g) : [];
  return sg.concat(cond, list);
}
const prizeOf = r => r.prize!=null ? r.prize
  : (r.g==='jo' ? COND_PRIZE[clamp(r.lv||0,0,3)] : GRADE_PRIZE[r.g]);
/* 次に出走できる週を先読みする（50週あるので目安がないと待ち方が分からない） */
function nextRaceInfo(){
  for(let k=1;k<=WEEKS_PER_YEAR*3;k++){
    const t=G.week+k-1;
    const week=t%WEEKS_PER_YEAR+1, year=G.year+Math.floor(t/WEEKS_PER_YEAR);
    if(year>5) return null;
    const rs=racesFor({horse:G.horse, year, week});
    if(rs.length){
      const top=rs.slice().sort((a,b)=>prizeOf(b)-prizeOf(a))[0];
      return {in:k, week, year, top};
    }
  }
  return null;
}

/* =======================================================================
   2. 馬の生成
   ======================================================================= */
function newHorse(opt={}){
  const base = opt.base||36;
  const aptD = {};
  const cats=['短距離','マイル','中距離','長距離'];
  const core = rint(1,2); // 得意ゾーンの中心
  cats.forEach((c,i)=>{
    const dist=Math.abs(i-core);
    aptD[c] = APT_LET[clamp(dist + (Math.random()<.35?1:0) + (Math.random()<.15?-1:0),0,4)];
  });
  const turfFirst = Math.random()<.72;
  return {
    name: opt.name||horseName(),
    sex: pick(['牡','牡','牝']),
    coat: rint(0,COATS.length-1),
    style: pick(STYLES),
    growth: pick(GROWTH),
    jockey: pick(JOCKEY),
    sp: base+rint(-6,8), st: base+rint(-6,8), pw: base+rint(-6,8),
    gt: base+rint(-6,8), wt: base+rint(-6,8),
    aptTurf: turfFirst?pick(['S','A','A','B']):pick(['B','C','C','D']),
    aptDirt: turfFirst?pick(['B','C','C','D']):pick(['S','A','A','B']),
    aptD,
    fatigue:0, cond:70,
    cls:0, wins:0, races:0, g1:0, earned:0, fans:0, rest:0
  };
}
/* 成長型による年齢別キャップ */
function capOf(h, year){
  const t = h.growth==='早熟' ? [88,96,92] : h.growth==='晩成' ? [70,90,105] : [78,95,100];
  return t[clamp(year-3,0,2)] + (h.legacy||0);
}
function ratingOf(h, race){
  const c = COND_NAME[condIdx(h)].m;
  const apt = APT_MULT[race.s==='芝'?h.aptTurf:h.aptDirt] * APT_MULT[h.aptD[distCat(race.d)]];
  const long = race.d>=2200 ? 1 : race.d<=1400 ? 0 : .5;   // 距離が長いほどスタミナ比重
  const core = h.sp*(1-long*.28) + h.st*(.18+long*.30) + h.pw*.16 + h.gt*.16 + h.wt*.10;
  // コース特性：小回りは賢さ、急坂はパワーと根性が効く
  const cs = courseOf(race);
  const cAdj = 1 + (h.wt-50)/900*cs.curve + ((h.pw-50)/900 + (h.gt-50)/1500)*cs.slope;
  return core * apt * c * cAdj;
}

/* ライバル生成：クラスに応じた地力 */
/* 相手のレベル。race.lvl があればそれを使う（レジェンドカップだけが上限を使う） */
const fieldLevel = race => race.lvl!=null ? race.lvl
  : (race.g==='jo' ? 34+(race.lv||0)*9 : ({op:70,G3:76,G2:82,G1:89,SG:97})[race.g]);
function makeField(g, race){
  const lvl = fieldLevel(race);
  const field=[], used=new Set([g.horse&&g.horse.name]);
  for(let i=0;i<7;i++){
    const b = clamp(lvl + rint(-9,9), 22, 108);
    const r = newHorse({base:b});
    r.cond = rint(45,92);
    r.fatigue = rint(0,25);
    r.npc = true;
    if(INTL_COURSES.has(race.c)) r.jockey = pick(JOCKEY_INT);   // 海外カップは欧米人騎手に差し替え
    if(Math.random()<0.45) r.name = pick(MOB_NAMES);
    // 同じ名前が2頭並ぶと着順表が読めなくなる
    for(let t=0; t<12 && used.has(r.name); t++) r.name = pick(MOB_NAMES);
    used.add(r.name);
    field.push(r);
  }
  field.push(g.horse);
  // シャッフルして馬番を割り当て
  for(let i=field.length-1;i>0;i--){const j=rint(0,i); [field[i],field[j]]=[field[j],field[i]];}
  field.forEach((h,i)=>{h.num=i+1;});
  return field;
}
/* 観戦専用：愛馬を含まない8頭立てを作る */
function makeWatchField(race){
  const lvl = fieldLevel(race);
  const field=[], used=new Set();
  for(let i=0;i<8;i++){
    const r=newHorse({base:clamp(lvl+rint(-9,9),22,108)});
    r.cond=rint(45,92); r.fatigue=rint(0,25); r.npc=true;
    if(INTL_COURSES.has(race.c)) r.jockey = pick(JOCKEY_INT);
    if(Math.random()<0.45) r.name = pick(MOB_NAMES);
    for(let t=0; t<12 && used.has(r.name); t++) r.name = pick(MOB_NAMES);
    used.add(r.name);
    field.push(r);
  }
  field.forEach((h,i)=>{ h.num=i+1; });
  return field;
}
/* その週に実際に組まれているレース。なければオープン特別を仕立てる。 */
function pickWatchRace(){
  const today=RACES.filter(r=>r.w===G.week);
  if(today.length) return pick(today);
  const dists=[1200,1400,1600,1800,2000,2200,2400];
  return {n:'オープン特別', w:G.week, d:pick(dists), s:Math.random()<.3?'ダート':'芝',
          g:'op', cls:4, lv:4, c:pick(COURSE_LIST)};
}
/* オッズ算定 */
/* --- 連闘（間隔を詰めた出走） ---
   前走から何週空いたかで決まる。詰めるほど疲労が乗り、主催者の扱いも渋くなって
   愛馬に付くオッズ（＝払戻）が削られる。休ませて出すことに意味を持たせるための仕組み。 */
const absWeek = () => (G.year-3)*WEEKS_PER_YEAR + G.week;
const raceGap = h => (h && h.lastRace!=null) ? absWeek()-h.lastRace : 99;
const packOf  = h => { const g=raceGap(h); return g>=6 ? 0 : clamp((6-g)/5,0,1); };
const packLabel = h => { const g=raceGap(h);
  return g>=6?'':(g<=1?'連闘':`中${Math.max(0,g-1)}週`); };
/* 格が上がるほど1戦の消耗が大きい */
const GRADE_FAT = {jo:1.00, op:1.08, G3:1.18, G2:1.28, G1:1.45, SG:1.60};

function makeOdds(field, race, oddsMul){
  const rs = field.map(h=>Math.pow(Math.max(6,ratingOf(h,race)),4.2));
  const sum = rs.reduce((a,b)=>a+b,0);
  return field.map((h,i)=>{
    const p = clamp(rs[i]/sum, .012, .82);
    let win = Math.max(1.1, Math.round(78/(p*100)*10)/10);
    const p3  = clamp(p*2.45, .03, .93);
    let plc = Math.max(1.0, Math.round(80/(p3*100)*10)/10);
    if(!h.npc && oddsMul && oddsMul<1){          // 連闘の愛馬は配当が下がる
      win = Math.max(1.0, Math.round(win*oddsMul*10)/10);
      plc = Math.max(1.0, Math.round(plc*oddsMul*10)/10);
    }
    return {win, plc, p};
  });
}

/* =======================================================================
   3. レースシミュレーション
   ======================================================================= */
const BASE_V = 16.0;
/* 距離が延びるほど平均速度は落ちる。実際の持久曲線（Riegel則 v∝d^-k）に合わせる。 */
const distFactor = d => 1.035*Math.pow(d/1200,-0.095);
class RaceSim{
  constructor(race, field, meIdx){
    this.race=race; this.D=race.d; this.t=0; this.done=false; this.events=[];
    this.meIdx=meIdx; this.fired={};
    const nige = field.filter(h=>h.style==='逃げ').length + field.filter(h=>h.style==='先行').length*.5;
    this.pace = nige>=3.5 ? 'ハイ' : nige<=1.5 ? 'スロー' : 'ミドル';
    const paceAdj = {'ハイ':1.03,'ミドル':1.0,'スロー':.975}[this.pace];
    const distF = this.distF = distFactor(race.d);
    /* コース特性をレース構造に落とし込む。
       直線が短いコースほど「追い比べの区間」が短く、後方からでは届かない。 */
    this.course   = courseOf(race);
    this.straight = Math.min(this.course.straight, race.d*0.5);
    this.sStart   = 1 - this.straight/race.d;              // 直線入口
    // 勝負所。長い距離ほど早く動き出す（直線だけでは差が詰まらないため）
    const goEarly = race.d>=2400 ? 0.30 : race.d>=2000 ? 0.25 : 0.20;
    this.cStart   = Math.max(0.28, this.sStart-goEarly);
    this.run = field.map((h,i)=>{
      const c = COND_NAME[condIdx(h)].m;
      const apt = APT_MULT[race.s==='芝'?h.aptTurf:h.aptDirt]*APT_MULT[h.aptD[distCat(race.d)]];
      /* 適性・調子は「最高速」にはわずかしか効かせない。効かせすぎると
         着差が十数秒になり競馬の時計にならないため、主に消耗（下の stFac）で効かせる。 */
      const aptV  = 1+(apt-1)*0.45;
      const condV = 1+(c-1)*0.55;
      /* オープン特別は勝つたびに斤量を課される。勝ち続けるほど勝ちにくくなり、
         いつかは重賞へ出ていくしかなくなる。 */
      const hcpV = (race.g==='op' && !h.npc) ? 1-Math.min(0.10,(h.hcp||0)*0.015) : 1;
      return {
        h, i, x:0, v:0, stam:1, fin:0, rank:0, spurt:false, whip:0, whipT:0,
        trouble:0, phase:Math.random(),
        cap: BASE_V*(0.930+h.sp/900)*aptV*condV*distF*hcpV*rnd(1.012,.988),
        accel: 0.9+h.pw/170,
        stFac: (0.52+h.st/115)*apt,   // 適性外の条件では脚が上がる
        guts: h.gt,
        style: h.style,
        // AIの仕掛けどころ（賢さで前後）
        goAt: clamp(({'逃げ':.62,'先行':.66,'差し':.71,'追込':.76}[h.style]) - h.wt/2200 + rnd(.03,-.03), .55, .84),
        paceAdj
      };
    });
    this.me = this.run[meIdx];
    this.last600 = new Map();
  }
  targetMul(r, prog){
    const s = r.style;
    /* 実際のレースは隊列が固まって進むので、序盤の差は小さく、
       決着は終い（フェーズ2〜3）でつける。ここを開きすぎると逃げ切りばかりになる。 */
    const tbl = {
      '逃げ':[1.045,.992,1.000,1.005],
      '先行':[1.025,.988,1.010,1.030],
      '差し':[0.980,.982,1.030,1.075],
      '追込':[0.955,.978,1.040,1.100]
    }[s];
    const idx = prog<.2?0 : prog<this.cStart?1 : prog<this.sStart?2 : 3;
    let m = tbl[idx];
    // ペース補正：ハイなら前が消耗、スローなら後方不利
    if(prog<this.cStart){
      if(this.pace==='ハイ' && (s==='逃げ'||s==='先行')) m*=1.022;
      if(this.pace==='スロー'&& (s==='差し'||s==='追込')) m*=0.985;
    }
    return m;
  }
  step(dt){
    if(this.done) return;
    this.t+=dt;
    const D=this.D;
    for(const r of this.run){
      if(r.fin) continue;
      const prog = r.x/D;
      let mul = this.targetMul(r, prog);
      // 仕掛け
      if(r===this.me){ if(r.spurt) mul*=1.075; }
      else if(prog>=r.goAt) mul*=1.06;
      if(r.whipT>0){ mul*=1.045; r.whipT-=dt; }
      if(r.trouble>0){ mul*=0.90; r.trouble-=dt; }
      // コーナー：小回りほど振られて減速し、賢さで軽減される
      if(prog>0.12 && prog<this.sStart){
        mul *= 1 - this.course.curve*0.030*(1 - r.h.wt/280);
        // 4コーナーで後方の馬は外を回らされる
        if(prog>this.cStart && (r.style==='追込'||r.style==='差し'))
          mul *= 1 - this.course.curve*0.028;
      }
      // ゴール前の坂：パワーと根性で駆け上がる
      if(D-r.x < 220)
        mul *= 1 - this.course.slope*0.060*(1 - r.h.pw/300 - r.h.gt/500);
      // 脚色：残りスタミナが細るほど連続的に失速する（根性で粘る）
      if(r.stam<0.30){
        const lack=clamp((0.30-r.stam)/0.30,0,1.2);
        mul *= 1 - lack*(0.140 - r.guts/1700);
      }
      let target = r.cap*mul;
      // ラスト100mは根性で粘る
      if(prog>.94) target *= 1 + r.guts/2400;
      r.v += clamp(target-r.v, -8*dt*4, r.accel*dt*4);
      r.x += r.v*dt;
      // 消耗（基準速度は距離補正込み）
      const ratio = r.v/(BASE_V*0.985*r.paceAdj*this.distF);
      let drain = dt*0.0069*Math.pow(Math.max(.55,ratio),5)/r.stFac;
      if(r===this.me && r.spurt) drain*=1.55;
      if(r.whipT>0) drain*=1.25;
      r.stam -= drain;
      // 上がり3F計測
      if(!this.last600.has(r.i) && r.x>=D-600) this.last600.set(r.i,this.t);
      // 不利（差し・追込にまれに発生）
      if(!r.troubleDone && prog>.45 && prog<.72 && (r.style==='差し'||r.style==='追込') && Math.random()<dt*0.045){
        r.troubleDone=true; r.trouble=1.4;
        this.events.push({t:this.t, txt:`${r.h.num}番 ${r.h.name} 前が壁だ！`, hot:r===this.me});
      }
      if(r.x>=D){
        r.fin = this.t - (r.x-D)/Math.max(1,r.v);
        r.last3 = this.last600.has(r.i) ? (r.fin - this.last600.get(r.i)) : null;
      }
      r.phase += r.v*dt*0.42;
    }
    // 順位
    const order=[...this.run].sort((a,b)=> (b.fin&&a.fin)? a.fin-b.fin : b.x-a.x);
    order.forEach((r,i)=>r.rank=i+1);
    this.order=order;
    this.leader=order[0];
    if(this.run.every(r=>r.fin)){ this.done=true; this.finish(); }
    this.emit();
  }
  emit(){
    const p = this.leader.x/this.D;
    const say=(k,txt,hot)=>{ if(!this.fired[k]){ this.fired[k]=1; this.events.push({t:this.t,txt,hot}); } };
    if(p>.02) say('s',`スタート！ ${this.pace}ペースの入り。`);
    if(p>.22) say('a',`先頭は${this.leader.h.num}番 ${this.leader.h.name}。`);
    if(p>.42 && p<this.cStart) say('b',`向正面、${this.me.rank}番手に${this.me.h.name}。`, true);
    if(p>this.cStart) say('c', this.course.curve>=0.8
      ? `3コーナー、小回りで隊列が一気に凝縮する！`
      : `3コーナーから隊列が動き出す！`);
    if(p>this.sStart) say('d',`4コーナーを回って直線へ！残り${Math.round(this.straight)}m！`);
    if(p>1-190/this.D && this.course.slope>=0.7) say('h',`最後の急坂だ！ここで脚が上がる！`, true);
    if(p>.90) say('e',`${this.order[0].h.name}先頭、${this.order[1].h.name}が並びかける！`);
    if(p>.97) say('f',`ゴール前、大接戦だ！`, true);
  }
  /* 現在地の区間名とコーナーの曲がり具合（描画とHUD用） */
  sectionOf(x){
    const p=x/this.D;
    if(p>=this.sStart) return '直線';
    if(p>=this.cStart) return '4角';
    if(p>=0.42) return '3角';
    if(p>=0.2)  return '向正面';
    return 'スタート';
  }
  bendAt(x){
    const p=x/this.D;
    if(p>=this.sStart || p<0.12) return 0;
    return this.course.curve*(p>=this.cStart?1:0.55);
  }
  finish(){
    const res=[...this.run].sort((a,b)=>a.fin-b.fin);
    res.forEach((r,i)=>{ r.pos=i+1; });
    for(let i=1;i<res.length;i++){
      const gap=(res[i].fin-res[i-1].fin)*res[i].v/2.4;
      res[i].margin = gap<0.05?'ハナ' : gap<0.2?'アタマ' : gap<0.45?'クビ' : gap<8? (Math.round(gap*4)/4)+'馬身' : '大差';
    }
    if(res[0]) res[0].margin='';
    this.result=res;
  }
  skipToEnd(){ let guard=0; while(!this.done && guard++<40000) this.step(1/30); }
  /* 先頭がその進捗に達するまで一気に進める（スキップ＝直線まで飛ばす用） */
  skipTo(frac){
    const target=this.D*frac; let guard=0;
    while(!this.done && guard++<40000){
      this.step(1/30);
      if(this.leader && this.leader.x>=target) break;
    }
  }
}

/* =======================================================================
   4. 描画（上画面）
   ======================================================================= */
const cv=$('#cv'), g=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  const r=cv.getBoundingClientRect();
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.max(1,Math.round(r.width)); H=Math.max(1,Math.round(r.height));
  cv.width=W*DPR; cv.height=H*DPR;
  g.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);

function roundRect(x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
/* 背景：スタンド・照明・空 */
/* --- 隠しレースの舞台 ---
   sg があるときは通常のスタンドではなく、その国の景色を描く。
   omen（吉兆）はごく稀にしか出ない代わりに、出た日は本当に勝ちやすい。 */
function drawTheme(sg, camX, omen){
  const t=performance.now();
  const HZ=H*.56;                                   // 地平線
  const par=f=>-((camX*f)%(W*1.5));
  const sky=g.createLinearGradient(0,0,0,HZ);

  if(sg.theme==='legend'){
    // 星空と、地平線に立つ巨大な金の優勝杯。吉兆は流れ星。
    sky.addColorStop(0,'#090b2a'); sky.addColorStop(.6,'#241a4d'); sky.addColorStop(1,'#5b3a6b');
    g.fillStyle=sky; g.fillRect(0,0,W,HZ);
    for(let i=0;i<70;i++){                           // 星（席と同じく位置で決める。乱数だと瞬きが暴れる）
      const sx=hash1(i*3+1)*W, sy=hash1(i*3+2)*HZ*.85, tw=0.45+0.55*Math.sin(t/700+i);
      g.globalAlpha=0.25+hash1(i*3+3)*0.6*tw;
      g.fillStyle='#fff6d0'; g.fillRect(sx,sy,1.6,1.6);
    }
    g.globalAlpha=1;
    const ox=par(0.08);
    for(let k=-1;k<2;k++){
      const bx=ox+k*W*1.5, cx=bx+W*.42, base=HZ, hh=H*.30;
      const cup=g.createLinearGradient(cx-W*.12,base-hh,cx+W*.12,base);
      cup.addColorStop(0,'#f7e08a'); cup.addColorStop(.5,'#d0a02c'); cup.addColorStop(1,'#7a5a12');
      g.fillStyle=cup;
      g.beginPath();                                 // 杯
      g.moveTo(cx-W*.11,base-hh);
      g.bezierCurveTo(cx-W*.10,base-hh*.45, cx-W*.05,base-hh*.34, cx,base-hh*.34);
      g.bezierCurveTo(cx+W*.05,base-hh*.34, cx+W*.10,base-hh*.45, cx+W*.11,base-hh);
      g.closePath(); g.fill();
      g.fillRect(cx-W*.012,base-hh*.34,W*.024,hh*.20);   // 脚
      g.fillRect(cx-W*.055,base-hh*.14,W*.11,hh*.06);    // 台座
      g.fillRect(cx-W*.075,base-hh*.08,W*.15,hh*.08);
      g.strokeStyle='#e6ca3a'; g.lineWidth=Math.max(2,W*.008);
      [-1,1].forEach(sgn=>{                          // 取っ手
        g.beginPath();
        g.arc(cx+sgn*W*.115, base-hh*.78, H*.045, -Math.PI/2, Math.PI/2, sgn<0);
        g.stroke();
      });
      [-1,1].forEach(sgn=>{                          // 篝火
        const fx=cx+sgn*W*.26, fy=base-H*.02, fl=H*.045*(0.85+0.15*Math.sin(t/120+sgn));
        g.fillStyle='#3a2a12'; g.fillRect(fx-W*.012,fy-H*.05,W*.024,H*.05);
        const fg=g.createLinearGradient(fx,fy-H*.05-fl,fx,fy-H*.05);
        fg.addColorStop(0,'rgba(255,240,160,.15)'); fg.addColorStop(.5,'#ffb03a'); fg.addColorStop(1,'#ff6a2a');
        g.fillStyle=fg;
        g.beginPath(); g.moveTo(fx,fy-H*.05-fl);
        g.quadraticCurveTo(fx+W*.020,fy-H*.05-fl*.35, fx,fy-H*.05);
        g.quadraticCurveTo(fx-W*.020,fy-H*.05-fl*.35, fx,fy-H*.05-fl);
        g.fill();
      });
    }
    if(omen){                                        // 流れ星
      const ph=((t/2600)%1), sx=W*(1.05-ph*1.25), sy=HZ*(0.12+ph*0.35);
      const tail=g.createLinearGradient(sx,sy,sx+W*.16,sy-H*.05);
      tail.addColorStop(0,'rgba(255,255,255,.95)'); tail.addColorStop(1,'rgba(255,255,255,0)');
      g.strokeStyle=tail; g.lineWidth=2.4;
      g.beginPath(); g.moveTo(sx,sy); g.lineTo(sx+W*.16,sy-H*.05); g.stroke();
      g.fillStyle='#fffbe8';
      g.beginPath(); g.arc(sx,sy,2.6,0,7); g.fill();
    }
    g.fillStyle='#241a33';                           // 黒い岩肌の地面
    g.fillRect(0,HZ-H*.008,W,H*.06);
    g.fillStyle='rgba(212,168,58,.35)';              // 金の鉱脈
    for(let x=0;x<W;x+=W/10) g.fillRect(x+((camX*0.3)%(W/10)),HZ+H*.004,W/26,1.5);
  }

  else if(sg.theme==='china'){
    sky.addColorStop(0,'#20081c'); sky.addColorStop(1,'#5b1030');
    g.fillStyle=sky; g.fillRect(0,0,W,HZ);
    for(let i=0;i<4;i++){                            // 赤い花火
      const ph=((t/1400)+i*0.37)%1;
      const fx=W*(0.13+0.25*i), fy=H*(0.10+0.07*(i%2));
      g.globalAlpha=Math.max(0,1-ph)*0.95;
      g.strokeStyle=i%2?'#ff4d6d':'#ffb03a'; g.lineWidth=2;
      for(let a=0;a<12;a++){
        const r0=H*.02+ph*H*.10, ang=a/12*Math.PI*2;
        g.beginPath();
        g.moveTo(fx+Math.cos(ang)*r0*0.55, fy+Math.sin(ang)*r0*0.55);
        g.lineTo(fx+Math.cos(ang)*r0, fy+Math.sin(ang)*r0); g.stroke();
      }
      g.globalAlpha=1;
    }
    const ox=par(0.30);
    for(let k=-1;k<2;k++){                           // ピンクのネオン街
      const bx=ox+k*W*1.5;
      for(let i=0;i<5;i++){
        const x=bx+i*W*.31, hh=H*(0.13+0.05*((i*7)%3));
        g.fillStyle='#2a0a20'; g.fillRect(x,HZ-hh,W*.22,hh);
        g.strokeStyle='#ff5fae'; g.lineWidth=2;
        g.strokeRect(x+3,HZ-hh+4,W*.22-6,hh-8);
        g.fillStyle='rgba(255,95,174,.55)';
        for(let r=0;r<3;r++) g.fillRect(x+8,HZ-hh+12+r*10,W*.22-16,3);
      }
    }
    if(omen){                                        // パンダ
      const px=W*.16+Math.sin(t/2200)*W*.02, py=HZ-H*.10;
      g.fillStyle='#f4f4f0';
      g.beginPath(); g.ellipse(px,py,H*.048,H*.044,0,0,7); g.fill();
      g.fillStyle='#141414';
      g.beginPath(); g.arc(px-H*.036,py-H*.034,H*.017,0,7); g.fill();
      g.beginPath(); g.arc(px+H*.036,py-H*.034,H*.017,0,7); g.fill();
      g.beginPath(); g.ellipse(px-H*.017,py-H*.004,H*.011,H*.014,.3,0,7); g.fill();
      g.beginPath(); g.ellipse(px+H*.017,py-H*.004,H*.011,H*.014,-.3,0,7); g.fill();
      g.beginPath(); g.ellipse(px,py+H*.016,H*.008,H*.006,0,0,7); g.fill();
    }
    g.fillStyle='#1a0512'; g.fillRect(0,HZ-2,W,H*.05);
  }

  else if(sg.theme==='paris'){
    sky.addColorStop(0,'#4aa8e0'); sky.addColorStop(1,'#bfe3f5');
    g.fillStyle=sky; g.fillRect(0,0,W,HZ);
    g.fillStyle='rgba(255,255,255,.75)';
    for(let i=0;i<3;i++){
      const cx=(i*W*.42+par(0.05)+W)%(W*1.4), cy=H*(.10+.05*i);
      g.beginPath(); g.ellipse(cx,cy,W*.09,H*.028,0,0,7); g.fill();
      g.beginPath(); g.ellipse(cx+W*.05,cy+H*.008,W*.06,H*.022,0,0,7); g.fill();
    }
    const ox=par(0.30);
    for(let k=-1;k<2;k++){                           // 石畳沿いのカフェ
      const bx=ox+k*W*1.5;
      for(let i=0;i<5;i++){
        const x=bx+i*W*.31, hh=H*(0.17+0.03*((i*5)%3));
        g.fillStyle='#e9dcc6'; g.fillRect(x,HZ-hh,W*.24,hh);
        g.fillStyle='#8fa8b8';
        for(let r=0;r<2;r++) for(let c=0;c<2;c++)
          g.fillRect(x+W*.04+c*W*.09, HZ-hh+H*.02+r*H*.05, W*.05, H*.035);
        for(let s=0;s<5;s++){                        // 赤白の日よけ
          g.fillStyle=s%2?'#e04a4a':'#f6f0e6';
          g.fillRect(x+s*W*.048, HZ-H*.055, W*.048, H*.022);
        }
        g.fillStyle='#3a2a1e'; g.fillRect(x+W*.09,HZ-H*.033,W*.06,H*.033);
      }
    }
    g.fillStyle='#9a9088'; g.fillRect(0,HZ-H*.012,W,H*.05);   // 石畳
    g.fillStyle='rgba(0,0,0,.18)';
    for(let x=(camX*3)%18-18;x<W;x+=18) g.fillRect(x,HZ-H*.012,2,H*.05);
    if(omen){                                        // オレンジの飛行機
      const fx=((t/26)%(W+220))-110, fy=H*.13+Math.sin(t/900)*H*.012;
      g.fillStyle='#ff8a2b';
      g.beginPath(); g.ellipse(fx,fy,H*.038,H*.011,0,0,7); g.fill();
      g.beginPath(); g.moveTo(fx-H*.006,fy); g.lineTo(fx-H*.030,fy-H*.026);
      g.lineTo(fx+H*.008,fy-H*.004); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(fx-H*.030,fy); g.lineTo(fx-H*.042,fy-H*.018);
      g.lineTo(fx-H*.022,fy-H*.002); g.closePath(); g.fill();
      g.strokeStyle='rgba(255,255,255,.5)'; g.lineWidth=2;
      g.beginPath(); g.moveTo(fx-H*.045,fy+H*.004); g.lineTo(fx-H*.16,fy+H*.010); g.stroke();
    }
  }

  else if(sg.theme==='ny'){
    sky.addColorStop(0,'#090a20'); sky.addColorStop(1,'#2b1150');
    g.fillStyle=sky; g.fillRect(0,0,W,HZ);
    const ox=par(0.22);
    for(let k=-1;k<2;k++){                           // ラスベガスの夜
      const bx=ox+k*W*1.5;
      for(let i=0;i<6;i++){
        const x=bx+i*W*.26, hh=H*(0.14+0.09*((i*3)%4)/3);
        g.fillStyle='#10112a'; g.fillRect(x,HZ-hh,W*.20,hh);
        for(let r=0;r<Math.floor(hh/12);r++) for(let c=0;c<3;c++){
          if(((i*7+r*3+c)%4)===0) continue;
          g.fillStyle=(r+c)%3===0?'rgba(255,210,120,.85)':'rgba(150,220,255,.7)';
          g.fillRect(x+W*.03+c*W*.055, HZ-hh+8+r*12, W*.035, 6);
        }
        g.fillStyle=i%2?'#ff3fa0':'#3fd8ff';
        g.fillRect(x+W*.02,HZ-hh-4,W*.16,3);
      }
    }
    g.fillStyle='rgba(255,80,170,.14)'; g.fillRect(0,HZ-H*.10,W,H*.10);
    g.fillStyle='#0a0b18'; g.fillRect(0,HZ-2,W,H*.05);
    if(omen){                                        // 黄色いタクシー
      const tx=((t/9)%(W+200))-100, ty=HZ-H*.028;
      g.fillStyle='#ffd21e';
      roundRect(tx,ty-H*.026,H*.115,H*.026,3); g.fill();
      roundRect(tx+H*.022,ty-H*.046,H*.058,H*.024,3); g.fill();
      g.fillStyle='#1b1b1b';
      g.beginPath(); g.arc(tx+H*.024,ty,H*.011,0,7); g.fill();
      g.beginPath(); g.arc(tx+H*.090,ty,H*.011,0,7); g.fill();
      g.fillStyle='#fff8c8'; g.fillRect(tx+H*.108,ty-H*.020,H*.010,H*.008);
    }
  }

  else if(sg.theme==='britain'){
    sky.addColorStop(0,'#2d3c52'); sky.addColorStop(1,'#7d8ea3');
    g.fillStyle=sky; g.fillRect(0,0,W,HZ);
    const ox=par(0.16);
    for(let k=-1;k<2;k++){
      const bx=ox+k*W*1.5;
      g.fillStyle='#3b4658';
      for(let i=0;i<6;i++) g.fillRect(bx+i*W*.26, HZ-H*(0.10+0.03*((i*5)%3)), W*.20, H*.16);
      // ビッグベン（吉兆のときは金になる）
      const tx=bx+W*.62, tw=W*.085, th=H*.34;
      g.fillStyle = omen ? '#e8b83c' : '#5d6779';
      g.fillRect(tx,HZ-th,tw,th);
      g.fillStyle = omen ? '#f6d878' : '#6f7a8d';
      g.fillRect(tx-tw*.12,HZ-th-H*.03,tw*1.24,H*.03);
      g.beginPath(); g.moveTo(tx-tw*.12,HZ-th-H*.03);
      g.lineTo(tx+tw/2,HZ-th-H*.11); g.lineTo(tx+tw*1.12,HZ-th-H*.03); g.closePath(); g.fill();
      g.fillStyle = omen ? '#fff4c8' : '#c9d2de';   // 文字盤
      g.beginPath(); g.arc(tx+tw/2,HZ-th+H*.045,tw*.34,0,7); g.fill();
      g.strokeStyle='#2c3444'; g.lineWidth=2;
      g.beginPath(); g.moveTo(tx+tw/2,HZ-th+H*.045);
      g.lineTo(tx+tw/2+Math.cos(t/2400)*tw*.24, HZ-th+H*.045+Math.sin(t/2400)*tw*.24); g.stroke();
      if(omen){
        g.globalAlpha=.35+Math.sin(t/380)*.18;
        g.fillStyle='#ffdf7a';
        g.beginPath(); g.arc(tx+tw/2,HZ-th+H*.02,tw*1.5,0,7); g.fill();
        g.globalAlpha=1;
      }
    }
    g.fillStyle='#2b3546'; g.fillRect(0,HZ-2,W,H*.05);
  }

  // 大会名のレタリング
  g.save();
  g.textAlign='center'; g.textBaseline='middle';
  const fs=Math.max(16,Math.min(30,W*0.075));
  g.font=`${fs}px "Dela Gothic One", sans-serif`;
  g.lineWidth=Math.max(3,fs*0.16); g.strokeStyle='rgba(0,0,0,.55)';
  g.strokeText(sg.logo, W/2, H*0.135);
  g.fillStyle=sg.ink;
  g.fillText(sg.logo, W/2, H*0.135);
  g.restore();
}

/* 観客の服。スタンドを埋めるので、彩度の高い色を散らす。 */
const CROWD=['#ff5b6e','#ffd23f','#4ad6ff','#7ef07a','#ff9f43','#c98bff','#ffffff','#ff7ac0','#5b8cff'];
const hash1=n=>{ const s=Math.sin(n*127.1)*43758.5453; return s-Math.floor(s); };

function drawBack(camX, surface, sg, omen){
  if(sg){ drawTheme(sg, camX, omen); return; }
  // 昼の空
  const sky=g.createLinearGradient(0,0,0,H*.56);
  sky.addColorStop(0,'#3fa8d8'); sky.addColorStop(.65,'#8fd2e8'); sky.addColorStop(1,'#cdeaf0');
  g.fillStyle=sky; g.fillRect(0,0,W,H*.56);
  // 雲
  g.fillStyle='rgba(255,255,255,.75)';
  for(let i=0;i<3;i++){
    const cx=((i*W*.47 - camX*0.04)%(W*1.5)+W*1.5)%(W*1.5)-W*.2, cy=H*(.07+.045*i);
    g.beginPath(); g.ellipse(cx,cy,W*.10,H*.026,0,0,7); g.fill();
    g.beginPath(); g.ellipse(cx+W*.055,cy+H*.008,W*.065,H*.021,0,0,7); g.fill();
  }
  // 照明塔
  const off=(camX*0.12)%170;
  for(let i=-1;i<W/170+2;i++){
    const x=i*170-off;
    g.fillStyle='#7f8fa0'; g.fillRect(x+28,H*.12,3,H*.26);
    g.fillStyle='#c8d6e2'; g.fillRect(x+18,H*.105,24,7);
    g.fillStyle='rgba(255,255,255,.9)';
    for(let k=0;k<4;k++) g.fillRect(x+19.5+k*5.5,H*.107,3.5,4);
  }
  // スタンド（屋根・段・色とりどりの観客）
  const top=H*.34, bot=H*.545;
  g.fillStyle='#dfe6ec'; g.fillRect(0,top-H*.035,W,H*.035);      // 屋根
  g.fillStyle='#b9c4cd'; g.fillRect(0,top-4,W,4);
  g.fillStyle='#5d6b78'; g.fillRect(0,top,W,bot-top);            // スタンド本体
  const rows=6, rowH=(bot-top)/rows, step=7;
  const ox=(camX*0.35)%step;
  for(let r=0;r<rows;r++){
    const y=top+r*rowH+2;
    g.fillStyle='rgba(0,0,0,.16)'; g.fillRect(0,y+rowH-3,W,2);   // 段の影
    for(let x=-step;x<W+step;x+=step){
      const key=Math.round((x+ox+camX*0.35)/step)+r*997;
      if(hash1(key)<0.12) continue;                              // ところどころ空席
      g.fillStyle=CROWD[Math.floor(hash1(key+7)*CROWD.length)];
      const w=step-2.6, hgt=rowH*0.52;
      g.fillRect(x-ox, y+rowH*0.30, w, hgt);
      g.fillStyle='rgba(255,224,196,.9)';                        // 顔
      g.fillRect(x-ox+0.8, y+rowH*0.13, w-1.6, rowH*0.20);
    }
  }
  g.fillStyle='#7d8a96'; g.fillRect(0,bot-3,W,3);
  g.fillStyle='#2f7a48'; g.fillRect(0,bot,W,H*.03);              // 内馬場の緑
}
/* 馬（横から見た走行）。s は体長のおおよそのピクセル数。 */
function drawHorse(x,y,s,coat,waku,num,phase,running,hl,label){
  const c=COATS[coat]||COATS[0];
  const dark=c.m||'#2b1a10';
  const legCol = coat===3 ? '#8d8781' : dark;   // 芦毛は脚も淡い
  g.save(); g.translate(x,y);
  const ground=s*0.50;
  // 接地影（馬体の上下動には追従させない）
  g.globalAlpha=.30; g.fillStyle='#000';
  g.beginPath(); g.ellipse(0,ground,s*0.46,s*0.068,0,0,7); g.fill(); g.globalAlpha=1;
  const bob = running? Math.sin(phase*2)*s*0.045 : 0;
  g.translate(0,bob);
  g.lineCap='round'; g.lineJoin='round';

  // 脚：肩/寛から膝、球節までの2関節。ギャロップは前後で半周期ずらす。
  const leg=(ax,ay,off,amp,len,col,w,stand)=>{
    g.strokeStyle=col; g.lineWidth=Math.max(1,w);
    const p=phase+off;
    const sw  = running? Math.sin(p)*amp : stand;      // 静止時も前後の肢をわずかにずらす
    const bend= running? Math.max(0,Math.cos(p))*0.85+0.18 : 0.14;
    const L=len*s;
    const kx=ax+Math.sin(sw)*L*0.55,       ky=ay+Math.cos(sw)*L*0.55;
    const fx=kx+Math.sin(sw-bend)*L*0.52,  fy=ky+Math.cos(sw-bend)*L*0.52;
    g.beginPath(); g.moveTo(ax,ay); g.lineTo(kx,ky);
    g.lineTo(fx,Math.min(fy,ground-bob)); g.stroke();
  };
  // 奥側の対（暗く細く＝奥行き）
  g.globalAlpha=.72;
  leg(-0.28*s,0.09*s, 0.7, 0.52, 0.38, legCol, s*0.055, -0.13);
  leg( 0.265*s,0.10*s, 3.7, 0.56, 0.36, legCol, s*0.055,  0.12);
  g.globalAlpha=1;

  // 尾
  g.strokeStyle=dark; g.lineWidth=s*0.075;
  g.beginPath(); g.moveTo(-0.42*s,-0.08*s);
  g.quadraticCurveTo(-0.60*s,-0.04*s+(running?Math.sin(phase*1.1)*0.05*s:0.02*s),-0.70*s,0.13*s);
  g.stroke();

  // 胴（後躯・腹・肩の3塊で馬らしいシルエットを作る）
  g.fillStyle=c.c;
  g.beginPath(); g.ellipse(-0.21*s,-0.03*s,0.25*s,0.205*s,0,0,7); g.fill();
  g.beginPath(); g.ellipse( 0.05*s, 0.00*s,0.33*s,0.180*s,0,0,7); g.fill();
  g.beginPath(); g.ellipse( 0.26*s,-0.05*s,0.19*s,0.185*s,0,0,7); g.fill();

  // 首（走行時は前へ低く、静止時はやや起こす）
  const nx=running?0.575:0.535, ny=running?-0.34:-0.33;
  g.beginPath();
  g.moveTo(0.30*s,-0.17*s);
  g.quadraticCurveTo(0.47*s,-0.20*s,nx*s,ny*s);
  g.lineTo((nx+0.115)*s,(ny+0.03)*s);
  g.quadraticCurveTo(0.58*s,-0.13*s,0.42*s,0.04*s);
  g.closePath(); g.fill();

  // 頭
  // 走行時は首を伸ばして鼻先が前、静止時は鼻面を下げて立ち姿にする
  g.save(); g.translate((nx+0.055)*s,(ny-0.015)*s); g.rotate(running?-0.30:0.30);
  g.fillStyle=c.c;
  g.beginPath(); g.ellipse(0,0,0.128*s,0.066*s,0,0,7); g.fill();
  g.fillStyle=dark;
  g.beginPath(); g.ellipse(0.110*s,0.010*s,0.030*s,0.040*s,0,0,7); g.fill();
  g.beginPath(); g.moveTo(-0.09*s,-0.042*s); g.lineTo(-0.122*s,-0.135*s); g.lineTo(-0.038*s,-0.060*s); g.closePath(); g.fill();
  g.fillStyle='#0c0a08';
  g.beginPath(); g.ellipse(-0.020*s,-0.026*s,0.015*s,0.015*s,0,0,7); g.fill();
  g.restore();

  // たてがみ
  g.strokeStyle=dark; g.lineWidth=s*0.055;
  g.beginPath(); g.moveTo(0.345*s,-0.165*s);
  g.quadraticCurveTo(0.47*s,-0.27*s,(nx+0.01)*s,(ny-0.01)*s); g.stroke();

  // 手前側の対（胴より前面。ギャロップは前後を半周期ずらす）
  leg(-0.255*s,0.10*s, 0.0, 0.60, 0.40, legCol, s*0.068,  0.11);
  leg( 0.290*s,0.11*s, 3.0, 0.62, 0.38, legCol, s*0.068, -0.10);

  // 騎手
  if(running||hl){
    const col=WAKU[clamp(waku,0,7)];
    g.fillStyle='#2b2118';
    g.beginPath(); g.ellipse(0.04*s,-0.19*s,0.17*s,0.052*s,-0.05,0,7); g.fill();
    g.fillStyle=col;
    g.beginPath();
    g.moveTo(-0.05*s,-0.21*s);
    g.quadraticCurveTo(0.05*s,-0.42*s,0.215*s,-0.375*s);
    g.quadraticCurveTo(0.14*s,-0.23*s,0.10*s,-0.17*s);
    g.closePath(); g.fill();
    g.strokeStyle=col; g.lineWidth=s*0.05;
    g.beginPath(); g.moveTo(0.17*s,-0.345*s); g.lineTo(0.395*s,-0.255*s); g.stroke();
    g.strokeStyle='#171b22'; g.lineWidth=s*0.055;
    g.beginPath(); g.moveTo(0.02*s,-0.255*s); g.lineTo(-0.01*s,-0.125*s); g.stroke();
    g.fillStyle=col;
    g.beginPath(); g.arc(0.255*s,-0.405*s,0.075*s,0,7); g.fill();
    g.fillStyle='#11151c';
    g.beginPath(); g.ellipse(0.305*s,-0.415*s,0.035*s,0.016*s,-0.1,0,7); g.fill();
  }
  // 砂／芝の飛沫
  if(running){
    g.fillStyle='rgba(255,255,255,.10)';
    for(let i=0;i<3;i++){
      const t=(phase*0.7+i*2.1)%3;
      g.beginPath(); g.ellipse(-0.5*s-t*0.14*s, ground-t*0.06*s, s*0.05*(1+t*.3), s*0.028*(1+t*.3),0,0,7); g.fill();
    }
  }
  // 自馬だけ馬番を出す（団子の中でも見失わないように）
  if(label){
    g.fillStyle='rgba(6,12,10,.85)';
    roundRect(-0.16*s,-0.78*s,0.32*s,0.22*s,2); g.fill();
    g.strokeStyle='#f4c44a'; g.lineWidth=1; g.stroke();
    g.fillStyle='#f4c44a';
    g.font=`${Math.max(8,s*0.17)}px "DotGothic16",monospace`;
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText(num,0,-0.665*s);
    g.beginPath(); g.moveTo(-0.05*s,-0.54*s); g.lineTo(0.05*s,-0.54*s); g.lineTo(0,-0.47*s); g.closePath(); g.fill();
  }
  g.restore();
}
/* 芝／ダートの路面 */
/* 画面に映すコースの横幅（m）。狭いと隊列が画面外に出てしまう。 */
const VIEW_M = 44;
function drawTrack(camX, surface, D, bend){
  bend=bend||0;
  const top=H*.575, bot=H;
  const base = surface==='芝'
    ? ['#47bd72','#54d182','#34a05a']
    : ['#b07d4a','#c28c53','#8d6039'];
  const grd=g.createLinearGradient(0,top,0,bot);
  grd.addColorStop(0,base[2]); grd.addColorStop(.35,base[0]); grd.addColorStop(1,base[1]);
  g.fillStyle=grd; g.fillRect(0,top,W,bot-top);
  // 縞（芝の刈り跡）
  const M2P = W/VIEW_M;
  const o=(camX*M2P)%(M2P*5);
  g.globalAlpha= surface==='芝'?.10:.06;
  for(let i=-1;i<W/(M2P*5)+2;i++){
    g.fillStyle= i%2? '#ffffff':'#000000';
    g.fillRect(i*M2P*5-o,top,M2P*5,bot-top);
  }
  g.globalAlpha=1;
  // ラチ（コーナーでは内ラチが弧を描き、旋回しているのが分かる）
  const bow = x => -bend*26*Math.sin(Math.PI*(x/W));   // 画面中央がいちばん膨らむ
  g.strokeStyle='rgba(255,255,255,.5)'; g.lineWidth=2;
  g.beginPath();
  g.moveTo(0,top+2);
  g.quadraticCurveTo(W/2,top+2+bow(W/2)*2,W,top+2);
  g.stroke();
  const po=(camX*M2P)%(M2P*10);
  g.fillStyle='rgba(255,255,255,.35)';
  for(let i=-1;i<W/(M2P*10)+2;i++){
    const px=i*M2P*10-po;
    g.fillRect(px,top-8+bow(px),2,10);
  }
  // 残り距離ハロン棒
  for(const rem of [1000,800,600,400,200]){
    const px=(D-rem-camX)*M2P;
    if(px>-40 && px<W+40){
      g.fillStyle='#f2f2f2'; g.fillRect(px,top-26,3,26);
      g.fillStyle='#e0334a'; g.fillRect(px-6,top-30,15,9);
      g.fillStyle='#fff'; g.font='7px "DotGothic16",monospace'; g.textAlign='center';
      g.fillText(rem, px+1, top-23);
    }
  }
  // ゴール板
  const gx=(D-camX)*M2P;
  if(gx>-60&&gx<W+60){
    g.fillStyle='#f4c44a'; g.fillRect(gx-1,top-46,4,46);
    g.fillStyle='#131820'; g.fillRect(gx-22,top-62,46,18);
    g.strokeStyle='#f4c44a'; g.lineWidth=1; g.strokeRect(gx-22,top-62,46,18);
    g.fillStyle='#f4c44a'; g.font='10px "DotGothic16",monospace'; g.textAlign='center';
    g.fillText('GOAL',gx+1,-0+top-49);
    for(let i=0;i<6;i++){ g.fillStyle=i%2?'#fff':'#111'; g.fillRect(gx-22+i*7.6,top-44,7.6,3); }
  }
}
/* パドックで選んだ1頭の名前板。枠色・馬名・脚質・オッズを出す。 */
function drawNamePlate(h, odds){
  const x=9, y=H*0.27, w=Math.min(W-18, W*0.60), hh=H*0.30;
  g.fillStyle='rgba(5,22,13,.88)';
  roundRect(x,y,w,hh,7); g.fill();
  g.strokeStyle='rgba(184,147,63,.75)'; g.lineWidth=1.5;
  roundRect(x,y,w,hh,7); g.stroke();
  const bs=Math.min(hh*0.36,30);
  g.fillStyle=WAKU[clamp(h.num-1,0,7)];
  roundRect(x+10,y+10,bs,bs,4); g.fill();
  g.strokeStyle='rgba(0,0,0,.55)'; g.lineWidth=1; roundRect(x+10,y+10,bs,bs,4); g.stroke();
  g.fillStyle=wakuInk(h.num); g.font=`${Math.round(bs*0.62)}px "DotGothic16",monospace`;
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText(h.num, x+10+bs/2, y+10+bs/2+1);
  g.textAlign='left'; g.textBaseline='alphabetic';
  g.fillStyle='#eaf7ec';
  g.font=`${Math.round(Math.max(12,Math.min(16,w*0.072)))}px "DotGothic16",monospace`;
  g.fillText(h.name, x+bs+20, y+10+bs*0.74);
  g.fillStyle='#a3ccb2'; g.font='10px "DotGothic16",monospace';

  if(odds){
    g.fillStyle='#f4c44a'; g.font='12px "DotGothic16",monospace';

    g.fillText(`単勝 ${odds.win.toFixed(1)}`, x+w-11, y+hh-13);
    g.textAlign='left';

}
/* 出走中の全馬。奥のレーンから手前へ描いて重なりに奥行きを出す。 */
function drawField(sim, camX){
  const M2P=W/VIEW_M, n=sim.run.length;
  sim.run.forEach((r,i)=>{
    r.laneY = H*0.615 + (i/Math.max(1,n-1))*H*0.315;
    r.laneJit = (i%2)?0.6:-0.6;      // 完全に重ならないよう前後に少しずらす
  });
  [...sim.run].sort((a,b)=>a.laneY-b.laneY).forEach(r=>{
    const px=(r.x+r.laneJit-camX)*M2P;
    if(px<-70||px>W+70) return;
    const sc=Math.min(W*0.085,H*0.13)*(0.80+(r.laneY/H)*0.36);
    const focus = (r===sim.me);
    drawHorse(px,r.laneY,sc,r.h.coat,r.h.num-1,r.h.num,r.phase,true,focus,focus);
  });
}
/* 厩舎シーン */
/* --- 厩舎の格 ---
   稼ぎと格が上がると建て替わる。0=じめじめした板張りのぼろ厩舎、
   1=乾いた木の普通の厩舎、2=白塗りの高級厩舎。ネームプレートの傾きも直る。 */
function stableRank(h){
  if(!h) return 0;
  const s = (h.earned||0)/1000 + (h.wins||0)*3 + (h.cls||0)*4 + (h.g1||0)*10;
  return s>=60 ? 2 : s>=22 ? 1 : 0;
}
const STABLE = [
  {wall:['#1a140e','#221a12'], damp:true,  floor:'#241c11', straw:'#4e3d20',
   plate:'#3a2e1e', ink:'#c9b384', tilt:-0.10, glow:.26},
  {wall:['#3a2c1c','#453522'], damp:false, floor:'#3a2d1a', straw:'#7d6231',
   plate:'#6b5323', ink:'#f0e0b8', tilt:-0.025, glow:.30},
  {wall:['#e6e0d2','#f4f0e4'], damp:false, floor:'#c6b99e', straw:'#dcc890',
   plate:'#f7f3e7', ink:'#4a3a1c', tilt:0, glow:.34, lux:true}
];
function drawStable(h, t){
  const rk=stableRank(h), S=STABLE[rk];
  const grd=g.createLinearGradient(0,0,0,H);
  grd.addColorStop(0, rk===2?'#243a30':'#16332a'); grd.addColorStop(1,'#0c1d15');
  g.fillStyle=grd; g.fillRect(0,0,W,H);
  // 板壁
  for(let i=0;i<8;i++){
    g.fillStyle= i%2?S.wall[1]:S.wall[0];
    g.fillRect(0,i*(H*.62/8),W,H*.62/8-1);
  }
  if(S.damp){                                   // 湿ったしみと苔
    g.globalAlpha=.5;
    for(let i=0;i<9;i++){
      const x=(i*137)%W, y=(i*61)%(H*.55);
      g.fillStyle= i%3? 'rgba(30,45,25,.55)':'rgba(20,25,18,.6)';
      g.beginPath(); g.ellipse(x,y,W*.07,H*.035,0.4,0,7); g.fill();
    }
    g.globalAlpha=1;
    g.strokeStyle='rgba(0,0,0,.45)'; g.lineWidth=1;     // 板の割れ
    for(let i=0;i<4;i++){
      const x=(i*97+40)%W;
      g.beginPath(); g.moveTo(x,H*.06); g.lineTo(x+6,H*.30); g.lineTo(x-3,H*.55); g.stroke();
    }
  }
  if(S.lux){                                    // 白塗りの見切り縁
    g.fillStyle='#cfc4ad'; g.fillRect(0,H*.585,W,H*.035);
    g.fillStyle='rgba(255,255,255,.55)'; g.fillRect(0,H*.585,W,3);
  }
  // 窓
  const wx=W*.62, wy=H*.10, ww=W*.22, wh=H*.20;
  g.fillStyle= rk===2?'rgba(190,225,255,.30)':'rgba(150,200,255,.07)';
  g.fillRect(wx,wy,ww,wh);
  g.strokeStyle= rk===2?'rgba(120,90,40,.65)':'rgba(150,200,255,.20)';
  g.lineWidth=2; g.strokeRect(wx,wy,ww,wh);
  g.lineWidth=1;
  g.beginPath(); g.moveTo(wx+ww/2,wy); g.lineTo(wx+ww/2,wy+wh);
  g.moveTo(wx,wy+wh/2); g.lineTo(wx+ww,wy+wh/2); g.stroke();
  // 床（藁）
  g.fillStyle=S.floor; g.fillRect(0,H*.62,W,H*.38);
  g.globalAlpha=.5;
  for(let i=0;i<70;i++){
    const x=(i*79)%W, y=H*.63+((i*53)%(H*.35));
    g.strokeStyle=S.straw; g.lineWidth=1;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+7,y+2); g.stroke();
  }
  g.globalAlpha=1;
  // 飼い葉桶
  g.fillStyle= rk===2?'#8a6a3a':'#2f2417'; roundRect(W*.06,H*.72,W*.16,H*.10,3); g.fill();
  g.fillStyle= rk===2?'#d8bb70':'#6b5323'; roundRect(W*.07,H*.725,W*.14,H*.035,2); g.fill();
  // 吊りランプ。馬体が壁に沈まないよう、光だまりで浮かせる
  const lx=W*.52;
  const lamp=g.createRadialGradient(lx,H*.085,3,lx,H*.72,W*.55);
  lamp.addColorStop(0,`rgba(255,214,150,${S.glow})`);
  lamp.addColorStop(.45,'rgba(255,196,124,.11)');
  lamp.addColorStop(1,'rgba(255,186,110,0)');
  g.fillStyle=lamp; g.fillRect(0,0,W,H);
  g.fillStyle= rk===2?'#8a7a5a':'#3a3026'; g.fillRect(lx-1,0,2,H*.055);
  g.fillStyle= rk===2?'#fff0c0':'#ffd98a';
  g.beginPath(); g.moveTo(lx-10,H*.09); g.lineTo(lx+10,H*.09);
  g.lineTo(lx+5,H*.055); g.lineTo(lx-5,H*.055); g.closePath(); g.fill();
  // 特別レースを勝った証のレイ（赤と金の糸）
  if((h.sg||0)>0) drawLei(W*.10, H*.10, W*.44, H*.09, t);
  // ネームプレート（格が低いうちは傾いている）
  drawPlate(h, S, W*.09, H*.30);
  // 馬（呼吸で上下）
  const s=Math.min(W*0.26,H*0.38);
  const breathe=Math.sin(t/900)*s*0.012;
  drawHorse(W*0.52,H*0.74+breathe,s,h.coat,0,0,Math.sin(t/700)*0.18,false,false);
}
/* 壁に掲げられたレイ。赤と金の糸を撚った祝いの輪。 */
function drawLei(x,y,w,sag,t){
  const mid=x+w/2, dip=y+sag+Math.sin(t/1600)*2;
  for(const [col,off,lw] of [['#c0182f',0,3.5],['#f0c24a',3,2.5]]){
    g.strokeStyle=col; g.lineWidth=lw;
    g.beginPath(); g.moveTo(x,y+off);
    g.quadraticCurveTo(mid,dip+off*2,x+w,y+off); g.stroke();
  }
  for(let i=0;i<=8;i++){                        // 花の玉
    const u=i/8, bx=x+w*u;
    const by=(1-u)*(1-u)*y + 2*(1-u)*u*(dip+2) + u*u*y;
    g.fillStyle= i%2?'#e8324c':'#ffd45e';
    g.beginPath(); g.arc(bx,by,4.2,0,7); g.fill();
    g.fillStyle='rgba(255,255,255,.45)';
    g.beginPath(); g.arc(bx-1.2,by-1.2,1.4,0,7); g.fill();
  }
}
/* 馬房のネームプレート。ぼろ厩舎では釘が緩んで傾いている。 */
function drawPlate(h,S,x,y){
  const w=Math.min(W*0.40,150), hh=Math.max(22,H*0.085);
  g.save();
  g.translate(x+w/2,y+hh/2); g.rotate(S.tilt); g.translate(-w/2,-hh/2);
  g.fillStyle='rgba(0,0,0,.35)'; roundRect(2,3,w,hh,4); g.fill();
  g.fillStyle=S.plate; roundRect(0,0,w,hh,4); g.fill();
  g.strokeStyle= S.lux?'#c8a45a':'rgba(0,0,0,.5)'; g.lineWidth=S.lux?2:1;
  roundRect(0,0,w,hh,4); g.stroke();
  g.fillStyle='rgba(0,0,0,.35)';                 // 釘
  g.beginPath(); g.arc(7,hh/2,2,0,7); g.fill();
  g.beginPath(); g.arc(w-7,hh/2,2,0,7); g.fill();
  g.fillStyle=S.ink;
  g.font=`${Math.max(11,Math.min(15,w*0.11))}px "DotGothic16",monospace`;
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText(h.name, w/2, hh/2+1);
  g.restore();
  g.textAlign='left'; g.textBaseline='alphabetic';
}
/* 調教シーン */
function drawTraining(h, menu, t, prog){
  const surf = menu==='ダート'?'ダート':'芝';
  drawBack(t*0.02, surf);
  drawTrack(t*0.012, surf, 99999);
  const s=Math.min(W*0.20,H*0.30);
  const x = W*0.18 + (W*0.5)*Math.min(1,prog*1.3);

   黙って失敗すると「ページを離れるとデータが消える」形で表面化する。 */
let saveWarned=false;
function save(){
  const before=app.saveFailed;
  try{
    const json=JSON.stringify(G);
    localStorage.setItem(SAVE_KEY, json);
    if(localStorage.getItem(SAVE_KEY)!==json) throw new Error('readback mismatch');
    app.saveFailed=false;
  }catch(e){
    app.saveFailed=true;
    if(!saveWarned){ saveWarned=true; toast('この環境では保存できません'); }
  }

  if(app.saveFailed!==before && view) show(view, viewData);
  return !app.saveFailed;
}
function load(){

   ウィンドウ、サイトデータのブロックなど）。その場合は自動セーブが効かないので、
   下のセーブコードで持ち出せるようにしてある。 */
function storageOK(){

  catch(e){ return false; }

function validSave(o){

/* --- 合言葉（12文字のひらがな・4-4-4） ---
   セーブ本体は合言葉には入らない（44^12 ≒ 65ビットしかない）。合言葉は
   保存済みデータを引き出す「鍵」で、アーケードのICカードと同じ役目。    */
const KANA='あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわ'.split('');
const PASS_LEN=12;
function newPass(){
  let buf;
  try{ buf=new Uint32Array(PASS_LEN); crypto.getRandomValues(buf); }
  catch(e){ buf=Array.from({length:PASS_LEN},()=>Math.floor(Math.random()*4294967296)); }
  let s='';
  for(let i=0;i<PASS_LEN;i++) s+=KANA[buf[i]%KANA.length];
  return s;
}
/* 保存先のIDに使えるのは英数字だけなので、かなを2桁の36進数に落とす */
const passId = p => p.split('').map(c=>KANA.indexOf(c).toString(36).padStart(2,'0')).join('');
const toHira = s => String(s||'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const normPass = s => toHira(s).replace(/[^ぁ-ゖ]/g,'');
const validPass = p => p.length===PASS_LEN && p.split('').every(c=>KANA.indexOf(c)>=0);
const passGroups = p => [p.slice(0,4),p.slice(4,8),p.slice(8,12)];

let DB=null, dbTried=false;
async function getDB(){
  if(dbTried) return DB;
  dbTried=true;
  try{ if(window.claude && claude.use) DB=await claude.use('db'); }catch(e){ DB=null; }
  return DB;
}
async function passPut(pass, data){
  const id=passId(pass);
  let cloud=false;
  const db=await getDB();
  if(db){
    try{ await db.doc('saves/'+id).set({v:2, at:Date.now(), save:data}); cloud=true; }
    catch(e){ cloud=false; }
  }
  try{ localStorage.setItem('pocketturf.pass.'+id, JSON.stringify(data)); }catch(e){}
  return cloud;
}
async function passGet(pass){
  const id=passId(pass);
  const db=await getDB();
  if(db){
    try{
      const snap=await db.doc('saves/'+id).get();
      if(snap&&snap.exists){ const d=snap.data(); if(d&&d.save) return d.save; }
    }catch(e){}
  }
  try{
    const s=localStorage.getItem('pocketturf.pass.'+id);
    if(s) return JSON.parse(s);
  }catch(e){}
  return null;
}

          </div>
          <p class="muted" style="margin:0 0 7px;font-size:11px">馬券も売店もメダルが要る。${WORK_WEEKS}週を使えばアルバイトで立て直せる。</p>

        <button class="btn center wide" data-act="work" style="min-height:40px;margin-bottom:7px">

        セーブする<small>進行は自動でも保存される</small></button>`;

  /* ---- 愛馬 ---- */
  horse(){
    const h=G.horse;
    const apt=Object.entries(h.aptD).map(([k,v])=>
      `<div class="row between" style="font-size:11.5px"><span class="muted">${k}</span><b class="${v==='S'||v==='A'?'gold':''}">${v}</b></div>`).join('');
    return `<h2 class="head">${esc(h.name)}</h2>
      <div class="card">
        <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:8px">

          <span class="pill jo">${COATS[h.coat].n}</span>
          <span class="pill jo">${h.style}</span>
          <span class="pill jo">${h.growth}</span>
          ${condBadge(h)}
        </div>
        ${statBars(h)}
        <div class="sep"></div>
        <div class="row between"><span class="muted">上限（${G.year}歳時）</span><b class="num">${capOf(h,G.year)}</b></div>
      </div>
      <div class="grid2">
        <div class="card tight">
          <p class="eyebrow">馬場適性</p>

          <div class="row between" style="font-size:11.5px"><span class="muted">ダート</span><b class="${'SA'.includes(h.aptDirt)?'gold':''}">${h.aptDirt}</b></div>

          <p class="eyebrow">騎手</p>

          <p class="eyebrow">距離適性</p>${apt}
        </div>
      </div>
      <div class="card tight">
        <div class="row between"><span class="muted">通算成績</span><b class="num">${h.races}戦${h.wins}勝</b></div>

        <div class="row between"><span class="muted">重賞勝利</span><b class="num">${h.g1}</b></div>
        <div class="sep"></div>

        <div class="row between"><span class="muted">ファン</span><b class="num">${yen(h.fans)}人</b></div>

  /* ---- アルバイト ---- */
  work(){
    // この4週で取り逃がすレースを先に見せる（育成より痛い場合がある）
    const miss=[];
    for(let k=0;k<WORK_WEEKS;k++){
      const t=G.week+k-1;
      const week=t%WEEKS_PER_YEAR+1, year=G.year+Math.floor(t/WEEKS_PER_YEAR);
      if(year>5) break;
      racesFor({horse:G.horse, year, week}).forEach(r=>miss.push({r,week,year}));
    }
    const cards=JOBS.map((j,i)=>`
      <div class="card tight">
        <div class="row between" style="margin-bottom:4px">
          <b style="font-size:13.5px">${j.k}</b>
          <span class="dot" style="font-size:11px;color:var(--cyan)">成功率 ${Math.round(j.rate*100)}%</span>
        </div>
        <p class="muted" style="margin:0 0 6px;font-size:11px">${j.d}</p>
        <div class="row between" style="font-size:11px;margin-bottom:3px">
          <span class="muted">成功</span><b class="num gold">+${yen(j.win)}</b></div>
        <div class="row between" style="font-size:11px;margin-bottom:3px">
          <span class="muted">失敗</span><b class="num ${j.lose?'':'hot'}">+${yen(j.lose)}</b></div>
        <div class="row between" style="font-size:11px;margin-bottom:7px">
          <span class="muted">平均</span><b class="num cyan">${yen(jobEV(j))}</b></div>
        <button class="btn primary center wide" data-act="dojob" data-i="${i}" style="min-height:38px">${j.k}をやる</button>
      </div>`).join('');
    return `<div class="row between" style="margin-bottom:6px">
        <p class="eyebrow" style="margin:0">PART-TIME / アルバイト</p>
        <span class="dot gold" style="font-size:12px">◉ ${yen(G.medals)}</span>
      </div>
      <h2 class="head">${WORK_WEEKS}週を売ってメダルに換える</h2>
      <p class="muted" style="margin:-4px 0 9px">その間は調教も出走もできない。愛馬の疲労だけは20抜ける。</p>
      ${miss.length?`<div class="card tight" style="border-color:#5c2b28">
        <p class="eyebrow" style="color:#ff9f8b">見送ることになるレース</p>
        ${miss.slice(0,5).map(m=>`<div class="row between" style="font-size:11px;padding:2px 0">
          <span>${esc(m.r.n)}</span>
          <span class="dot" style="color:var(--ink-3)">${m.year}歳${m.week}週</span></div>`).join('')}
      </div>`:''}
      ${cards}
      <button class="btn ghost center wide" data-act="backhome">やめて厩舎へもどる</button>`;
  },
  /* ---- アルバイトの結果 ---- */
  workresult(d){
    return `<div class="center pop" style="margin-bottom:10px">
        <p class="eyebrow">${esc(d.job.k)}</p>
        <div class="rank ${d.ok?'gold':''}" style="font-size:38px">+${yen(d.pay)}</div>
        <p class="${d.ok?'ok':'hot'}" style="margin:4px 0 0;font-size:12px;font-weight:700">${d.ok?'成功':'失敗'}</p>
      </div>
      <div class="card"><p class="muted" style="margin:0">${d.ok?d.job.okTxt:d.job.ngTxt}</p></div>
      <div class="card tight">
        <div class="row between"><span class="muted">メダル残高</span><b class="num gold">${yen(G.medals)}</b></div>
        <div class="sep"></div>
        <div class="row between"><span class="muted">経過</span><b class="num">${WORK_WEEKS}週</b></div>
      </div>
      <button class="btn primary center wide" data-act="backhome">厩舎へもどる</button>`;

  /* ---- 売店 ---- */
  shop(){
    const h=G.horse, lim=capOf(h,G.year)+ITEM_OVER;
    const sel=app.shopStat||'sp';
    const selName=STAT_KEYS.find(s=>s[0]===sel)[1];
    const chips=STAT_KEYS.map(([k,lb])=>`
      <button class="btn center" data-act="pickstat" data-k="${k}"
        style="min-height:44px;font-size:10.5px;padding:5px 2px;${k===sel?'border-color:var(--gold);background:#231d0d;color:var(--gold)':''}">
        ${lb}<small class="num" style="${k===sel?'color:var(--gold)':''}">${Math.round(h[k])}</small></button>`).join('');
    const cards=ITEMS.map((it,i)=>{
      const can=G.medals>=it.p;
      return `<div class="card tight">
        <div class="row between" style="margin-bottom:4px">
          <b style="font-size:13.5px">${it.k}</b>
          <span class="num" style="font-size:12px;color:${can?'var(--gold)':'var(--ink-3)'}">◉ ${yen(it.p)}</span>
        </div>
        <p class="muted" style="margin:0 0 7px;font-size:11px">${it.d}${
          it.mode==='pick'?`<br><span class="gold">対象：${selName}</span>`:''}</p>
        <button class="btn ${can?'primary':'ghost'} center wide" data-act="buy" data-i="${i}"
          style="min-height:38px" ${can?'':'disabled'}>${can?'使う':'メダルが足りない'}</button>
      </div>`;
    }).join('');
    return `<div class="row between" style="margin-bottom:6px">
        <p class="eyebrow" style="margin:0">SHOP / 売店</p>
        <span class="dot gold" style="font-size:12px">◉ ${yen(G.medals)}</span>
      </div>
      <h2 class="head">メダルを愛馬に還元する</h2>
      <p class="muted" style="margin:-4px 0 9px">週は消費しない。ただしアイテムで伸ばせるのは
        成長上限＋${ITEM_OVER}（いま <b class="gold num">${lim}</b>）まで。</p>
      <div class="card tight">
        <p class="eyebrow">強化する能力（ビール・シャンパン用）</p>
        <div class="grid4" style="grid-template-columns:repeat(5,1fr)">${chips}</div>
      </div>
      ${cards}`;
  },
  /* ---- 記録 ---- */
  record(){
    const rows=G.history.slice().reverse().map(r=>`
      <tr class="${r.pos===1?'me':''}">
        <td class="num">${r.y}歳${String(r.w||r.m||0).padStart(2,'0')}週</td>
        <td class="nm">${esc(r.n)}</td>
        <td class="num">${r.pos}着</td>
        <td class="num gold">${r.gain>0?'+'+yen(r.gain):yen(r.gain)}</td>
      </tr>`).join('');
    const past=G.careers.map((c,i)=>`
      <div class="card tight"><div class="row between">
        <b style="font-size:12px">${esc(c.name)}</b><span class="pill g1">評価 ${c.rank}</span></div>
        <div class="muted" style="font-size:11px;margin-top:4px">${c.races}戦${c.wins}勝・重賞${c.g1}勝・${yen(c.earned)}メダル</div>
      </div>`).join('');
    return `<h2 class="head">記録</h2>
      ${rows?`<div class="card"><table class="res"><thead><tr><th>日付</th><th>レース</th><th>着順</th><th>収支</th></tr></thead><tbody>${rows}</tbody></table></div>`
            :`<p class="muted">まだ出走記録がない。</p>`}
      ${(()=>{
        const h=G.horse, g1w=h?(h.g1w||0):0, open=sgReady(h);
        const seen=(G.sgFound&&G.sgFound.length)>0;
        if(!seen && !g1w) return '';                 // 何も知らないうちは伏せておく
        return `<p class="eyebrow">四季のカップ</p>
        <div class="card tight">
          <div class="row between" style="margin-bottom:6px">
            <span class="muted" style="font-size:11px">招待状</span>
            <b class="num ${open?'gold':''}" style="font-size:11.5px">${
              open?'受け取り済み':`G1 ${g1w} / ${SG_NEED_G1}勝`}</b>
          </div>
          <span class="gauge"><i style="width:${clamp(g1w/SG_NEED_G1*100,0,100)}%;background:${
            open?'var(--gold)':'linear-gradient(90deg,#2f9a63,#6ff0a0)'}"></i></span>
          <div class="sep"></div>
          ${SG_RACES.filter(r=>r.theme!=='legend').sort((a,b)=>a.w-b.w).map(r=>{
            const found=(G.sgFound||[]).indexOf(r.n)>=0, done=wonRace(h,r.n);
            return `<div class="row between" style="font-size:11.5px;padding:3px 0">
              <span><span class="pill jo" style="margin-right:5px">${seasonOf(r.w)}</span>
                ${open||found?`<b style="color:${r.ink}">${esc(r.n)}</b>`
                  :'<span style="color:var(--ink-3)">？？？</span>'}</span>
              <span class="dot" style="font-size:10px;color:${done?'var(--gold)':'var(--ink-3)'}">${
                done?'制覇':(open?`第${r.w}週`:'未招待')}</span>
            </div>`;
          }).join('')}
          ${(()=>{                                   // 最後の一戦は四季を全部勝ってから見える
            const lg=SG_RACES.find(r=>r.theme==='legend'), n=tourWon(h);
            if(!open) return '';
            return `<div class="sep"></div>
              <div class="row between" style="font-size:11.5px;padding:2px 0">
                <span><span class="pill" style="margin-right:5px;background:#3a2c07;color:var(--gold)">最終</span>
                  ${legendReady(h)?`<b style="color:${lg.ink}">${esc(lg.n)}</b>`
                    :'<span style="color:var(--ink-3)">？？？</span>'}</span>
                <span class="dot" style="font-size:10px;color:${wonRace(h,lg.n)?'var(--gold)':'var(--ink-3)'}">${
                  wonRace(h,lg.n)?'制覇':(legendReady(h)?`第${lg.w}週`:`四季 ${n} / ${SG_TOUR.length}`)}</span>
              </div>`;
          })()}
        </div>`;
      })()}
      ${past?`<p class="eyebrow">歴代の愛馬</p>${past}`:''}
      <div class="sep"></div>
      <button class="btn center wide" data-act="save" style="margin-bottom:7px">セーブする</button>
      <button class="btn center wide" data-act="showcode" style="margin-bottom:7px">${G.pass?'合言葉を見る':'合言葉を発行する'}</button>
      <button class="btn danger center wide" data-act="reset">セーブデータを消す</button>`;
  },
  /* ---- 出走登録・馬券 ---- */
  bet(){

      </div>`).join('');

    return `<div class="row between"><p class="eyebrow" style="margin:0">${G.year}歳 ${dateLabel(G.week)}${sp?' / 観戦':''}</p>

      ${app.sgTheme?`<div class="card tight ${app.omen?'pop':''}" style="margin-bottom:9px;${
        app.omen?'border-color:var(--gold);background:#241d0b':''}">
        <div class="row between">
          <b style="font-size:12px;color:${app.sgTheme.ink}">${esc(app.sgTheme.logo)}</b>
          <span class="row" style="gap:4px"><span class="pill jo">${seasonOf(app.sgTheme.w)}</span>
            <span class="pill sg">SG</span></span>
        </div>
        <p class="muted" style="margin:5px 0 0;font-size:11px">${app.omen
          ? `<b class="gold">${esc(app.sgTheme.omen)}が見えている。今日はいける。</b>`

      <div class="card tight" style="margin-bottom:9px">
        <div class="row between" style="margin-bottom:5px">
          <b style="font-size:12.5px">${esc(r.c||'東京')}競馬場</b>

        </div>
        <div class="row between" style="font-size:11px">
          <span class="muted">直線</span><b class="num cyan">${courseOf(r).straight}m</b>
        </div>
        <div class="sep" style="margin:6px 0"></div>
        ${sp?'':`<div class="row between" style="font-size:11px">
          <span class="muted">1着賞金</span><b class="num gold">${yen(prizeOf(r))}</b>
        </div>
        <div class="sep" style="margin:6px 0"></div>`}
        <div class="row between" style="font-size:11px">
          <span class="muted">想定ペース</span><b>${app.sim.pace}</b>
        </div>
        ${(!sp&&packOf(G.horse)>0)?`<div class="sep" style="margin:6px 0"></div>
          <div class="row between" style="font-size:11px">
            <span class="muted">${packLabel(G.horse)}</span>
            <b class="hot">疲労が乗る・配当−${Math.round(packOf(G.horse)*35)}%</b>
          </div>`:''}
        ${(!sp&&r.g==='op'&&(G.horse.hcp||0)>0)?`<div class="sep" style="margin:6px 0"></div>
          <div class="row between" style="font-size:11px">
            <span class="muted">ハンデ</span><b class="hot">斤量+${G.horse.hcp}</b>
          </div>`:''}
      </div>
      <p class="eyebrow">馬券マークシート</p>
      <div class="card tight sheet">
        <div class="sheetrow">
          <span class="sheetlab">式別</span>

            ${[['win','単勝'],['plc','複勝']].map(([k,lb])=>`

                <i></i>${lb}</button>`).join('')}

          <span class="sheetlab">馬番</span>

              <button class="wcell c${h.num} ${sel===i?'on':''}" data-act="pickhorse" data-i="${i}">

              <small>${app.betType==='plc'?'複勝':'単勝'}</small>
