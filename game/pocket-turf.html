let view='title', viewData=null;
function show(v,d){
  view=v; viewData=d;
  const warn = app.saveFailed
    ? `<div class="card tight" style="border-color:#6b332e;background:#26160f;margin-bottom:9px">
        <b class="hot" style="font-size:12px">保存できていません</b>
        <p class="muted" style="margin:4px 0 0;font-size:11px">このブラウザがこのページのデータ保存を止めているため、
        ページを離れると進行が消えます。プライベートウィンドウを解除するか、別のブラウザでお試しください。</p>
      </div>` : '';
  panel.innerHTML = warn + (V[v] ? V[v](d) : '');
  panel.scrollTop=0;
  const inGame = ['home','horse','shop','record'].includes(v);
  tabs.hidden = !inGame;
  if(inGame){
    [...tabs.children].forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===v)));
    G.tab=v;
  }
  syncMeters();
}
function syncMeters(){
  $('#mMedal').textContent = G? yen(G.medals) : '0';
  $('#mDate').textContent  = G&&G.horse? `${G.year}歳 ${dateLabel(G.week)}` : '--';
}
function setHud(html){ hud.innerHTML=html; }
let toastTimer=null;
function toast(msg){
  const el=$('#toast'); if(!el) return;
  el.textContent=msg; el.hidden=false;
  requestAnimationFrame(()=>el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=>{ el.hidden=true; },260);
  },1500);
}
function say(txt, hot){
  if(REDUCE){ ticker.innerHTML=`<span class="${hot?'cur':''}">${esc(txt)}</span>`; return; }
  app.tickText=txt; app.tickIdx=0; app.tickHot=hot;
}
function tickerStep(){
  if(app.tickText==null) return;
  if(app.tickIdx<app.tickText.length){
    app.tickIdx+=1.6;
    const s=app.tickText.slice(0,Math.floor(app.tickIdx));
    ticker.innerHTML=`<span class="${app.tickHot?'cur':''}">${esc(s)}</span><span class="cur">▌</span>`;
  }else{
    ticker.innerHTML=`<span class="${app.tickHot?'cur':''}">${esc(app.tickText)}</span>`;
  }
}

/* =======================================================================
   8. ゲーム進行
   ======================================================================= */
function logLine(t){ G.log.unshift(t); G.log.length=Math.min(G.log.length,30); }

/* silent=true のときは画面を書き換えない（アルバイトでまとめて週を送る用） */
function advanceWeek(silent){
  const h=G.horse;
  h.fatigue=clamp(h.fatigue-2.5,0,100);
  h.cond=clamp(h.cond + (h.fatigue>70?-5:h.fatigue<25?4:1) + rint(-3,3), 5, 100);
  if(h.rest>0){ h.rest--; h.fatigue=clamp(h.fatigue-9,0,100); h.cond=clamp(h.cond+6,0,100); }
  G.week++;
  if(G.week>WEEKS_PER_YEAR){ G.week=1; G.year++; }
  if(G.year>5){ return retire(); }
  save();
  if(!silent){ show('home'); drawScene(); }
  return true;
}
/* まとめて週を送る。引退に達したら false（引退画面がすでに出ている）。 */
function advanceWeeks(n){
  for(let i=0;i<n;i++){ if(advanceWeek(true)===false) return false; }
  return true;
}
function doWork(i){
  const j=JOBS[i], h=G.horse;
  if(!j||!h) return;
  const ok = Math.random() < j.rate;
  const pay = ok ? j.win : j.lose;
  G.medals += pay;
  h.fatigue = clamp(h.fatigue-20,0,100);   // 馬は4週間ゆっくり休める
  logLine(`${j.k} +${pay}枚`);
  ok ? SFX.coin() : SFX.err();
  say(`${j.k}のアルバイト。${ok?j.okTxt:j.ngTxt} ${pay}枚。`, ok);
  if(advanceWeeks(WORK_WEEKS)===false) return;   // 途中で引退した
  save();
  show('workresult',{job:j, ok, pay});
  drawScene();
}

function doTrain(i){
  const h=G.horse, m=TRAIN[i];
  if(G.medals < m.cost){
    SFX.err(); toast(`${m.k}には${yen(m.cost)}メダル要る`);
    return;
  }
  G.medals -= m.cost;
  if(h.fatigue>82 && Math.random()<0.12){
    h.rest=rint(5,9); h.fatigue=clamp(h.fatigue-10,0,100);
    STAT_KEYS.forEach(([k])=>{ h[k]=Math.max(10,h[k]-rnd(3,1)); });
    SFX.err();
    logLine('故障');
    app.trainMenu=null;
    show('home');
    say(`${h.name}が脚元に不安を訴えた…… ${h.rest}週の休養へ。`, true);
    save(); drawScene();
    return;
  }
  /* 1年50週＝キャリア150ターン。1回あたりの上がり幅を小さくして、
     3年かけて伸びる曲線にする（係数を上げると1年目で頭打ちになる）。 */
  const cap=capOf(h,G.year), cm=COND_NAME[condIdx(h)].m;
  const gains=[];
  for(const [k,mul] of Object.entries(m.up)){
    const room=clamp(1-h[k]/cap,0.05,1);
    const g0 = mul*1.55*room*cm*rnd(1.35,.7);
    h[k]=Math.min(cap+2,h[k]+g0);
    gains.push([k,g0]);
  }
  h.fatigue=clamp(h.fatigue+m.f+rint(-1,2),0,100);
  h.cond=clamp(h.cond-(m.f>9?3:1)+rint(-2,3),5,100);
  app.trainMenu=m.k; app.trainT=0; app.scene='training';
  app.gains=gains;
  SFX.tap();
  const txt = gains.map(([k,v])=>`${STAT_KEYS.find(s=>s[0]===k)[1]}+${v.toFixed(1)}`).join('　');
  say(`${m.k}調教。${txt}`);
  // 週ターンは回数が多いので演出は短く。タップで即スキップできる。
  app.trainDone=()=>{ app.trainDone=null; app.scene='stable'; advanceWeek(); };
  setTimeout(()=>{ if(app.trainDone) app.trainDone(); }, REDUCE?60:750);
  panel.innerHTML=`<div class="center" style="padding:24px 8px">
    <p class="eyebrow">TRAINING</p><h2 class="big gold">${m.k}</h2>
    <p class="muted" style="margin-top:8px">${esc(txt)}</p>
    <p class="dot" style="margin-top:10px;font-size:10px;color:var(--ink-3)">タップでスキップ</p></div>`;
  tabs.hidden=true;
}
function buyItem(i){
  const it=ITEMS[i], h=G.horse;
  if(!h||!it) return;
  if(G.medals<it.p){ SFX.err(); toast('メダルが足りない'); return; }
  const lim=capOf(h,G.year)+ITEM_OVER;
  G.medals-=it.p;
  h.fatigue=clamp(h.fatigue-it.fat,0,100);
  h.cond=clamp(h.cond+it.cond,5,100);
  const ups=[];
  const bump=k=>{
    const before=h[k];
    h[k]=Math.min(lim,h[k]+it.up);
    if(h[k]-before>0.05) ups.push(`${STAT_KEYS.find(s=>s[0]===k)[1]}+${(h[k]-before).toFixed(1)}`);
  };
  if(it.mode==='all') STAT_KEYS.forEach(([k])=>bump(k));
  else if(it.mode==='random') bump(pick(STAT_KEYS)[0]);
  else bump(app.shopStat||'sp');
  SFX.coin();
  const msg = ups.length ? ups.join('　') : '能力はもう上限に届いている';
  toast(`${it.k}　${msg}`);
  say(`${h.name}に${it.k}。${msg}`);
  logLine(`${it.k}を使った`);
  save();
  show('shop');
}
function doRest(){
  const h=G.horse;
  h.fatigue=clamp(h.fatigue-28,0,100);
  h.cond=clamp(h.cond+12,5,100);
  SFX.ok();
  say(`${h.name}はゆっくりと休んだ。疲労が抜けていく。`);
  advanceWeek();
}

/* --- 出走 --- */
function openEntry(i){
  const rs=racesFor(G), r=rs[i];
  if(!r) return;
  app.race=r;
  app.field=makeField(G,r);
  app.odds=makeOdds(app.field, r, 1-packOf(G.horse)*0.35);
  app.bets=[]; app.betSel=null; app.betType='win';
  // 隠しレースなら舞台を決め、吉兆が現れるかをここで引く（パドックから見える）
  app.sgTheme = r.g==='SG' ? SG_RACES.find(x=>x.n===r.n) : null;
  app.omen = !!(app.sgTheme && Math.random()<OMEN_RATE);
  const meIdx=app.field.findIndex(h=>!h.npc);
  app.sim=new RaceSim(r,app.field,meIdx);
  app.scene='paddock';
  SFX.gate();
  say(`${r.n}。${r.s}${r.d}m、${app.field.length}頭立て。`);
  show('bet');
  drawScene();
}
function openWatch(){
  const r=pickWatchRace();
  app.race=r;
  app.field=makeWatchField(r);
  app.odds=makeOdds(app.field,r);
  app.bets=[]; app.betSel=null; app.betType='win'; app.spectate=true;
  app.sgTheme=null; app.omen=false;
  app.sim=new RaceSim(r,app.field,0);
  app.scene='paddock';
  SFX.gate();
  say(`${r.n}。${r.s}${r.d}m、${app.field.length}頭立て。馬券だけの勝負だ。`);
  show('bet');
  drawScene();
}
function finishWatch(){
  const sim=app.sim, r=app.race, res=sim.result;
  let pay=0, spent=0;
  for(const b of app.bets){
    spent+=b.amt;
    const fr=res.find(x=>x.h===app.field[b.i]);
    const o=app.odds[b.i];
    if(b.type==='win' && fr.pos===1) pay+=Math.round(b.amt*o.win);
    if(b.type==='plc' && fr.pos<=3)  pay+=Math.round(b.amt*o.plc);
  }
  G.medals+=pay;
  const hit=pay>0;
  hit?SFX.win():SFX.lose();
  G.history.push({y:G.year,w:G.week,n:r.n+'（観戦）',pos:0,gain:pay-spent});
  logLine(`${r.n} 観戦 ${pay-spent>=0?'+':''}${pay-spent}枚`);
  app.scene='podium'; app.podRes=res; app.podPos=hit?1:4; app.podT=0;
  tmap.hidden=true;
  say(hit?`的中！ 払戻は${yen(pay)}枚。`:`外れ。馬券は紙切れになった。`, hit);
  show('result',{res, race:r, spectate:true, pay, spent, net:pay-spent, mePos:0, prize:0, up:null});
  save();
}
function placeBet(type,amt){
  if(app.betSel==null || G.medals<amt) { SFX.err(); return; }
  G.medals-=amt;
  app.bets.push({i:app.betSel,type,amt});
  SFX.coin();
  show('bet');
}
/* 位置表示板の下地。コーナー区間・直線・坂の位置をコース特性から描く。 */
function buildMapBase(sim){
  const ss=sim.sStart*100, cs=sim.cStart*100;
  let h='';
  h+=`<span class="corner" style="left:12%;width:${Math.max(0,ss-12)}%"></span>`;
  h+=`<span class="corner last" style="left:${cs}%;width:${Math.max(0,ss-cs)}%"></span>`;
  h+=`<span class="straightz" style="left:${ss}%;width:${100-ss}%"></span>`;
  if(sim.course.slope>=0.7) h+=`<span class="hill" style="left:${(1-200/sim.D)*100}%"></span>`;
  h+='<span class="rail"></span><span class="goal"></span>';
  return h;
}
function startRace(){
  app.scene='race'; app.raceT=0; app.speed=1; evIdx=0;
  if(app.spectate){
    // 観戦では「いちばん賭けた馬」、賭けていなければ1番人気をカメラが追う
    const bet={};
    app.bets.forEach(b=>{ bet[b.i]=(bet[b.i]||0)+b.amt; });
    let idx=Object.keys(bet).sort((a,b)=>bet[b]-bet[a])[0];
    if(idx===undefined) idx=app.odds.reduce((m,o,i)=>o.win<app.odds[m].win?i:m,0);
    app.sim.me=app.sim.run[+idx];
  }
  app.sim.me.whip=3;
  if(app.omen && !app.spectate){        // 吉兆は演出だけでなく実際に効く
    app.sim.me.cap   *= 1.030;
    app.sim.me.stFac *= 1.25;
  }
  app.mapBase=buildMapBase(app.sim);
  tmap.hidden=false;
  SFX.gate();
  show('race');
  tabs.hidden=true;
}
function finishRace(){
  const sim=app.sim, r=app.race, h=G.horse;
  const res=sim.result, me=res.find(x=>!x.h.npc);
  const prizeTable=[1,.40,.25,.15,.10,0,0,0];
  const prize=Math.round(prizeOf(r)*(prizeTable[me.pos-1]||0));
  let pay=0, spent=0;
  for(const b of app.bets){
    spent+=b.amt;
    const fr=res.find(x=>x.h===app.field[b.i]);
    const o=app.odds[b.i];
    if(b.type==='win' && fr.pos===1) pay+=Math.round(b.amt*o.win);
    if(b.type==='plc' && fr.pos<=3)  pay+=Math.round(b.amt*o.plc);
  }
  G.medals+=prize+pay;
  h.races++; h.earned+=prize;
  const pack=packOf(h);
  h.fatigue=clamp(h.fatigue + rint(20,26)*(GRADE_FAT[r.g]||1)*(1+pack*0.9), 0, 100);
  h.cond=clamp(h.cond-rint(4,12)-Math.round(pack*10),5,100);
  h.lastRace=absWeek();
  h.fans+=Math.round(prize/12 + (me.pos===1?400:0));
  let up=null, unlocked=[];
  if(me.pos===1){
    const openBefore=sgOpen(h);        // 勝つ前に開いていた隠しレース
    h.wins++;
    h.won=h.won||{}; h.won[r.n]=true;
    // ダービーを無敗で勝ったか（この勝利まで全戦全勝）
    if(r.n==='日本ダービー' && h.races===h.wins) h.derbyUnbeaten=true;
    if(r.g==='jo' && h.cls<4){ h.cls++; up=`${CLASS_NAME[h.cls]}に昇級した！`; }
    if(r.g==='op'){ h.hcp=(h.hcp||0)+1; up=up||`ハンデが重くなった（斤量+${h.hcp}）`; }
    if(r.g!=='jo' && r.g!=='op') h.g1++;
    if(r.g==='G1'||r.g==='SG') h.g1w=(h.g1w||0)+1;   // 招待状はG1勝利数で数える
    if(r.g==='SG') h.sg=(h.sg||0)+1;
    unlocked=sgOpen(h).filter(n=>openBefore.indexOf(n)<0);
    if(r.g==='SG'){                                   // 制覇したカップを記録に残す
      G.sgFound=G.sgFound||[];
      if(G.sgFound.indexOf(r.n)<0) G.sgFound.push(r.n);
    }
    SFX.win();
  }else if(me.pos<=3) SFX.ok(); else SFX.lose();
  G.history.push({y:G.year,w:G.week,n:r.n,pos:me.pos,gain:prize+pay-spent});
  logLine(`${r.n} ${me.pos}着`);
  app.scene='podium'; app.podT=0; app.podRes=res; app.podPos=me.pos;
  tmap.hidden=true;
  say(unlocked.length ? `${r.n}制覇！ 招待状が届いた——${unlocked[0]}。`
      : me.pos===1 ? `${h.name}、${r.n}制覇！` : `${h.name}は${me.pos}着でゴール。`, me.pos===1);
  show('result',{res,race:r,mePos:me.pos,prize,pay,spent,net:prize+pay-spent,up,unlocked});
  save();
}
function retire(){
  const h=G.horse;
  const score = h.wins*10 + h.g1*45 + (h.sg||0)*80 + h.earned/2600 + G.medals/5200;
  const rank = score>=150?'S' : score>=100?'A' : score>=62?'B' : score>=30?'C' : 'D';
  const comment = ({
    S:'ターフの歴史に名を刻む名馬となった。',
    A:'幾多の強敵を退けた、記憶に残る一頭。',
    B:'堅実に走り続けた愛すべき相棒。',
    C:'大成はしなかったが、確かに走り抜いた。',
    D:'結果は出なかった。次の馬に託そう。'
  })[rank];
  const legacy = {S:12,A:8,B:5,C:3,D:1}[rank];
  G.careers.push({name:h.name,races:h.races,wins:h.wins,g1:h.g1,earned:h.earned,rank});
  G.legacy = legacy;
  app.scene='podium'; app.podRes=[{h}]; app.podPos= rank==='S'?1:4; app.podT=0;
  SFX.win();
  say(`${h.name}、引退。総合評価 ${rank}。`, true);
  show('end',{name:h.name,rank,comment,races:h.races,wins:h.wins,g1:h.g1,earned:h.earned,legacy});
  tabs.hidden=true;
  /* 世代交代の状態はここで確定させる（引退画面の内容は上の d から描画済み）。
     こうしないと「6歳・引退済みの馬」がセーブに残ってしまう。 */
  G.horse=null; G.history=[]; G.year=3; G.week=1; G.cands=null; G.tab='home';
  syncMeters();
  save();
  return false;
}

const ACT = {
  newgame(){ G=blank(); SFX.boot(); SFX.tap(); show('pick'); app.scene='stable'; },
  loadscreen(){ SFX.tap(); show('loadscreen'); },
  async loadpass(){
    const p=normPass(['#p1','#p2','#p3'].map(s=>{const e=$(s);return e?e.value:'';}).join(''));
    if(!validPass(p)){ SFX.err(); toast('合言葉は12文字のひらがな'); return; }
    toast('合言葉をさがしています…');
    const data=await passGet(p);
    if(!validSave(data)){ SFX.err(); toast('その合言葉のデータが見つからない'); return; }
    G=data; G.pass=p; SFX.boot(); SFX.ok(); save();
    toast('データをよびだした');
    enterGame();
  },
  showcode(){ SFX.tap(); show('passcode'); },
  backrecord(){ SFX.tap(); show('record'); },
  async newpass(){
    const p=newPass();
    G.pass=p; save();
    const cloud=await passPut(p,G);
    SFX.coin();
    toast(cloud?'合言葉を発行した':'この端末に記録した');
    show('passcode');
  },
  async syncpass(){
    if(!G.pass){ return ACT.newpass(); }
    const cloud=await passPut(G.pass,G);
    SFX.coin();
    toast(cloud?'合言葉に記録した':'この端末に記録した');
    show('passcode');
  },
  copypass(){
    const p=G.pass; if(!p) return;
    const done=()=>{ SFX.coin(); toast('コピーした'); };
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(p).then(done,()=>{ toast('画面の文字を長押しでコピーしてください'); });
    }else{ toast('画面の文字を長押しでコピーしてください'); }
  },
  continue(){ const s=load(); if(!s){SFX.err();return;} G=s; SFX.boot(); SFX.ok();
    if(!G.horse){ show('pick'); } else { app.scene='stable'; show(G.tab||'home'); }
    drawScene(); },
  help(){ SFX.tap(); show('help'); },
  back(){ SFX.tap(); show('title'); },
  choose(d){ G.pickIdx=+d.i; SFX.tap(); show('name'); },
  reroll(){ const h=G.cands[G.pickIdx]; h.name=horseName(); SFX.tap(); show('name'); },
  register(){
    const v=$('#nm'); const nm=(v&&v.value.trim())||G.cands[G.pickIdx].name;
    G.horse=G.cands[G.pickIdx];
    G.horse.name=nm.slice(0,9);
    G.horse.legacy=G.legacy||0;
    G.cands=null; G.pickIdx=null;
    app.scene='stable';
    SFX.ok();
    say(`${G.horse.name}が厩舎にやってきた。デビューを目指そう。`);
    show('home'); save(); drawScene();
  },
  save(){
    save(); SFX.coin();
    if(G.pass){ passPut(G.pass,G); toast('セーブして合言葉に記録した'); }
    else toast('セーブしました');
  },
  work(){ SFX.tap(); show('work'); },
  dojob(d){ doWork(+d.i); },
  backhome(){ SFX.tap(); show('home'); },
  buy(d){ buyItem(+d.i); },
  pickstat(d){ app.shopStat=d.k; SFX.tap(); show('shop'); },
  train(d){ doTrain(+d.i); },
  rest(){ doRest(); },
  advance(){ SFX.tap(); advanceWeek(); },
  entry(d){ openEntry(+d.i); },
  pickhorse(d){ app.betSel=+d.i; SFX.tap(); show('bet'); },
  picktype(d){ app.betType=d.t; SFX.tap(); show('bet'); },
  bet(d){ placeBet(d.t,+d.a); },
  clearbet(){ for(const b of app.bets) G.medals+=b.amt; app.bets=[]; SFX.tap(); show('bet'); },
  cancelrace(){ app.scene='stable'; app.sim=null; app.spectate=false; app.sgTheme=null; app.omen=false;
    for(const b of app.bets) G.medals+=b.amt; app.bets=[];
    tmap.hidden=true; SFX.tap(); show('home'); drawScene(); },
  watch(){ openWatch(); },
  startrace(){ startRace(); },
  spurt(){ const s=app.sim; if(!s||s.done) return; s.me.spurt=!s.me.spurt;
    const b=$('#spurBtn'); if(b){ b.classList.toggle('on',s.me.spurt); b.firstChild.textContent=s.me.spurt?'全力！':'追い出す'; }
    SFX.tap(); },
  whip(){ const s=app.sim; if(!s||s.done||s.me.whip<=0) return;
    s.me.whip--; s.me.whipT=2.2; SFX.whip();
    const p=$('#whipPips'); if(p) p.textContent='●●●'.slice(0,s.me.whip)+'○○○'.slice(0,3-s.me.whip);
    if(s.me.stam<0.12) s.events.push({t:s.t,txt:'反応がない！もう脚がない！',hot:true}); },
  speed(){ app.speed = app.speed===1?2:app.speed===2?4:1;
    const b=$('#spdBtn'); if(b) b.textContent='×'+app.speed; SFX.tap(); },
  /* スキップ＝スタートを見せたあとコーナーを飛ばして直線から中継を再開する。
     すでに直線に入っていれば、そのまま結果まで送る。 */
  skip(){
    const s=app.sim; if(!s||s.done) return;
    if(s.leader && s.leader.x >= s.D*s.sStart){ s.skipToEnd(); (app.spectate?finishWatch:finishRace)(); return; }
    s.skipTo(s.sStart);
    evIdx=Math.max(0,s.events.length-1);      // 飛ばした区間の実況は流さない
    SFX.gate();
    const b=$('#skipBtn'); if(b) b.textContent='結果へ';
    if(s.done) (app.spectate?finishWatch:finishRace)();
  },
  afterrace(){ app.scene='stable'; app.sim=null; app.spectate=false; app.sgTheme=null; app.omen=false;
    SFX.tap(); advanceWeek(); },
  nextgen(){ app.scene='stable'; SFX.tap(); show('pick'); save(); },
  reset(){ if(!confirm('セーブデータを消して最初からやり直す？')) return; wipe(); G=blank(); app.scene='title'; tmap.hidden=true; show('title'); }
};

});
$('.top').addEventListener('click',()=>{ if(app.trainDone) app.trainDone(); });
/* 合言葉の入力：かなだけ残し、4文字で次の欄へ送る。12文字まとめ貼りにも対応。 */
panel.addEventListener('input',e=>{
  const el=e.target;
  if(!el.classList||!el.classList.contains('pw')) return;
  const boxes=['#p1','#p2','#p3'].map(s=>$(s));
  if(boxes.some(b=>!b)) return;
  const v=normPass(el.value);
  if(v.length>4){
    const all=v.slice(0,PASS_LEN), gr=passGroups(all);
    boxes[0].value=gr[0]; boxes[1].value=gr[1]; boxes[2].value=gr[2];
    const last=Math.min(2,Math.max(0,Math.ceil(all.length/4)-1));
    boxes[last].focus();
    return;
  }
  el.value=v.slice(0,4);
  const i=boxes.indexOf(el);
  if(v.length>=4 && i>=0 && i<2){
    if(v.length>4 && boxes[i+1].value.length<4) boxes[i+1].value=normPass(v.slice(4)+boxes[i+1].value).slice(0,4);
    boxes[i+1].focus();
  }
});
tabs.addEventListener('click',e=>{
  const b=e.target.closest('[data-tab]'); if(!b) return;
  SFX.tap(); show(b.dataset.tab);
});
$('#mute').addEventListener('click',e=>{
  SFX.on=!SFX.on;
  e.currentTarget.setAttribute('aria-pressed',String(SFX.on));
  e.currentTarget.textContent = SFX.on?'♪':'✕';
});
addEventListener('keydown',e=>{
  if(app.scene!=='race') return;
  if(e.code==='Space'){ e.preventDefault(); ACT.spurt(); }
  if(e.code==='KeyW'){ ACT.whip(); }
});

/* =======================================================================
   10. メインループ
   ======================================================================= */
let last=performance.now(), evIdx=0;
/* 描画ループは常時1本だけ回る。drawScene() は画面遷移直後の即時反映用。 */
function drawScene(){ render(performance.now(), 0); }
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  render(now,dt);
  tickerStep();
  requestAnimationFrame(loop);
}

function render(now, dt){
  const r=cv.getBoundingClientRect();
  if(Math.round(r.width)!==W || Math.round(r.height)!==H) resize();
  g.clearRect(0,0,W,H);

  /* 愛馬が未登録のシーン（タイトル・馬選び）はデモ走行を映す */
  const needsHorse = ['stable','training'].includes(app.scene);
  if(!G || app.scene==='title' || (needsHorse && !G.horse)){
    drawBack(now*0.004,'芝'); drawTrack(now*0.0015,'芝',99999);
    const s=Math.min(W*0.19,H*0.29);
    drawHorse(W*0.30+((now/26)%(W*1.5))-W*0.2,H*0.80,s,0,2,0,now/90,true,true);
    setHud(`<span class="chip gold">POCKET TURF</span><span class="chip">ARCADE MODE</span>`);
  }
  else if(app.scene==='stable'){
    drawStable(G.horse,now);
    const h=G.horse;
    setHud(`<span class="chip gold">${G.year}歳 ${dateLabel(G.week)}</span>
      <span class="chip">${esc(h.name)}</span>
      <span class="chip">${CLASS_NAME[h.cls]} <b>${h.wins}勝</b></span>`);
  }
  else if(app.scene==='training'){
    app.trainT+=dt;
    drawTraining(G.horse,app.trainMenu,now,app.trainT/1.4);
    setHud(`<span class="chip gold">${esc(app.trainMenu)}調教</span>`);
    if(app.gains){
      g.font='11px "DotGothic16",monospace'; g.textAlign='left';
      app.gains.forEach(([k,v],i)=>{
        const a=clamp(app.trainT*2,0,1);
        g.globalAlpha=clamp(1.6-app.trainT,0,1);
        g.fillStyle='#f4c44a';
        g.fillText(`+${v.toFixed(1)} ${STAT_KEYS.find(s=>s[0]===k)[1]}`, W*0.58, H*0.30+i*15-a*10);
      });
      g.globalAlpha=1;
    }
  }
  else if(app.scene==='paddock'){
    drawBack(now*0.002,app.race.s,app.sgTheme,app.omen); drawTrack(0,app.race.s,99999);
    const sel=app.betSel;
    if(sel!=null && app.field[sel]){
      // 馬を選んだら、その1頭を枠色の勝負服つきで大きく見せる
      const h=app.field[sel];
      const s=Math.min(W*0.25,H*0.35);
      drawHorse(W*0.62,H*0.76,s,h.coat,h.num-1,h.num,Math.sin(now/620)*0.16,false,true);
      drawNamePlate(h, app.odds&&app.odds[sel]);
      setHud(`<span class="chip gold">${esc(app.race.n)}</span>
        <span class="chip">${app.race.s}${app.race.d}m</span>`);
    }else{
      const n=app.field.length;
      for(let i=0;i<n;i++){
        const h=app.field[i];
        const s=Math.min(W*0.10,H*0.15);
        const x=W*(0.15+(i%4)*0.235) + Math.sin(now/1400+i)*4;
        const y=H*(0.56+Math.floor(i/4)*0.235);
        drawHorse(x,y,s,h.coat,h.num-1,h.num,now/900+i,false,true);
      }
      setHud(`<span class="chip gold">${esc(app.race.n)}</span>
        <span class="chip">${app.race.s}${app.race.d}m ${app.sim.pace}想定</span>`);
    }
  }
  else if(app.scene==='race'){
    const sim=app.sim;
    if(!sim.done && dt>0){
      const SD=1/60;
      const steps=clamp(Math.round(dt/SD*app.speed),1,16);
      for(let i=0;i<steps && !sim.done;i++) sim.step(SD);
    }
    const me=sim.me, D=sim.D;
    const camX=clamp(me.x-16, 0, D+20);
    drawBack(camX,app.race.s,app.sgTheme,app.omen);
    drawTrack(camX,app.race.s,D,sim.bendAt(me.x));
    drawField(sim,camX);
    const rem=Math.max(0,Math.round((D-me.x)/10)*10);
    const sec=sim.sectionOf(me.x);
    setHud(`<span class="chip">${esc(app.race.c||'東京')} <b>${sec}</b></span>
      <span class="chip">残り <b>${rem}</b>m</span>
      <span class="chip gold">${me.rank}<b>位</b></span>`);
    // 位置表示板と隊列は毎フレーム書き換えると重いので間引く
    app.uiT=(app.uiT||0)+dt;
    if(app.uiT>0.12 && sim.order){
      app.uiT=0;
      tmap.innerHTML=app.mapBase+
        sim.run.map(r=>`<i class="${r===sim.me?'me':''}" style="left:${clamp(r.x/D*100,0,100)}%;background:${WAKU[r.h.num-1]}"></i>`).join('');
      const ll=$('#liveList'), lead=sim.order[0];
      if(ll) ll.innerHTML=sim.order.map(r=>{
        const back=Math.max(0,lead.x-r.x);
        return `<div class="lv ${r===sim.me?'me':''}">
          <span class="p">${r.rank}</span>
          <span class="u" style="background:${WAKU[r.h.num-1]};color:${wakuInk(r.h.num)}">${r.h.num}</span>
          <span class="n">${esc(r.h.name)}</span>
          <span class="d">${r.fin?'ゴール':back<0.5?'先頭':'-'+back.toFixed(1)+'m'}</span>
        </div>`;
      }).join('');
    }
    // 実況
    while(evIdx<sim.events.length){ const e=sim.events[evIdx++]; say(e.txt,e.hot); }
    // 操作卓の同期
    const bar=$('#stamBar');
    if(bar){
      const v=clamp(me.stam,0,1)*100;
      bar.style.width=v+'%';
      bar.style.background = v>45?'linear-gradient(90deg,#5fd8e8,#63d98d)' : v>18?'linear-gradient(90deg,#f4c44a,#e8802e)':'#ff6b4a';
    }
    const pl=$('#posLbl');
    if(pl) pl.textContent=`${me.rank}番手・残り${rem}m`;
    if(sim.done){ setTimeout(app.spectate?finishWatch:finishRace, 500); app.scene='wait'; }
  }
  else if(app.scene==='podium'){
    app.podT=(app.podT||0)+dt*1000;
    drawPodium(app.field,app.podRes,app.podPos,now);
    setHud(`<span class="chip gold">RESULT</span>`);
  }
  else if(app.scene==='wait'){
    // フィニッシュ演出の余韻（最後のフレームを保持）
    const sim=app.sim;
    if(sim){
      const camX=clamp(sim.me.x-16,0,sim.D+20);
      drawBack(camX,app.race.s,app.sgTheme,app.omen); drawTrack(camX,app.race.s,sim.D,0);
      drawField(sim,camX);
    }
    setHud(`<span class="chip gold">GOAL!</span>`);
  }
}

/* ページを離れる瞬間にも書き出す。タブを閉じる・アプリを切り替える・
   スマホで別画面へ移る、のいずれでも直前の状態が残るようにする。
   愛馬がいるときだけ書くので、タイトル画面を閉じても既存データは壊れない。 */
function autoSave(){ if(G && G.horse) save(); }
addEventListener('pagehide', autoSave);
addEventListener('beforeunload', autoSave);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') autoSave(); });

function boot(){
  resize();
  G = blank();
  show('title');
  say('ようこそ、ポケットターフへ。');
  requestAnimationFrame(t=>{ last=t; loop(t); });
}

                      JOCKEY, JOCKEY_INT, INTL_COURSES,
                      get state(){ return G; } };

}
