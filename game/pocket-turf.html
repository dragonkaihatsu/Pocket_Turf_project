<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポケットターフ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&display=swap">
<style>
/* ===========================================================
   ポケットターフ — 単一ビジュアル世界（夜のアーケード筐体）に
   コミットした設計。テーマ切替はせず、全色を明示的に塗る。
   =========================================================== */
:root{
  --shell:#191b21;      /* 筐体ボディ（青みを帯びたニュートラル） */
  --shell-2:#232733;
  --shell-edge:#0a0b0e;
  --hinge:#101219;
  --screen:#08130e;     /* 上画面：夜の芝 */
  --panel:#0b0f16;      /* 下画面：タッチパネル */
  --panel-2:#131926;
  --panel-3:#1b2434;
  --line:#27303f;
  --ink:#e9ecf1;
  --ink-2:#95a2b5;
  --ink-3:#5f6c80;
  --gold:#f4c44a;       /* メダル金＝主役アクセント */
  --gold-2:#a87f1c;
  --cyan:#5fd8e8;       /* LEDオッズ盤 */
  --turf:#3a9d5d;
  --turf-2:#1b5432;
  --dirt:#a8794a;
  --hot:#ff6b4a;
  --ok:#63d98d;
  --w1:#f2f2f2; --w2:#1c1c1c; --w3:#e0334a; --w4:#2b6fd6;
  --w5:#e8c72e; --w6:#2e9b57; --w7:#e8802e; --w8:#ef8fb0;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(120% 80% at 50% 0%, #1b2030 0%, #0a0c12 55%, #05070a 100%);
  color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow:hidden;
  touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- 筐体 ---------- */
.console{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  max-width:480px; margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 8px);
  gap:6px;
}
.bezel{
  border-radius:14px;
  background:linear-gradient(#20242e,#14171e);
  border:1px solid #2c313d;
  box-shadow:0 1px 0 #3a4150 inset, 0 -1px 0 #0a0c11 inset, 0 6px 18px rgba(0,0,0,.5);
  padding:7px;
}

/* ---------- 上画面 ---------- */
.top{
  flex:0 0 auto;
  position:relative;
  aspect-ratio:4/3;
  max-height:44dvh;
  min-height:170px;
}
.top .glass{
  position:relative; height:100%; width:100%;
  border-radius:8px; overflow:hidden;
  background:var(--screen);
  box-shadow:0 0 0 1px #000 inset, 0 0 22px rgba(90,220,255,.06) inset;
}
#cv{display:block;width:100%;height:100%}
.crt{
  position:absolute; inset:0; pointer-events:none;
  background:
    repeating-linear-gradient(180deg, rgba(0,0,0,.20) 0 1px, rgba(0,0,0,0) 1px 3px),
    radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
  mix-blend-mode:multiply;
}
.hud{
  position:absolute; left:0; right:0; top:0;
  display:flex; justify-content:space-between; align-items:flex-start; gap:6px;
  padding:6px 7px; pointer-events:none;
}
.hud .chip{
  font-family:"DotGothic16",monospace;
  font-size:11px; letter-spacing:.04em;
  background:rgba(4,10,8,.72); border:1px solid rgba(95,216,232,.35);
  color:var(--cyan); padding:2px 6px; border-radius:3px; white-space:nowrap;
}
.hud .chip b{color:#fff;font-weight:400}
.hud .chip.gold{border-color:rgba(244,196,74,.45);color:var(--gold)}
.ticker{
  position:absolute; left:0; right:0; bottom:0;
  font-family:"DotGothic16",monospace; font-size:12px; line-height:1.5;
  padding:5px 8px calc(5px + 2px);
  color:#d8ffe6; background:linear-gradient(rgba(3,10,7,0), rgba(3,10,7,.88) 40%);
  min-height:34px; pointer-events:none;
}
.ticker .cur{color:var(--gold)}
/* 全体マップ */
/* 全体マップ＝アーケードの位置表示板 */
.trackmap{
  position:absolute; left:7px; right:7px; top:31px; height:15px;
  pointer-events:none; border-radius:3px;
  background:rgba(3,9,7,.66); border:1px solid rgba(95,216,232,.22);
  padding:0 5px;
}
.trackmap .rail{
  position:absolute; left:5px; right:5px; top:6px; height:2px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 5px,transparent 5px 10px);
}
.trackmap .goal{position:absolute; top:2px; bottom:2px; width:2px; right:4px; background:var(--gold)}
/* コース構成：コーナー＝斜線、直線＝金の帯、坂＝▲ */
.trackmap .corner{
  position:absolute; top:2px; bottom:2px; border-radius:2px;
  background:repeating-linear-gradient(-50deg,rgba(255,255,255,.10) 0 2px,transparent 2px 5px);
}
.trackmap .corner.last{background:repeating-linear-gradient(-50deg,rgba(255,255,255,.20) 0 2px,transparent 2px 5px)}
.trackmap .straightz{position:absolute; top:2px; bottom:2px; background:rgba(244,196,74,.16); border-radius:2px}
.trackmap .hill{
  position:absolute; top:3px; width:0; height:0;
  border-left:4px solid transparent; border-right:4px solid transparent;
  border-bottom:7px solid rgba(255,107,74,.7);
}
.trackmap i{
  position:absolute; width:7px; height:7px; border-radius:50%; top:3px;
  transform:translateX(-50%); border:1px solid rgba(0,0,0,.6);
}
.trackmap i.me{width:9px;height:9px;top:2px;box-shadow:0 0 0 2px rgba(244,196,74,.9)}

/* レース中の隊列表示 */
.lv{
  display:flex; align-items:center; gap:6px; padding:2px 0; font-size:11px;
  font-family:"DotGothic16",monospace; font-variant-numeric:tabular-nums;
}
.lv .p{width:15px; text-align:right; color:var(--ink-3)}
.lv .u{
  width:15px;height:15px;border-radius:3px;display:grid;place-items:center;
  font-size:9px;flex:0 0 auto;border:1px solid rgba(0,0,0,.55);
}
.lv .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.lv .d{color:var(--cyan)}
.lv.me .n{color:var(--gold);font-weight:700}
.lv.me .p{color:var(--gold)}

/* ---------- ヒンジ ---------- */
.hinge{
  flex:0 0 auto;
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:0 10px; height:34px;
  border-radius:8px;
  background:linear-gradient(#171a22,#0e1016);
  border:1px solid #262b36;
  box-shadow:0 1px 0 #333a48 inset;
}
.logo{
  font-family:"Dela Gothic One",sans-serif;
  font-size:13px; letter-spacing:.02em;
  background:linear-gradient(#ffe9a8,#d9a52c);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.meters{display:flex;align-items:center;gap:9px;font-family:"DotGothic16",monospace;font-size:12px}
.meters .m{color:var(--ink-2)}
.meters .m b{color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}
.meters .medal b{color:var(--gold)}
.meters .medal::before{
  content:"◉"; color:var(--gold); margin-right:3px; font-size:11px;
}
.mute{font-size:14px;color:var(--ink-3);padding:2px 4px;line-height:1}
.mute[aria-pressed="true"]{color:var(--cyan)}

/* ---------- 下画面 ---------- */
.bot{flex:1 1 auto; min-height:0; display:flex}
.bot .glass{
  flex:1; min-height:0; display:flex; flex-direction:column; position:relative;
  border-radius:8px; overflow:hidden;
  background:var(--panel);
  box-shadow:0 0 0 1px #000 inset;
}
.toast{
  position:absolute; left:50%; top:12px; z-index:5; max-width:86%; text-align:center;
  transform:translateX(-50%) translateY(-8px); opacity:0;
  background:#1d2431; border:1px solid var(--gold); color:var(--gold);
  padding:8px 16px; border-radius:99px; font-size:12px; font-weight:700;
  box-shadow:0 6px 20px rgba(0,0,0,.55); pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){ .toast{transform:translateX(-50%)} }
#panel{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px}
nav.tabs{
  flex:0 0 auto; display:flex; border-top:1px solid var(--line);
  background:var(--panel-2);
}
nav.tabs button{
  flex:1; padding:11px 4px 12px; font-size:12px; color:var(--ink-3);
  letter-spacing:.14em; font-weight:600;
  border-top:2px solid transparent;
}
nav.tabs button[aria-selected="true"]{color:var(--gold);border-top-color:var(--gold);background:#171e2b}
nav.tabs[hidden]{display:none}

/* ---------- パネル共通 ---------- */
h2.head{
  margin:0 0 8px; font-family:"Dela Gothic One",sans-serif;
  font-size:15px; letter-spacing:.01em; color:var(--ink); text-wrap:balance;
}
.eyebrow{
  font-family:"DotGothic16",monospace; font-size:10px; letter-spacing:.14em;
  color:var(--ink-3); text-transform:uppercase; margin:0 0 2px;
}
.card{
  background:var(--panel-2); border:1px solid var(--line); border-radius:9px;
  padding:10px; margin-bottom:9px;
}
.card.tight{padding:8px}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.muted{color:var(--ink-2);font-size:12px;line-height:1.6}
.dot{font-family:"DotGothic16",monospace;font-variant-numeric:tabular-nums}
.num{font-family:"DotGothic16",monospace;font-variant-numeric:tabular-nums}

.btn{
  display:flex;flex-direction:column;justify-content:center;gap:2px;
  min-height:46px; padding:8px 10px; border-radius:8px;
  background:linear-gradient(#212a3a,#18202c);
  border:1px solid #2f3b4f; color:var(--ink);
  font-size:13px; font-weight:600; text-align:left;
  transition:transform .06s ease, filter .12s ease;
}
.btn:active{transform:translateY(1px);filter:brightness(1.25)}
.btn small{font-weight:400;font-size:10.5px;color:var(--ink-2);letter-spacing:.02em}
.btn.center{align-items:center;text-align:center}
.btn.primary{
  background:linear-gradient(#f6cf5f,#d7a022); border-color:#f0d692; color:#2a1e02;
}
.btn.primary small{color:#5c4508}
.btn.ghost{background:#141b26;border-color:var(--line);color:var(--ink-2);font-weight:500}
.btn.danger{border-color:#5c2b28;color:#ff9f8b;background:#1c1416}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn.wide{width:100%}

/* ステータスバー */
.stat{display:grid;grid-template-columns:56px 1fr 30px;align-items:center;gap:7px;margin:5px 0}
.stat .lb{font-size:10.5px;color:var(--ink-2);white-space:nowrap}
.stat .bar{height:7px;border-radius:4px;background:#0e141d;overflow:hidden;box-shadow:0 0 0 1px #222c3a inset}
.stat .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#2e7fd4,#5fd8e8)}
.stat .vl{font-size:11px;text-align:right;color:var(--ink)}
.gauge{height:9px;border-radius:5px;background:#0e141d;overflow:hidden;box-shadow:0 0 0 1px #222c3a inset}
.gauge i{display:block;height:100%;transition:width .25s ease}

.pill{
  display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:99px;
  font-size:10.5px;font-weight:600;border:1px solid;
}
.pill.g1{color:#ffd76e;border-color:#7a5f16;background:#2a2208}
.pill.g2{color:#c9d6ff;border-color:#3c4a72;background:#151b2b}
.pill.g3{color:#bfe8d0;border-color:#2f5c44;background:#0f1f18}
.pill.op{color:#e3d6ff;border-color:#4b3f6b;background:#181428}
.pill.jo{color:var(--ink-2);border-color:var(--line);background:#141a24}
.pill.dirt{color:#e8c39a;border-color:#5b442d;background:#1d1610}
.pill.turf{color:#a6e3ba;border-color:#2c5c3d;background:#0f1d14}

/* 馬番の枠色 */
.uma{
  width:22px;height:22px;border-radius:4px;display:grid;place-items:center;
  font-family:"DotGothic16",monospace;font-size:12px;font-weight:400;flex:0 0 auto;
  border:1px solid rgba(0,0,0,.55);
}
.uma.c1{background:var(--w1);color:#111}
.uma.c2{background:var(--w2);color:#fff;border-color:#555}
.uma.c3{background:var(--w3);color:#fff}
.uma.c4{background:var(--w4);color:#fff}
.uma.c5{background:var(--w5);color:#1a1a1a}
.uma.c6{background:var(--w6);color:#fff}
.uma.c7{background:var(--w7);color:#1a1a1a}
.uma.c8{background:var(--w8);color:#3a1220}

/* 一覧行 */
.list{display:flex;flex-direction:column;gap:6px}
.entry{
  display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;
  background:var(--panel-2);border:1px solid var(--line);width:100%;text-align:left;
}
.entry .nm{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .od{font-family:"DotGothic16",monospace;font-size:12px;color:var(--cyan);font-variant-numeric:tabular-nums}
.entry[aria-pressed="true"]{border-color:var(--gold);background:#231d0d}
.entry.me .nm{color:var(--gold);font-weight:700}

table.res{width:100%;border-collapse:collapse;font-size:11.5px}
table.res th{
  font-family:"DotGothic16",monospace;font-weight:400;font-size:10px;color:var(--ink-3);
  text-align:left;padding:3px 4px;border-bottom:1px solid var(--line);letter-spacing:.08em;
}
table.res td{padding:5px 4px;border-bottom:1px solid #1a212c;font-variant-numeric:tabular-nums}
table.res tr.me td{background:#20190a;color:var(--gold)}
table.res td.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px}

/* レース操作卓 */
.deck{display:flex;flex-direction:column;gap:8px;height:100%}
.spur{
  flex:0 0 auto; height:clamp(84px,15dvh,124px); border-radius:12px;
  background:linear-gradient(#f6cf5f,#cf9a1e);
  color:#2a1e02; font-family:"Dela Gothic One",sans-serif; font-size:20px;
  display:grid;place-items:center;gap:2px; border:2px solid #ffe6a6;
  box-shadow:0 4px 0 #8c6712, 0 8px 18px rgba(244,196,74,.18);
}
.spur:active{transform:translateY(3px);box-shadow:0 1px 0 #8c6712}
.spur.on{background:linear-gradient(#ff8a63,#e04a22);border-color:#ffbca4;color:#2a0d04;box-shadow:0 4px 0 #8a2c14}
.spur small{display:block;font-family:inherit;font-size:10px;letter-spacing:.1em;opacity:.75}
.whip{
  flex:0 0 auto;min-height:52px;border-radius:10px;background:#232c3a;border:1px solid #3a475d;
  display:grid;place-items:center;font-size:14px;font-weight:700;
}
.whip:active{filter:brightness(1.3)}
.whip .pips{font-family:"DotGothic16",monospace;color:var(--gold);font-size:12px}

.log{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--ink-2);line-height:1.5}
.log .ln{padding-left:10px;border-left:2px solid var(--line)}
.log .ln.hot{border-left-color:var(--gold);color:var(--ink)}

input[type=text]{
  width:100%;padding:9px 10px;border-radius:8px;background:#0e141d;
  border:1px solid var(--line);color:var(--ink);font-size:15px;font-family:inherit;
}
label.fld{display:block;font-size:11px;color:var(--ink-2);margin:0 0 4px}

.center{text-align:center}
.big{font-family:"Dela Gothic One",sans-serif;font-size:26px;line-height:1.15;text-wrap:balance}
.rank{font-family:"Dela Gothic One",sans-serif;font-size:44px;line-height:1}
.gold{color:var(--gold)} .cyan{color:var(--cyan)} .hot{color:var(--hot)} .ok{color:var(--ok)}
.sep{height:1px;background:var(--line);margin:9px 0}
.pop{animation:pop .3s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>

<div class="console">
  <section class="bezel top" aria-label="上画面">
    <div class="glass">
      <canvas id="cv"></canvas>
      <div class="trackmap" id="tmap" hidden><div class="rail"></div><div class="goal"></div></div>
      <div class="hud" id="hud"></div>
      <div class="ticker" id="ticker" aria-live="polite"></div>
      <div class="crt"></div>
    </div>
  </section>

  <div class="hinge">
    <div class="logo">ポケットターフ</div>
    <div class="meters">
      <span class="m" id="mDate">--</span>
      <span class="m medal">残高<b id="mMedal">0</b></span>
      <button class="mute" id="mute" aria-pressed="true" aria-label="音を切り替える">♪</button>
    </div>
  </div>

  <section class="bezel bot" aria-label="下画面">
    <div class="glass">
      <div id="panel"></div>
      <div class="toast" id="toast" hidden></div>
      <nav class="tabs" id="tabs" hidden>
        <button data-tab="home" aria-selected="true">行動</button>
        <button data-tab="horse" aria-selected="false">愛馬</button>
        <button data-tab="shop" aria-selected="false">売店</button>
        <button data-tab="record" aria-selected="false">記録</button>
      </nav>
    </div>
  </section>
</div>

<script>
"use strict";
(function(){
/* =======================================================================
   0. 小道具
   ======================================================================= */
const $ = (s,r=document)=>r.querySelector(s);
const rnd  = (a=1,b=0)=>b+Math.random()*(a-b);
const rint = (a,b)=>Math.floor(a+Math.random()*(b-a+1));
const pick = a=>a[Math.floor(Math.random()*a.length)];
const clamp= (v,a,b)=>v<a?a:v>b?b:v;
const esc  = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yen  = n=>Math.round(n).toLocaleString('ja-JP');
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* 効果音（アセット無し・WebAudioのみ） */
const SFX = (()=>{
  let ctx=null, on=true;
  const boot=()=>{ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ on=false; } } if(ctx&&ctx.state==='suspended') ctx.resume(); };
  const tone=(f,d,type='square',v=.05,delay=0)=>{
    if(!on||!ctx) return;
    const t=ctx.currentTime+delay, o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.01);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+d+.02);
  };
  return {
    boot, get on(){return on}, set on(v){on=v; if(v) boot();},
    tap(){tone(880,.05,'square',.03)},
    ok(){tone(660,.07);tone(990,.09,'square',.05,.07)},
    err(){tone(160,.16,'sawtooth',.04)},
    coin(){tone(1180,.05);tone(1560,.09,'square',.05,.05)},
    gate(){tone(440,.06);tone(440,.06,'square',.05,.18);tone(880,.22,'square',.06,.36)},
    win(){[523,659,784,1046].forEach((f,i)=>tone(f,.28,'square',.06,i*.11))},
    lose(){[392,349,294].forEach((f,i)=>tone(f,.3,'triangle',.05,i*.13))},
    whip(){tone(220,.05,'sawtooth',.05);tone(1400,.04,'square',.03,.02)}
  };
})();

/* =======================================================================
   1. データ定義
   ======================================================================= */
const WAKU = ['#f2f2f2','#1c1c1c','#e0334a','#2b6fd6','#e8c72e','#2e9b57','#e8802e','#ef8fb0'];
/* 枠色の上に乗せる文字色（1・5・7・8枠は淡色なので黒文字） */
const wakuInk = n => [1,5,7,8].includes(n) ? '#161616' : '#ffffff';
const COATS = [
  {n:'鹿毛',   c:'#6b4326', m:'#432815'},
  {n:'黒鹿毛', c:'#4a2d1c', m:'#2b1a10'},
  {n:'栗毛',   c:'#a5673a', m:'#7d4a26'},
  {n:'芦毛',   c:'#b9b3ad', m:'#8d8781'},

/* 条件戦は毎月生成（クラスに応じて距離・馬場をローテーション） */
function condRaces(g){
  const h=g.horse, out=[];
  const dists = [1200,1400,1600,1800,2000,2200,2400];
  const seed = (g.year*13+g.week*7);
  const d1 = dists[(seed)%dists.length], d2 = dists[(seed+3)%dists.length];
  const surf = ((seed>>1)%3===0)?'ダート':'芝';
  // 開催場も月ごとに替える（同じ条件戦でもコース適性で結果が変わる）
  const c1 = COURSE_LIST[seed%COURSE_LIST.length];
  const c2 = COURSE_LIST[(seed+4)%COURSE_LIST.length];
  if(h.cls===0){
    if(h.races===0 && g.year===3 && g.week<=26)
      out.push({n:'新馬戦', w:g.week, d:d1, s:surf, g:'jo', cls:0, lv:0, c:c1});
    out.push({n:'未勝利戦', w:g.week, d:d2, s:'芝', g:'jo', cls:0, lv:0, c:c2});
    if(g.year>3){ out.length=0; out.push({n:'1勝クラス', w:g.week, d:d2, s:'芝', g:'jo', cls:0, lv:1, c:c2}); }
  }else if(h.cls<4){
    out.push({n:h.cls+'勝クラス', w:g.week, d:d1, s:'芝', g:'jo', cls:h.cls, lv:h.cls, c:c1});
    out.push({n:h.cls+'勝クラス', w:g.week, d:d2, s:surf, g:'jo', cls:h.cls, lv:h.cls, c:c2});
  }else{
    out.push({n:'オープン特別', w:g.week, d:d1, s:'芝', g:'op', cls:4, lv:4, c:c1});
  }
  return out;
}
function racesFor(g){
  const h=g.horse;
  const list = RACES.filter(r=> r.w===g.week && r.age.includes(g.year) && h.cls>=r.cls);
  // 条件戦は隔週開催。毎週使えると連闘し放題になり、調教する週がなくなる
  const cond = (g.week%2===1) ? condRaces(g) : [];
  return cond.concat(list);
}
const prizeOf = r => r.g==='jo' ? COND_PRIZE[clamp(r.lv||0,0,3)] : GRADE_PRIZE[r.g];
/* 次に出走できる週を先読みする（50週あるので目安がないと待ち方が分からない） */
function nextRaceInfo(){
  for(let k=1;k<=WEEKS_PER_YEAR*3;k++){
    const t=G.week+k-1;
    const week=t%WEEKS_PER_YEAR+1, year=G.year+Math.floor(t/WEEKS_PER_YEAR);
    if(year>5) return null;
    const rs=racesFor({horse:G.horse, year, week});
    if(rs.length){
      const top=rs.slice().sort((a,b)=>prizeOf(b)-prizeOf(a))[0];
      return {in:k, week, year, top};
    }
  }
  return null;
}

   2. 馬の生成
   ======================================================================= */
function newHorse(opt={}){
  const base = opt.base||36;
  const aptD = {};
  const cats=['短距離','マイル','中距離','長距離'];
  const core = rint(1,2); // 得意ゾーンの中心
  cats.forEach((c,i)=>{
    const dist=Math.abs(i-core);
    aptD[c] = APT_LET[clamp(dist + (Math.random()<.35?1:0) + (Math.random()<.15?-1:0),0,4)];
  });
  const turfFirst = Math.random()<.72;
  return {
    name: opt.name||horseName(),
    sex: pick(['牡','牡','牝']),
    coat: rint(0,COATS.length-1),
    style: pick(STYLES),
    growth: pick(GROWTH),
    jockey: pick(JOCKEY),
    sp: base+rint(-6,8), st: base+rint(-6,8), pw: base+rint(-6,8),
    gt: base+rint(-6,8), wt: base+rint(-6,8),
    aptTurf: turfFirst?pick(['S','A','A','B']):pick(['B','C','C','D']),
    aptDirt: turfFirst?pick(['B','C','C','D']):pick(['S','A','A','B']),
    aptD,
    fatigue:0, cond:70,
    cls:0, wins:0, races:0, g1:0, earned:0, fans:0, rest:0
  };
}
/* 成長型による年齢別キャップ */
function capOf(h, year){
  const t = h.growth==='早熟' ? [88,96,92] : h.growth==='晩成' ? [70,90,105] : [78,95,100];
  return t[clamp(year-3,0,2)] + (h.legacy||0);
}
function ratingOf(h, race){
  const c = COND_NAME[condIdx(h)].m;
  const apt = APT_MULT[race.s==='芝'?h.aptTurf:h.aptDirt] * APT_MULT[h.aptD[distCat(race.d)]];
  const long = race.d>=2200 ? 1 : race.d<=1400 ? 0 : .5;   // 距離が長いほどスタミナ比重
  const core = h.sp*(1-long*.28) + h.st*(.18+long*.30) + h.pw*.16 + h.gt*.16 + h.wt*.10;
  // コース特性：小回りは賢さ、急坂はパワーと根性が効く
  const cs = courseOf(race);
  const cAdj = 1 + (h.wt-50)/900*cs.curve + ((h.pw-50)/900 + (h.gt-50)/1500)*cs.slope;
  return core * apt * c * cAdj;
}

/* ライバル生成：クラスに応じた地力 */
function makeField(g, race){
  const lvl = race.g==='jo' ? 34+ (race.lv||0)*9 : ({op:70,G3:76,G2:82,G1:89})[race.g];
  const field=[];
  for(let i=0;i<7;i++){
    const b = clamp(lvl + rint(-9,9), 22, 108);
    const r = newHorse({base:b});
    r.cond = rint(45,92);
    r.fatigue = rint(0,25);
    r.npc = true;
    field.push(r);
  }
  field.push(g.horse);
  // シャッフルして馬番を割り当て
  for(let i=field.length-1;i>0;i--){const j=rint(0,i); [field[i],field[j]]=[field[j],field[i]];}
  field.forEach((h,i)=>{h.num=i+1;});
  return field;
}
/* オッズ算定 */
function makeOdds(field, race){
  const rs = field.map(h=>Math.pow(Math.max(6,ratingOf(h,race)),4.2));
  const sum = rs.reduce((a,b)=>a+b,0);
  return field.map((h,i)=>{
    const p = clamp(rs[i]/sum, .012, .82);
    const win = Math.max(1.1, Math.round(78/(p*100)*10)/10);
    const p3  = clamp(p*2.45, .03, .93);
    const plc = Math.max(1.0, Math.round(80/(p3*100)*10)/10);
    return {win, plc, p};
  });
}

const BASE_V = 16.0;
/* 距離が延びるほど平均速度は落ちる。実際の持久曲線（Riegel則 v∝d^-k）に合わせる。 */
const distFactor = d => 1.035*Math.pow(d/1200,-0.095);
class RaceSim{
  constructor(race, field, meIdx){
    this.race=race; this.D=race.d; this.t=0; this.done=false; this.events=[];
    this.meIdx=meIdx; this.fired={};
    const nige = field.filter(h=>h.style==='逃げ').length + field.filter(h=>h.style==='先行').length*.5;
    this.pace = nige>=3.5 ? 'ハイ' : nige<=1.5 ? 'スロー' : 'ミドル';
    const paceAdj = {'ハイ':1.03,'ミドル':1.0,'スロー':.975}[this.pace];
    const distF = this.distF = distFactor(race.d);
    /* コース特性をレース構造に落とし込む。
       直線が短いコースほど「追い比べの区間」が短く、後方からでは届かない。 */
    this.course   = courseOf(race);
    this.straight = Math.min(this.course.straight, race.d*0.5);
    this.sStart   = 1 - this.straight/race.d;              // 直線入口
    // 勝負所。長い距離ほど早く動き出す（直線だけでは差が詰まらないため）
    const goEarly = race.d>=2400 ? 0.30 : race.d>=2000 ? 0.25 : 0.20;
    this.cStart   = Math.max(0.28, this.sStart-goEarly);
    this.run = field.map((h,i)=>{
      const c = COND_NAME[condIdx(h)].m;
      const apt = APT_MULT[race.s==='芝'?h.aptTurf:h.aptDirt]*APT_MULT[h.aptD[distCat(race.d)]];
      /* 適性・調子は「最高速」にはわずかしか効かせない。効かせすぎると
         着差が十数秒になり競馬の時計にならないため、主に消耗（下の stFac）で効かせる。 */
      const aptV  = 1+(apt-1)*0.45;
      const condV = 1+(c-1)*0.55;
      return {
        h, i, x:0, v:0, stam:1, fin:0, rank:0, spurt:false, whip:0, whipT:0,
        trouble:0, phase:Math.random(),
        cap: BASE_V*(0.930+h.sp/900)*aptV*condV*distF*rnd(1.012,.988),
        accel: 0.9+h.pw/170,
        stFac: (0.52+h.st/115)*apt,   // 適性外の条件では脚が上がる
        guts: h.gt,
        style: h.style,
        // AIの仕掛けどころ（賢さで前後）
        goAt: clamp(({'逃げ':.62,'先行':.66,'差し':.71,'追込':.76}[h.style]) - h.wt/2200 + rnd(.03,-.03), .55, .84),
        paceAdj
      };
    });
    this.me = this.run[meIdx];
    this.last600 = new Map();
  }
  targetMul(r, prog){
    const s = r.style;
    /* 実際のレースは隊列が固まって進むので、序盤の差は小さく、
       決着は終い（フェーズ2〜3）でつける。ここを開きすぎると逃げ切りばかりになる。 */
    const tbl = {
      '逃げ':[1.045,.992,1.000,1.005],
      '先行':[1.025,.988,1.010,1.030],
      '差し':[0.980,.982,1.030,1.075],
      '追込':[0.955,.978,1.040,1.100]
    }[s];
    const idx = prog<.2?0 : prog<this.cStart?1 : prog<this.sStart?2 : 3;
    let m = tbl[idx];
    // ペース補正：ハイなら前が消耗、スローなら後方不利
    if(prog<this.cStart){
      if(this.pace==='ハイ' && (s==='逃げ'||s==='先行')) m*=1.022;
      if(this.pace==='スロー'&& (s==='差し'||s==='追込')) m*=0.985;
    }
    return m;
  }
  step(dt){
    if(this.done) return;
    this.t+=dt;
    const D=this.D;
    for(const r of this.run){
      if(r.fin) continue;
      const prog = r.x/D;
      let mul = this.targetMul(r, prog);
      // 仕掛け
      if(r===this.me){ if(r.spurt) mul*=1.075; }
      else if(prog>=r.goAt) mul*=1.06;
      if(r.whipT>0){ mul*=1.045; r.whipT-=dt; }
      if(r.trouble>0){ mul*=0.90; r.trouble-=dt; }
      // コーナー：小回りほど振られて減速し、賢さで軽減される
      if(prog>0.12 && prog<this.sStart){
        mul *= 1 - this.course.curve*0.030*(1 - r.h.wt/280);
        // 4コーナーで後方の馬は外を回らされる
        if(prog>this.cStart && (r.style==='追込'||r.style==='差し'))
          mul *= 1 - this.course.curve*0.028;
      }
      // ゴール前の坂：パワーと根性で駆け上がる
      if(D-r.x < 220)
        mul *= 1 - this.course.slope*0.060*(1 - r.h.pw/300 - r.h.gt/500);
      // 脚色：残りスタミナが細るほど連続的に失速する（根性で粘る）
      if(r.stam<0.30){
        const lack=clamp((0.30-r.stam)/0.30,0,1.2);
        mul *= 1 - lack*(0.140 - r.guts/1700);
      }
      let target = r.cap*mul;
      // ラスト100mは根性で粘る
      if(prog>.94) target *= 1 + r.guts/2400;
      r.v += clamp(target-r.v, -8*dt*4, r.accel*dt*4);
      r.x += r.v*dt;
      // 消耗（基準速度は距離補正込み）
      const ratio = r.v/(BASE_V*0.985*r.paceAdj*this.distF);
      let drain = dt*0.0069*Math.pow(Math.max(.55,ratio),5)/r.stFac;
      if(r===this.me && r.spurt) drain*=1.55;
      if(r.whipT>0) drain*=1.25;
      r.stam -= drain;
      // 上がり3F計測
      if(!this.last600.has(r.i) && r.x>=D-600) this.last600.set(r.i,this.t);
      // 不利（差し・追込にまれに発生）
      if(!r.troubleDone && prog>.45 && prog<.72 && (r.style==='差し'||r.style==='追込') && Math.random()<dt*0.045){
        r.troubleDone=true; r.trouble=1.4;
        this.events.push({t:this.t, txt:`${r.h.num}番 ${r.h.name} 前が壁だ！`, hot:r===this.me});
      }
      if(r.x>=D){
        r.fin = this.t - (r.x-D)/Math.max(1,r.v);
        r.last3 = this.last600.has(r.i) ? (r.fin - this.last600.get(r.i)) : null;
      }
      r.phase += r.v*dt*0.42;
    }
    // 順位
    const order=[...this.run].sort((a,b)=> (b.fin&&a.fin)? a.fin-b.fin : b.x-a.x);
    order.forEach((r,i)=>r.rank=i+1);
    this.order=order;
    this.leader=order[0];
    if(this.run.every(r=>r.fin)){ this.done=true; this.finish(); }
    this.emit();
  }
  emit(){
    const p = this.leader.x/this.D;
    const say=(k,txt,hot)=>{ if(!this.fired[k]){ this.fired[k]=1; this.events.push({t:this.t,txt,hot}); } };
    if(p>.02) say('s',`スタート！ ${this.pace}ペースの入り。`);
    if(p>.22) say('a',`先頭は${this.leader.h.num}番 ${this.leader.h.name}。`);
    if(p>.42 && p<this.cStart) say('b',`向正面、${this.me.rank}番手に${this.me.h.name}。`, true);
    if(p>this.cStart) say('c', this.course.curve>=0.8
      ? `3コーナー、小回りで隊列が一気に凝縮する！`
      : `3コーナーから隊列が動き出す！`);
    if(p>this.sStart) say('d',`4コーナーを回って直線へ！残り${Math.round(this.straight)}m！`);
    if(p>1-190/this.D && this.course.slope>=0.7) say('h',`最後の急坂だ！ここで脚が上がる！`, true);
    if(p>.90) say('e',`${this.order[0].h.name}先頭、${this.order[1].h.name}が並びかける！`);
    if(p>.97) say('f',`ゴール前、大接戦だ！`, true);
  }
  /* 現在地の区間名とコーナーの曲がり具合（描画とHUD用） */
  sectionOf(x){
    const p=x/this.D;
    if(p>=this.sStart) return '直線';
    if(p>=this.cStart) return '4角';
    if(p>=0.42) return '3角';
    if(p>=0.2)  return '向正面';
    return 'スタート';
  }
  bendAt(x){
    const p=x/this.D;
    if(p>=this.sStart || p<0.12) return 0;
    return this.course.curve*(p>=this.cStart?1:0.55);
  }
  finish(){
    const res=[...this.run].sort((a,b)=>a.fin-b.fin);
    res.forEach((r,i)=>{ r.pos=i+1; });
    for(let i=1;i<res.length;i++){
      const gap=(res[i].fin-res[i-1].fin)*res[i].v/2.4;
      res[i].margin = gap<0.05?'ハナ' : gap<0.2?'アタマ' : gap<0.45?'クビ' : gap<8? (Math.round(gap*4)/4)+'馬身' : '大差';
    }
    if(res[0]) res[0].margin='';
    this.result=res;
  }
  skipToEnd(){ let guard=0; while(!this.done && guard++<40000) this.step(1/30); }
  /* 先頭がその進捗に達するまで一気に進める（スキップ＝直線まで飛ばす用） */
  skipTo(frac){
    const target=this.D*frac; let guard=0;
    while(!this.done && guard++<40000){
      this.step(1/30);
      if(this.leader && this.leader.x>=target) break;
    }
  }
}

/* =======================================================================
   4. 描画（上画面）
   ======================================================================= */
const cv=$('#cv'), g=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  const r=cv.getBoundingClientRect();
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.max(1,Math.round(r.width)); H=Math.max(1,Math.round(r.height));
  cv.width=W*DPR; cv.height=H*DPR;
  g.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);

function roundRect(x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
/* 背景：スタンド・照明・空 */
function drawBack(camX, surface){
  const sky=g.createLinearGradient(0,0,0,H*.55);
  sky.addColorStop(0,'#0b1520'); sky.addColorStop(1,'#132a26');
  g.fillStyle=sky; g.fillRect(0,0,W,H*.56);
  // 照明塔
  const off=(camX*0.12)%160;
  for(let i=-1;i<W/160+2;i++){
    const x=i*160-off;
    g.fillStyle='#0d1a1c'; g.fillRect(x+28,H*.17,3,H*.28);
    g.fillStyle='rgba(240,255,220,.16)';
    g.beginPath(); g.ellipse(x+29,H*.16,17,7,0,0,7); g.fill();
    g.fillStyle='rgba(240,255,220,.05)';
    g.beginPath(); g.moveTo(x+29,H*.16); g.lineTo(x-30,H*.56); g.lineTo(x+88,H*.56); g.closePath(); g.fill();
  }
  // スタンド
  const so=(camX*0.35)%54;
  g.fillStyle='#101f21'; g.fillRect(0,H*.36,W,H*.20);
  for(let i=-1;i<W/54+2;i++){
    const x=i*54-so;
    g.fillStyle='rgba(255,255,255,.045)'; g.fillRect(x+4,H*.385,44,H*.13);
    g.fillStyle='rgba(120,200,255,.05)'; g.fillRect(x+4,H*.385,44,3);
  }
  g.fillStyle='#0a1512'; g.fillRect(0,H*.545,W,H*.03);
}
/* 馬（横から見た走行）。s は体長のおおよそのピクセル数。 */
function drawHorse(x,y,s,coat,waku,num,phase,running,hl,label){
  const c=COATS[coat]||COATS[0];
  const dark=c.m||'#2b1a10';
  const legCol = coat===3 ? '#8d8781' : dark;   // 芦毛は脚も淡い
  g.save(); g.translate(x,y);
  const ground=s*0.50;
  // 接地影（馬体の上下動には追従させない）
  g.globalAlpha=.30; g.fillStyle='#000';
  g.beginPath(); g.ellipse(0,ground,s*0.46,s*0.068,0,0,7); g.fill(); g.globalAlpha=1;
  const bob = running? Math.sin(phase*2)*s*0.045 : 0;
  g.translate(0,bob);
  g.lineCap='round'; g.lineJoin='round';

  // 脚：肩/寛から膝、球節までの2関節。ギャロップは前後で半周期ずらす。
  const leg=(ax,ay,off,amp,len,col,w,stand)=>{
    g.strokeStyle=col; g.lineWidth=Math.max(1,w);
    const p=phase+off;
    const sw  = running? Math.sin(p)*amp : stand;      // 静止時も前後の肢をわずかにずらす
    const bend= running? Math.max(0,Math.cos(p))*0.85+0.18 : 0.14;
    const L=len*s;
    const kx=ax+Math.sin(sw)*L*0.55,       ky=ay+Math.cos(sw)*L*0.55;
    const fx=kx+Math.sin(sw-bend)*L*0.52,  fy=ky+Math.cos(sw-bend)*L*0.52;
    g.beginPath(); g.moveTo(ax,ay); g.lineTo(kx,ky);
    g.lineTo(fx,Math.min(fy,ground-bob)); g.stroke();
  };
  // 奥側の対（暗く細く＝奥行き）
  g.globalAlpha=.72;
  leg(-0.28*s,0.09*s, 0.7, 0.52, 0.38, legCol, s*0.055, -0.13);
  leg( 0.265*s,0.10*s, 3.7, 0.56, 0.36, legCol, s*0.055,  0.12);
  g.globalAlpha=1;

  // 尾
  g.strokeStyle=dark; g.lineWidth=s*0.075;
  g.beginPath(); g.moveTo(-0.42*s,-0.08*s);
  g.quadraticCurveTo(-0.60*s,-0.04*s+(running?Math.sin(phase*1.1)*0.05*s:0.02*s),-0.70*s,0.13*s);
  g.stroke();

  // 胴（後躯・腹・肩の3塊で馬らしいシルエットを作る）
  g.fillStyle=c.c;
  g.beginPath(); g.ellipse(-0.21*s,-0.03*s,0.25*s,0.205*s,0,0,7); g.fill();
  g.beginPath(); g.ellipse( 0.05*s, 0.00*s,0.33*s,0.180*s,0,0,7); g.fill();
  g.beginPath(); g.ellipse( 0.26*s,-0.05*s,0.19*s,0.185*s,0,0,7); g.fill();

  // 首（走行時は前へ低く、静止時はやや起こす）
  const nx=running?0.575:0.535, ny=running?-0.34:-0.33;
  g.beginPath();
  g.moveTo(0.30*s,-0.17*s);
  g.quadraticCurveTo(0.47*s,-0.20*s,nx*s,ny*s);
  g.lineTo((nx+0.115)*s,(ny+0.03)*s);
  g.quadraticCurveTo(0.58*s,-0.13*s,0.42*s,0.04*s);
  g.closePath(); g.fill();

  // 頭
  // 走行時は首を伸ばして鼻先が前、静止時は鼻面を下げて立ち姿にする
  g.save(); g.translate((nx+0.055)*s,(ny-0.015)*s); g.rotate(running?-0.30:0.30);
  g.fillStyle=c.c;
  g.beginPath(); g.ellipse(0,0,0.128*s,0.066*s,0,0,7); g.fill();
  g.fillStyle=dark;
  g.beginPath(); g.ellipse(0.110*s,0.010*s,0.030*s,0.040*s,0,0,7); g.fill();
  g.beginPath(); g.moveTo(-0.09*s,-0.042*s); g.lineTo(-0.122*s,-0.135*s); g.lineTo(-0.038*s,-0.060*s); g.closePath(); g.fill();
  g.fillStyle='#0c0a08';
  g.beginPath(); g.ellipse(-0.020*s,-0.026*s,0.015*s,0.015*s,0,0,7); g.fill();
  g.restore();

  // たてがみ
  g.strokeStyle=dark; g.lineWidth=s*0.055;
  g.beginPath(); g.moveTo(0.345*s,-0.165*s);
  g.quadraticCurveTo(0.47*s,-0.27*s,(nx+0.01)*s,(ny-0.01)*s); g.stroke();

  // 手前側の対（胴より前面。ギャロップは前後を半周期ずらす）
  leg(-0.255*s,0.10*s, 0.0, 0.60, 0.40, legCol, s*0.068,  0.11);
  leg( 0.290*s,0.11*s, 3.0, 0.62, 0.38, legCol, s*0.068, -0.10);

  // 騎手
  if(running||hl){
    const col=WAKU[clamp(waku,0,7)];
    g.fillStyle='#2b2118';
    g.beginPath(); g.ellipse(0.04*s,-0.19*s,0.17*s,0.052*s,-0.05,0,7); g.fill();
    g.fillStyle=col;
    g.beginPath();
    g.moveTo(-0.05*s,-0.21*s);
    g.quadraticCurveTo(0.05*s,-0.42*s,0.215*s,-0.375*s);
    g.quadraticCurveTo(0.14*s,-0.23*s,0.10*s,-0.17*s);
    g.closePath(); g.fill();
    g.strokeStyle=col; g.lineWidth=s*0.05;
    g.beginPath(); g.moveTo(0.17*s,-0.345*s); g.lineTo(0.395*s,-0.255*s); g.stroke();
    g.strokeStyle='#171b22'; g.lineWidth=s*0.055;
    g.beginPath(); g.moveTo(0.02*s,-0.255*s); g.lineTo(-0.01*s,-0.125*s); g.stroke();
    g.fillStyle=col;
    g.beginPath(); g.arc(0.255*s,-0.405*s,0.075*s,0,7); g.fill();
    g.fillStyle='#11151c';
    g.beginPath(); g.ellipse(0.305*s,-0.415*s,0.035*s,0.016*s,-0.1,0,7); g.fill();
  }
  // 砂／芝の飛沫
  if(running){
    g.fillStyle='rgba(255,255,255,.10)';
    for(let i=0;i<3;i++){
      const t=(phase*0.7+i*2.1)%3;
      g.beginPath(); g.ellipse(-0.5*s-t*0.14*s, ground-t*0.06*s, s*0.05*(1+t*.3), s*0.028*(1+t*.3),0,0,7); g.fill();
    }
  }
  // 自馬だけ馬番を出す（団子の中でも見失わないように）
  if(label){
    g.fillStyle='rgba(6,12,10,.85)';
    roundRect(-0.16*s,-0.78*s,0.32*s,0.22*s,2); g.fill();
    g.strokeStyle='#f4c44a'; g.lineWidth=1; g.stroke();
    g.fillStyle='#f4c44a';
    g.font=`${Math.max(8,s*0.17)}px "DotGothic16",monospace`;
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText(num,0,-0.665*s);
    g.beginPath(); g.moveTo(-0.05*s,-0.54*s); g.lineTo(0.05*s,-0.54*s); g.lineTo(0,-0.47*s); g.closePath(); g.fill();
  }
  g.restore();
}
/* 芝／ダートの路面 */
/* 画面に映すコースの横幅（m）。狭いと隊列が画面外に出てしまう。 */
const VIEW_M = 44;
function drawTrack(camX, surface, D, bend){
  bend=bend||0;
  const top=H*.575, bot=H;
  const base = surface==='芝'
    ? ['#1f6b3c','#25793f','#194f2d']
    : ['#8a6039','#9a6c40','#6d492b'];
  const grd=g.createLinearGradient(0,top,0,bot);
  grd.addColorStop(0,base[2]); grd.addColorStop(.35,base[0]); grd.addColorStop(1,base[1]);
  g.fillStyle=grd; g.fillRect(0,top,W,bot-top);
  // 縞（芝の刈り跡）
  const M2P = W/VIEW_M;
  const o=(camX*M2P)%(M2P*5);
  g.globalAlpha= surface==='芝'?.10:.06;
  for(let i=-1;i<W/(M2P*5)+2;i++){
    g.fillStyle= i%2? '#ffffff':'#000000';
    g.fillRect(i*M2P*5-o,top,M2P*5,bot-top);
  }
  g.globalAlpha=1;
  // ラチ（コーナーでは内ラチが弧を描き、旋回しているのが分かる）
  const bow = x => -bend*26*Math.sin(Math.PI*(x/W));   // 画面中央がいちばん膨らむ
  g.strokeStyle='rgba(255,255,255,.5)'; g.lineWidth=2;
  g.beginPath();
  g.moveTo(0,top+2);
  g.quadraticCurveTo(W/2,top+2+bow(W/2)*2,W,top+2);
  g.stroke();
  const po=(camX*M2P)%(M2P*10);
  g.fillStyle='rgba(255,255,255,.35)';
  for(let i=-1;i<W/(M2P*10)+2;i++){
    const px=i*M2P*10-po;
    g.fillRect(px,top-8+bow(px),2,10);
  }
  // 残り距離ハロン棒
  for(const rem of [1000,800,600,400,200]){
    const px=(D-rem-camX)*M2P;
    if(px>-40 && px<W+40){
      g.fillStyle='#f2f2f2'; g.fillRect(px,top-26,3,26);
      g.fillStyle='#e0334a'; g.fillRect(px-6,top-30,15,9);
      g.fillStyle='#fff'; g.font='7px "DotGothic16",monospace'; g.textAlign='center';
      g.fillText(rem, px+1, top-23);
    }
  }
  // ゴール板
  const gx=(D-camX)*M2P;
  if(gx>-60&&gx<W+60){
    g.fillStyle='#f4c44a'; g.fillRect(gx-1,top-46,4,46);
    g.fillStyle='#131820'; g.fillRect(gx-22,top-62,46,18);
    g.strokeStyle='#f4c44a'; g.lineWidth=1; g.strokeRect(gx-22,top-62,46,18);
    g.fillStyle='#f4c44a'; g.font='10px "DotGothic16",monospace'; g.textAlign='center';
    g.fillText('GOAL',gx+1,-0+top-49);
    for(let i=0;i<6;i++){ g.fillStyle=i%2?'#fff':'#111'; g.fillRect(gx-22+i*7.6,top-44,7.6,3); }
  }
}
/* 出走中の全馬。奥のレーンから手前へ描いて重なりに奥行きを出す。 */
function drawField(sim, camX){
  const M2P=W/VIEW_M, n=sim.run.length;
  sim.run.forEach((r,i)=>{
    r.laneY = H*0.615 + (i/Math.max(1,n-1))*H*0.315;
    r.laneJit = (i%2)?0.6:-0.6;      // 完全に重ならないよう前後に少しずらす
  });
  [...sim.run].sort((a,b)=>a.laneY-b.laneY).forEach(r=>{
    const px=(r.x+r.laneJit-camX)*M2P;
    if(px<-70||px>W+70) return;
    const sc=Math.min(W*0.085,H*0.13)*(0.80+(r.laneY/H)*0.36);
    drawHorse(px,r.laneY,sc,r.h.coat,r.h.num-1,r.h.num,r.phase,true,!r.h.npc,!r.h.npc);
  });
}
/* 厩舎シーン */
function drawStable(h, t){
  const grd=g.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'#101b16'); grd.addColorStop(1,'#0a120e');
  g.fillStyle=grd; g.fillRect(0,0,W,H);
  // 板壁
  g.fillStyle='#1b1611';
  g.fillRect(0,0,W,H*.62);
  for(let i=0;i<8;i++){
    g.fillStyle= i%2?'#221b14':'#1d1710';
    g.fillRect(0,i*(H*.62/8),W,H*.62/8-1);
  }
  // 窓の月明かり
  const wx=W*.62, wy=H*.10, ww=W*.22, wh=H*.20;
  g.fillStyle='rgba(150,200,255,.07)'; g.fillRect(wx,wy,ww,wh);
  g.strokeStyle='rgba(150,200,255,.20)'; g.lineWidth=2; g.strokeRect(wx,wy,ww,wh);
  g.lineWidth=1;
  g.beginPath(); g.moveTo(wx+ww/2,wy); g.lineTo(wx+ww/2,wy+wh);
  g.moveTo(wx,wy+wh/2); g.lineTo(wx+ww,wy+wh/2); g.stroke();
  // 床（藁）
  g.fillStyle='#2a2114'; g.fillRect(0,H*.62,W,H*.38);
  g.globalAlpha=.5;
  for(let i=0;i<70;i++){
    const x=(i*79)%W, y=H*.63+((i*53)%(H*.35));
    g.strokeStyle='#5a4626'; g.lineWidth=1;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+7,y+2); g.stroke();
  }
  g.globalAlpha=1;
  // 飼い葉桶
  g.fillStyle='#2f2417'; roundRect(W*.06,H*.72,W*.16,H*.10,3); g.fill();
  g.fillStyle='#6b5323'; roundRect(W*.07,H*.725,W*.14,H*.035,2); g.fill();
  // 吊りランプ。馬体が背景の板壁に沈まないよう、光だまりで浮かせる
  const lx=W*.52, ly=H*.085;
  const lamp=g.createRadialGradient(lx,ly,3,lx,H*.72,W*.55);
  lamp.addColorStop(0,'rgba(255,214,150,.26)');
  lamp.addColorStop(.45,'rgba(255,196,124,.11)');
  lamp.addColorStop(1,'rgba(255,186,110,0)');
  g.fillStyle=lamp; g.fillRect(0,0,W,H);
  g.fillStyle='#3a3026'; g.fillRect(lx-1,0,2,H*.055);
  g.fillStyle='#ffd98a';
  g.beginPath(); g.moveTo(lx-10,H*.09); g.lineTo(lx+10,H*.09);
  g.lineTo(lx+5,H*.055); g.lineTo(lx-5,H*.055); g.closePath(); g.fill();
  // 馬（呼吸で上下）
  const s=Math.min(W*0.26,H*0.38);
  const breathe=Math.sin(t/900)*s*0.012;
  drawHorse(W*0.52,H*0.74+breathe,s,h.coat,0,0,Math.sin(t/700)*0.18,false,false);
}
/* 調教シーン */
function drawTraining(h, menu, t, prog){
  const surf = menu==='ダート'?'ダート':'芝';
  drawBack(t*0.02, surf);
  drawTrack(t*0.012, surf, 99999);
  const s=Math.min(W*0.20,H*0.30);
  const x = W*0.18 + (W*0.5)*Math.min(1,prog*1.3);
  drawHorse(x, H*0.80, s, h.coat, 0, 0, t/70, true, true);
  if(menu==='プール'){
    g.fillStyle='rgba(70,150,220,.35)'; g.fillRect(0,H*.72,W,H*.28);
    g.strokeStyle='rgba(180,230,255,.5)'; g.lineWidth=1;
    for(let i=0;i<5;i++){
      g.beginPath();
      g.moveTo(0,H*.74+i*8+Math.sin(t/200+i)*2);
      g.lineTo(W,H*.74+i*8+Math.cos(t/240+i)*2); g.stroke();
    }
  }
}
/* 表彰／結果 */
function drawPodium(field, res, mePos, t){
  const grd=g.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'#0d1a14'); grd.addColorStop(1,'#07110c');
  g.fillStyle=grd; g.fillRect(0,0,W,H);
  if(mePos===1){
    for(let i=0;i<46;i++){
      const p=((t/12)+i*37)%(H+40);
      g.fillStyle=WAKU[i%8]; g.globalAlpha=.85;
      g.fillRect((i*67)%W, p-40, 4, 7);
    }
    g.globalAlpha=1;
  }
  const s=Math.min(W*0.26,H*0.38);
  const top=res[0].h, num=top.num||1;
  drawHorse(W*0.5,H*0.78,s,top.coat,clamp(num-1,0,7),num,Math.sin(t/600)*0.15,false,true);
  g.fillStyle='#f4c44a'; g.font='11px "DotGothic16",monospace';
  g.textAlign='center'; g.textBaseline='alphabetic';
  g.fillText((mePos===1?'1着 ':'')+top.name, W*0.5, H*0.30);
}

let view='title', viewData=null;
function show(v,d){
  view=v; viewData=d;
  panel.innerHTML = V[v] ? V[v](d) : '';
  panel.scrollTop=0;
  const inGame = ['home','horse','shop','record'].includes(v);
  tabs.hidden = !inGame;
  if(inGame){
    [...tabs.children].forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===v)));
    G.tab=v;
  }
  syncMeters();
}
function syncMeters(){
  $('#mMedal').textContent = G? yen(G.medals) : '0';
  $('#mDate').textContent  = G&&G.horse? `${G.year}歳${G.week}週` : '--';
}
function setHud(html){ hud.innerHTML=html; }
let toastTimer=null;
function toast(msg){
  const el=$('#toast'); if(!el) return;
  el.textContent=msg; el.hidden=false;
  requestAnimationFrame(()=>el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=>{ el.hidden=true; },260);
  },1500);
}
function say(txt, hot){
  if(REDUCE){ ticker.innerHTML=`<span class="${hot?'cur':''}">${esc(txt)}</span>`; return; }
  app.tickText=txt; app.tickIdx=0; app.tickHot=hot;
}
function tickerStep(){
  if(app.tickText==null) return;
  if(app.tickIdx<app.tickText.length){
    app.tickIdx+=1.6;
    const s=app.tickText.slice(0,Math.floor(app.tickIdx));
    ticker.innerHTML=`<span class="${app.tickHot?'cur':''}">${esc(s)}</span><span class="cur">▌</span>`;
  }else{
    ticker.innerHTML=`<span class="${app.tickHot?'cur':''}">${esc(app.tickText)}</span>`;
  }
}

/* =======================================================================
   8. ゲーム進行
   ======================================================================= */
function logLine(t){ G.log.unshift(t); G.log.length=Math.min(G.log.length,30); }

/* silent=true のときは画面を書き換えない（アルバイトでまとめて週を送る用） */
function advanceWeek(silent){
  const h=G.horse;
  h.fatigue=clamp(h.fatigue-2.5,0,100);
  h.cond=clamp(h.cond + (h.fatigue>70?-5:h.fatigue<25?4:1) + rint(-3,3), 5, 100);
  if(h.rest>0){ h.rest--; h.fatigue=clamp(h.fatigue-9,0,100); h.cond=clamp(h.cond+6,0,100); }
  G.week++;
  if(G.week>WEEKS_PER_YEAR){ G.week=1; G.year++; }
  if(G.year>5){ return retire(); }
  save();
  if(!silent){ show('home'); drawScene(); }
  return true;
}
/* まとめて週を送る。引退に達したら false（引退画面がすでに出ている）。 */
function advanceWeeks(n){
  for(let i=0;i<n;i++){ if(advanceWeek(true)===false) return false; }
  return true;
}
function doWork(i){
  const j=JOBS[i], h=G.horse;
  if(!j||!h) return;
  const ok = Math.random() < j.rate;
  const pay = ok ? j.win : j.lose;
  G.medals += pay;
  h.fatigue = clamp(h.fatigue-20,0,100);   // 馬は4週間ゆっくり休める
  logLine(`${j.k} +${pay}枚`);
  ok ? SFX.coin() : SFX.err();
  say(`${j.k}のアルバイト。${ok?j.okTxt:j.ngTxt} ${pay}枚。`, ok);
  if(advanceWeeks(WORK_WEEKS)===false) return;   // 途中で引退した
  save();
  show('workresult',{job:j, ok, pay});
  drawScene();
}

function doTrain(i){
  const h=G.horse, m=TRAIN[i];
  if(h.fatigue>82 && Math.random()<0.12){
    h.rest=rint(5,9); h.fatigue=clamp(h.fatigue-10,0,100);
    STAT_KEYS.forEach(([k])=>{ h[k]=Math.max(10,h[k]-rnd(3,1)); });
    SFX.err();
    logLine('故障');
    app.trainMenu=null;
    show('home');
    say(`${h.name}が脚元に不安を訴えた…… ${h.rest}週の休養へ。`, true);
    save(); drawScene();
    return;
  }
  /* 1年50週＝キャリア150ターン。1回あたりの上がり幅を小さくして、
     3年かけて伸びる曲線にする（係数を上げると1年目で頭打ちになる）。 */
  const cap=capOf(h,G.year), cm=COND_NAME[condIdx(h)].m;
  const gains=[];
  for(const [k,mul] of Object.entries(m.up)){
    const room=clamp(1-h[k]/cap,0.05,1);
    const g0 = mul*1.55*room*cm*rnd(1.35,.7);
    h[k]=Math.min(cap+2,h[k]+g0);
    gains.push([k,g0]);
  }
  h.fatigue=clamp(h.fatigue+m.f+rint(-1,2),0,100);
  h.cond=clamp(h.cond-(m.f>9?3:1)+rint(-2,3),5,100);
  app.trainMenu=m.k; app.trainT=0; app.scene='training';
  app.gains=gains;
  SFX.tap();
  const txt = gains.map(([k,v])=>`${STAT_KEYS.find(s=>s[0]===k)[1]}+${v.toFixed(1)}`).join('　');
  say(`${m.k}調教。${txt}`);
  // 週ターンは回数が多いので演出は短く。タップで即スキップできる。
  app.trainDone=()=>{ app.trainDone=null; app.scene='stable'; advanceWeek(); };
  setTimeout(()=>{ if(app.trainDone) app.trainDone(); }, REDUCE?60:750);
  panel.innerHTML=`<div class="center" style="padding:24px 8px">
    <p class="eyebrow">TRAINING</p><h2 class="big gold">${m.k}</h2>
    <p class="muted" style="margin-top:8px">${esc(txt)}</p>
    <p class="dot" style="margin-top:10px;font-size:10px;color:var(--ink-3)">タップでスキップ</p></div>`;
  tabs.hidden=true;
}
function buyItem(i){
  const it=ITEMS[i], h=G.horse;
  if(!h||!it) return;
  if(G.medals<it.p){ SFX.err(); toast('メダルが足りない'); return; }
  const lim=capOf(h,G.year)+ITEM_OVER;
  G.medals-=it.p;
  h.fatigue=clamp(h.fatigue-it.fat,0,100);
  h.cond=clamp(h.cond+it.cond,5,100);
  const ups=[];
  const bump=k=>{
    const before=h[k];
    h[k]=Math.min(lim,h[k]+it.up);
    if(h[k]-before>0.05) ups.push(`${STAT_KEYS.find(s=>s[0]===k)[1]}+${(h[k]-before).toFixed(1)}`);
  };
  if(it.mode==='all') STAT_KEYS.forEach(([k])=>bump(k));
  else if(it.mode==='random') bump(pick(STAT_KEYS)[0]);
  else bump(app.shopStat||'sp');
  SFX.coin();
  const msg = ups.length ? ups.join('　') : '能力はもう上限に届いている';
  toast(`${it.k}　${msg}`);
  say(`${h.name}に${it.k}。${msg}`);
  logLine(`${it.k}を使った`);
  save();
  show('shop');
}
function doRest(){
  const h=G.horse;
  h.fatigue=clamp(h.fatigue-28,0,100);
  h.cond=clamp(h.cond+12,5,100);
  SFX.ok();
  say(`${h.name}はゆっくりと休んだ。疲労が抜けていく。`);
  advanceWeek();
}

/* --- 出走 --- */
function openEntry(i){
  const rs=racesFor(G), r=rs[i];
  if(!r) return;
  app.race=r;
  app.field=makeField(G,r);
  app.odds=makeOdds(app.field,r);
  app.bets=[]; app.betSel=null;
  const meIdx=app.field.findIndex(h=>!h.npc);
  app.sim=new RaceSim(r,app.field,meIdx);
  app.scene='paddock';
  SFX.gate();
  say(`${r.n}。${r.s}${r.d}m、${app.field.length}頭立て。`);
  show('bet');
  drawScene();
}
function placeBet(type,amt){
  if(app.betSel==null || G.medals<amt) { SFX.err(); return; }
  G.medals-=amt;
  app.bets.push({i:app.betSel,type,amt});
  SFX.coin();
  show('bet');
}
/* 位置表示板の下地。コーナー区間・直線・坂の位置をコース特性から描く。 */
function buildMapBase(sim){
  const ss=sim.sStart*100, cs=sim.cStart*100;
  let h='';
  h+=`<span class="corner" style="left:12%;width:${Math.max(0,ss-12)}%"></span>`;
  h+=`<span class="corner last" style="left:${cs}%;width:${Math.max(0,ss-cs)}%"></span>`;
  h+=`<span class="straightz" style="left:${ss}%;width:${100-ss}%"></span>`;
  if(sim.course.slope>=0.7) h+=`<span class="hill" style="left:${(1-200/sim.D)*100}%"></span>`;
  h+='<span class="rail"></span><span class="goal"></span>';
  return h;
}
function startRace(){
  app.scene='race'; app.raceT=0; app.speed=1; evIdx=0;
  app.sim.me.whip=3;
  app.mapBase=buildMapBase(app.sim);
  tmap.hidden=false;
  SFX.gate();
  show('race');
  tabs.hidden=true;
}
function finishRace(){
  const sim=app.sim, r=app.race, h=G.horse;
  const res=sim.result, me=res.find(x=>!x.h.npc);
  const prizeTable=[1,.40,.25,.15,.10,0,0,0];
  const prize=Math.round(prizeOf(r)*(prizeTable[me.pos-1]||0));
  let pay=0, spent=0;
  for(const b of app.bets){
    spent+=b.amt;
    const fr=res.find(x=>x.h===app.field[b.i]);
    const o=app.odds[b.i];
    if(b.type==='win' && fr.pos===1) pay+=Math.round(b.amt*o.win);
    if(b.type==='plc' && fr.pos<=3)  pay+=Math.round(b.amt*o.plc);
  }
  G.medals+=prize+pay;
  h.races++; h.earned+=prize;
  h.fatigue=clamp(h.fatigue+rint(22,30),0,100);
  h.cond=clamp(h.cond-rint(4,12),5,100);
  h.fans+=Math.round(prize/12 + (me.pos===1?400:0));
  let up=null;
  if(me.pos===1){
    h.wins++;
    if(r.g==='jo' && h.cls<4){ h.cls++; up=`${CLASS_NAME[h.cls]}に昇級した！`; }
    if(r.g==='G1'||r.g==='G2'||r.g==='G3') h.g1++;
    SFX.win();
  }else if(me.pos<=3) SFX.ok(); else SFX.lose();
  G.history.push({y:G.year,w:G.week,n:r.n,pos:me.pos,gain:prize+pay-spent});
  logLine(`${r.n} ${me.pos}着`);
  app.scene='podium'; app.podT=0; app.podRes=res; app.podPos=me.pos;
  tmap.hidden=true;
  say(me.pos===1?`${h.name}、${r.n}制覇！`:`${h.name}は${me.pos}着でゴール。`, me.pos===1);
  show('result',{res,race:r,mePos:me.pos,prize,pay,spent,net:prize+pay-spent,up});
  save();
}
function retire(){
  const h=G.horse;
  const score = h.wins*10 + h.g1*45 + h.earned/2600 + G.medals/5200;
  const rank = score>=150?'S' : score>=100?'A' : score>=62?'B' : score>=30?'C' : 'D';
  const comment = ({
    S:'ターフの歴史に名を刻む名馬となった。',
    A:'幾多の強敵を退けた、記憶に残る一頭。',
    B:'堅実に走り続けた愛すべき相棒。',
    C:'大成はしなかったが、確かに走り抜いた。',
    D:'結果は出なかった。次の馬に託そう。'
  })[rank];
  const legacy = {S:12,A:8,B:5,C:3,D:1}[rank];
  G.careers.push({name:h.name,races:h.races,wins:h.wins,g1:h.g1,earned:h.earned,rank});
  G.legacy = legacy;
  app.scene='podium'; app.podRes=[{h}]; app.podPos= rank==='S'?1:4; app.podT=0;
  SFX.win();
  say(`${h.name}、引退。総合評価 ${rank}。`, true);
  show('end',{name:h.name,rank,comment,races:h.races,wins:h.wins,g1:h.g1,earned:h.earned,legacy});
  tabs.hidden=true;
  /* 世代交代の状態はここで確定させる（引退画面の内容は上の d から描画済み）。
     こうしないと「6歳・引退済みの馬」がセーブに残ってしまう。 */
  G.horse=null; G.history=[]; G.year=3; G.week=1; G.cands=null; G.tab='home';
  syncMeters();
  save();
  return false;
}

/* =======================================================================
   9. 操作
   ======================================================================= */
const ACT = {
  newgame(){ G=blank(); SFX.boot(); SFX.tap(); show('pick'); app.scene='stable'; },
  continue(){ const s=load(); if(!s){SFX.err();return;} G=s; SFX.boot(); SFX.ok();
    if(!G.horse){ show('pick'); } else { app.scene='stable'; show(G.tab||'home'); }
    drawScene(); },
  help(){ SFX.tap(); show('help'); },
  back(){ SFX.tap(); show('title'); },
  choose(d){ G.pickIdx=+d.i; SFX.tap(); show('name'); },
  reroll(){ const h=G.cands[G.pickIdx]; h.name=horseName(); SFX.tap(); show('name'); },
  register(){
    const v=$('#nm'); const nm=(v&&v.value.trim())||G.cands[G.pickIdx].name;
    G.horse=G.cands[G.pickIdx];
    G.horse.name=nm.slice(0,9);
    G.horse.legacy=G.legacy||0;
    G.cands=null; G.pickIdx=null;
    app.scene='stable';
    SFX.ok();
    say(`${G.horse.name}が厩舎にやってきた。デビューを目指そう。`);
    show('home'); save(); drawScene();
  },
  save(){ save(); SFX.coin(); toast('セーブしました'); },
  work(){ SFX.tap(); show('work'); },
  dojob(d){ doWork(+d.i); },
  backhome(){ SFX.tap(); show('home'); },
  buy(d){ buyItem(+d.i); },
  pickstat(d){ app.shopStat=d.k; SFX.tap(); show('shop'); },
  train(d){ doTrain(+d.i); },
  rest(){ doRest(); },
  advance(){ SFX.tap(); advanceWeek(); },
  entry(d){ openEntry(+d.i); },
  pickhorse(d){ app.betSel=+d.i; SFX.tap(); show('bet'); },
  bet(d){ placeBet(d.t,+d.a); },
  clearbet(){ for(const b of app.bets) G.medals+=b.amt; app.bets=[]; SFX.tap(); show('bet'); },
  cancelrace(){ app.scene='stable'; app.sim=null; for(const b of app.bets) G.medals+=b.amt; app.bets=[];
    tmap.hidden=true; SFX.tap(); show('home'); drawScene(); },
  startrace(){ startRace(); },
  spurt(){ const s=app.sim; if(!s||s.done) return; s.me.spurt=!s.me.spurt;
    const b=$('#spurBtn'); if(b){ b.classList.toggle('on',s.me.spurt); b.firstChild.textContent=s.me.spurt?'全力！':'追い出す'; }
    SFX.tap(); },
  whip(){ const s=app.sim; if(!s||s.done||s.me.whip<=0) return;
    s.me.whip--; s.me.whipT=2.2; SFX.whip();
    const p=$('#whipPips'); if(p) p.textContent='●●●'.slice(0,s.me.whip)+'○○○'.slice(0,3-s.me.whip);
    if(s.me.stam<0.12) s.events.push({t:s.t,txt:'反応がない！もう脚がない！',hot:true}); },
  speed(){ app.speed = app.speed===1?2:app.speed===2?4:1;
    const b=$('#spdBtn'); if(b) b.textContent='×'+app.speed; SFX.tap(); },
  /* スキップ＝スタートを見せたあとコーナーを飛ばして直線から中継を再開する。
     すでに直線に入っていれば、そのまま結果まで送る。 */
  skip(){
    const s=app.sim; if(!s||s.done) return;
    if(s.leader && s.leader.x >= s.D*s.sStart){ s.skipToEnd(); finishRace(); return; }
    s.skipTo(s.sStart);
    evIdx=Math.max(0,s.events.length-1);      // 飛ばした区間の実況は流さない
    SFX.gate();
    const b=$('#skipBtn'); if(b) b.textContent='結果へ';
    if(s.done) finishRace();
  },
  afterrace(){ app.scene='stable'; app.sim=null; SFX.tap(); advanceWeek(); },
  nextgen(){ app.scene='stable'; SFX.tap(); show('pick'); save(); },
  reset(){ if(!confirm('セーブデータを消して最初からやり直す？')) return; wipe(); G=blank(); app.scene='title'; tmap.hidden=true; show('title'); }
};
panel.addEventListener('click',e=>{
  if(app.trainDone){ app.trainDone(); return; }   // 調教演出はタップで飛ばせる
  const b=e.target.closest('[data-act]'); if(!b) return;
  SFX.boot();
  const fn=ACT[b.dataset.act]; if(fn) fn(b.dataset);
});
$('.top').addEventListener('click',()=>{ if(app.trainDone) app.trainDone(); });
tabs.addEventListener('click',e=>{
  const b=e.target.closest('[data-tab]'); if(!b) return;
  SFX.tap(); show(b.dataset.tab);
});
$('#mute').addEventListener('click',e=>{
  SFX.on=!SFX.on;
  e.currentTarget.setAttribute('aria-pressed',String(SFX.on));
  e.currentTarget.textContent = SFX.on?'♪':'✕';
});
addEventListener('keydown',e=>{
  if(app.scene!=='race') return;
  if(e.code==='Space'){ e.preventDefault(); ACT.spurt(); }
  if(e.code==='KeyW'){ ACT.whip(); }
});

/* =======================================================================
   10. メインループ
   ======================================================================= */
let last=performance.now(), evIdx=0;
/* 描画ループは常時1本だけ回る。drawScene() は画面遷移直後の即時反映用。 */
function drawScene(){ render(performance.now(), 0); }
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  render(now,dt);
  tickerStep();
  requestAnimationFrame(loop);
}

function render(now, dt){
  const r=cv.getBoundingClientRect();
  if(Math.round(r.width)!==W || Math.round(r.height)!==H) resize();
  g.clearRect(0,0,W,H);

  /* 愛馬が未登録のシーン（タイトル・馬選び）はデモ走行を映す */
  const needsHorse = ['stable','training'].includes(app.scene);
  if(!G || app.scene==='title' || (needsHorse && !G.horse)){
    drawBack(now*0.004,'芝'); drawTrack(now*0.0015,'芝',99999);
    const s=Math.min(W*0.19,H*0.29);
    drawHorse(W*0.30+((now/26)%(W*1.5))-W*0.2,H*0.80,s,0,2,0,now/90,true,true);
    setHud(`<span class="chip gold">POCKET TURF</span><span class="chip">ARCADE MODE</span>`);
  }
  else if(app.scene==='stable'){
    drawStable(G.horse,now);
    const h=G.horse, c=COND_NAME[condIdx(h)];
    setHud(`<span class="chip gold">${esc(h.name)}</span>
      <span class="chip">${CLASS_NAME[h.cls]} <b>${h.races}戦${h.wins}勝</b></span>`);
  }
  else if(app.scene==='training'){
    app.trainT+=dt;
    drawTraining(G.horse,app.trainMenu,now,app.trainT/1.4);
    setHud(`<span class="chip gold">${esc(app.trainMenu)}調教</span>`);
    if(app.gains){
      g.font='11px "DotGothic16",monospace'; g.textAlign='left';
      app.gains.forEach(([k,v],i)=>{
        const a=clamp(app.trainT*2,0,1);
        g.globalAlpha=clamp(1.6-app.trainT,0,1);
        g.fillStyle='#f4c44a';
        g.fillText(`+${v.toFixed(1)} ${STAT_KEYS.find(s=>s[0]===k)[1]}`, W*0.58, H*0.30+i*15-a*10);
      });
      g.globalAlpha=1;
    }
  }
  else if(app.scene==='paddock'){
    drawBack(now*0.002,app.race.s); drawTrack(0,app.race.s,99999);
    const n=app.field.length;
    for(let i=0;i<n;i++){
      const h=app.field[i];
      const s=Math.min(W*0.10,H*0.15);
      const x=W*(0.15+(i%4)*0.235) + Math.sin(now/1400+i)*4;
      const y=H*(0.56+Math.floor(i/4)*0.235);
      drawHorse(x,y,s,h.coat,h.num-1,h.num,now/900+i,false,true);
    }
    setHud(`<span class="chip gold">${esc(app.race.n)}</span>
      <span class="chip">${app.race.s}${app.race.d}m ${app.sim.pace}想定</span>`);
  }
  else if(app.scene==='race'){
    const sim=app.sim;
    if(!sim.done && dt>0){
      const SD=1/60;
      const steps=clamp(Math.round(dt/SD*app.speed),1,16);
      for(let i=0;i<steps && !sim.done;i++) sim.step(SD);
    }
    const me=sim.me, D=sim.D;
    const camX=clamp(me.x-16, 0, D+20);
    drawBack(camX,app.race.s);
    drawTrack(camX,app.race.s,D,sim.bendAt(me.x));
    drawField(sim,camX);
    const rem=Math.max(0,Math.round((D-me.x)/10)*10);
    const sec=sim.sectionOf(me.x);
    setHud(`<span class="chip">${esc(app.race.c||'東京')} <b>${sec}</b></span>
      <span class="chip">残り <b>${rem}</b>m</span>
      <span class="chip gold">${me.rank}<b>位</b></span>`);
    // 位置表示板と隊列は毎フレーム書き換えると重いので間引く
    app.uiT=(app.uiT||0)+dt;
    if(app.uiT>0.12 && sim.order){
      app.uiT=0;
      tmap.innerHTML=app.mapBase+
        sim.run.map(r=>`<i class="${r.h.npc?'':'me'}" style="left:${clamp(r.x/D*100,0,100)}%;background:${WAKU[r.h.num-1]}"></i>`).join('');
      const ll=$('#liveList'), lead=sim.order[0];
      if(ll) ll.innerHTML=sim.order.map(r=>{
        const back=Math.max(0,lead.x-r.x);
        return `<div class="lv ${r.h.npc?'':'me'}">
          <span class="p">${r.rank}</span>
          <span class="u" style="background:${WAKU[r.h.num-1]};color:${wakuInk(r.h.num)}">${r.h.num}</span>
          <span class="n">${esc(r.h.name)}</span>
          <span class="d">${r.fin?'ゴール':back<0.5?'先頭':'-'+back.toFixed(1)+'m'}</span>
        </div>`;
      }).join('');
    }
    // 実況
    while(evIdx<sim.events.length){ const e=sim.events[evIdx++]; say(e.txt,e.hot); }
    // 操作卓の同期
    const bar=$('#stamBar');
    if(bar){
      const v=clamp(me.stam,0,1)*100;
      bar.style.width=v+'%';
      bar.style.background = v>45?'linear-gradient(90deg,#5fd8e8,#63d98d)' : v>18?'linear-gradient(90deg,#f4c44a,#e8802e)':'#ff6b4a';
    }
    const pl=$('#posLbl');
    if(pl) pl.textContent=`${me.rank}番手・残り${rem}m`;
    if(sim.done){ setTimeout(finishRace, 500); app.scene='wait'; }
  }
  else if(app.scene==='podium'){
    app.podT=(app.podT||0)+dt*1000;
    drawPodium(app.field,app.podRes,app.podPos,now);
    setHud(`<span class="chip gold">RESULT</span>`);
  }
  else if(app.scene==='wait'){
    // フィニッシュ演出の余韻（最後のフレームを保持）
    const sim=app.sim;
    if(sim){
      const camX=clamp(sim.me.x-16,0,sim.D+20);
      drawBack(camX,app.race.s); drawTrack(camX,app.race.s,sim.D,0);
      drawField(sim,camX);
    }
    setHud(`<span class="chip gold">GOAL!</span>`);
  }
}

/* =======================================================================
   11. 起動
   ======================================================================= */
function boot(){
  resize();
  G = blank();
  show('title');
  say('ようこそ、ポケットターフへ。');
  requestAnimationFrame(t=>{ last=t; loop(t); });
}
/* バランス調整・検証用のフック（走破時計や着差を外から測れるようにする） */
window.PocketTurf = { RaceSim, newHorse, makeField, ratingOf, distFactor, RACES, ITEMS, JOBS, blank,
                      get state(){ return G; } };

try{ boot(); }
catch(err){
  panel.innerHTML='<div class="card"><b class="hot">読み込みに失敗しました</b><p class="muted">'+esc(err&&err.message||err)+'</p></div>';
  console.error(err);
}
})();
</script>
